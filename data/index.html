<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Dehesa Data — Datos agrícolas</title>
  <meta name="description" content="Datos agrícolas estructurados de Dehesa Index: observaciones, históricos, fuentes y metadatos de trazabilidad.">
  <link rel="canonical" href="https://dehesaindex.com/data/">
  <meta property="og:title" content="Dehesa Data — Datos agrícolas">
  <meta property="og:description" content="Capa de datos estructurados de Dehesa Index para análisis y uso B2B.">
  <meta property="og:url" content="https://dehesaindex.com/data/">
  <style>
    :root{--ink:#172018;--muted:#68716a;--line:#dfe4df;--paper:#f7f8f5;--accent:#2d5b43}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1050px;margin:0 auto;padding:56px 24px 80px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--accent);font-weight:700}
    h1{font-size:clamp(36px,6vw,64px);line-height:1.02;margin:10px 0 16px}.lead{max-width:720px;color:var(--muted);font-size:19px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:34px 0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.card h2{font-size:18px;margin:0 0 8px}.card p{color:var(--muted);margin:0 0 16px}.btn{display:inline-block;padding:9px 13px;border:1px solid var(--line);border-radius:9px;color:var(--accent);text-decoration:none;font-weight:650}
    .notice{border-left:4px solid var(--accent);background:white;padding:18px 20px;margin-top:28px}.back{display:inline-block;margin-bottom:30px;color:var(--muted);text-decoration:none}
  
  .observatory{margin-top:38px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.observatory h2{margin:6px 0 8px;font-size:26px}.obs-lead{color:var(--muted);max-width:780px}.obs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.obs-card{border:1px solid var(--line);border-radius:11px;padding:14px}.obs-top{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:13px}.obs-chip{font-size:9px;padding:3px 7px;border:1px solid var(--line);border-radius:999px}.obs-chip.stale{color:#8a5a00}.obs-chip.fresh{color:var(--accent)}.obs-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.obs-meta span{display:block;color:var(--muted);font-size:10px}.obs-meta b{font-size:12px}@media(max-width:900px){.obs-grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.obs-grid{grid-template-columns:1fr}}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .quality-strip{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.quality-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quality-stat{border:1px solid var(--line);border-radius:10px;padding:12px}.quality-stat b{display:block;font-size:22px}.quality-stat span{color:var(--muted);font-size:12px}@media(max-width:900px){.quality-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.quality-grid{grid-template-columns:1fr 1fr}}.explorer{margin-top:38px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.explorer-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.explorer h2{margin:6px 0 0;font-size:25px}.explorer-head span{color:var(--muted);font-size:13px}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:20px}.filters label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}.filters select,.filters input,.filters button{font:inherit;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px}.filters button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer;font-weight:700}.dd-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.dd-table-wrap table{width:100%;border-collapse:collapse;font-size:13px}.dd-table-wrap th,.dd-table-wrap td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.dd-table-wrap th{background:#f5f7f4}.dd-empty{padding:25px;color:var(--muted)}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1}.explorer-head{align-items:start;flex-direction:column}}
</head>
<body>
<main>
  <a class="back" href="../">← Dehesa Index</a>
  <div class="eyebrow">Dehesa Data</div>
  <h1>Datos agrícolas estructurados.</h1>
  <p class="lead">Una capa machine-readable con observaciones, históricos, fuentes, frecuencia y metadatos de trazabilidad. Diseñada para análisis, trazabilidad y reutilización estructurada de datos.</p>
  <section class="grid">
    <article class="card"><h2>Últimos datos</h2><p>Una observación por producto y región.</p><a class="btn" href="latest.json">latest.json</a></article>
    <article class="card"><h2>Histórico</h2><p>Observaciones normalizadas disponibles en el pipeline.</p><a class="btn" href="history.json">history.json</a></article>
    <article class="card"><h2>CSV</h2><p>Formato sencillo para Excel, Power BI y análisis.</p><a class="btn" href="history.csv">history.csv</a></article>
    <article class="card"><h2>Catálogo</h2><p>Productos, regiones, fuentes y frecuencias.</p><a class="btn" href="catalog.json">catalog.json</a></article>
    <article class="card"><h2>Contrato API</h2><p>Esquema público de la capa de datos.</p><a class="btn" href="api.json">api.json</a></article>
    <article class="card"><h2>Normalized data</h2><p>Capa de unidades y metadatos para análisis; no convierte bases de cotización incompatibles.</p><a class="btn" href="normalized.json">normalized.json</a></article><article class="card"><h2>Quality report</h2><p>Estado de verificación, cobertura, antigüedad y trazabilidad del último corte.</p><a class="btn" href="quality.json">quality.json</a></article><article class="card"><h2>Intelligence 2.0</h2><p>Señales calculadas solo cuando la cobertura real alcanza el umbral.</p><a class="btn" href="intelligence.json">intelligence.json</a></article><article class="card"><h2>Agricultural relationships</h2><p>Rezagos, ventanas y confianza descriptiva entre familias de mercados agrícolas.</p><a class="btn" href="cross-market.json">cross-market.json</a></article><article class="card"><h2>Cross-market</h2><p>Relaciones estadísticas sobre cambios de series con fechas comunes, sin inferir causalidad.</p><a class="btn" href="cross-market.json">cross-market.json</a></article><article class="card"><h2>Alert signals</h2><p>Señales informativas de movimientos y frescura del dato; sin predicciones ni notificaciones externas.</p><a class="btn" href="alerts.json">alerts.json</a></article><article class="card"><h2>Snapshots</h2><p>Versiones fechadas para auditoría y reproducibilidad.</p><a class="btn" href="../">Ver índice</a></article>
  </section>

  <section class="observatory"><div class="eyebrow">Data Observatory</div><h2>Estado de las series</h2><p class="obs-lead">Una vista operativa de cobertura, frescura, verificación y señales disponibles. Una serie puede estar verificada y, aun así, no ser comparable con otra metodología.</p><div id="obs-grid" class="obs-grid"><div class="quality-stat"><b>—</b><span>Cargando observatorio</span></div></div></section>
  <section class="quality-strip"><div class="eyebrow">Data quality</div><div class="quality-grid" id="quality-grid"><div class="quality-stat"><b>—</b><span>Cargando</span></div></div></section>
  <div class="notice"><strong>Estado del observatorio:</strong> Dehesa Data combina series verificadas de USDA NASS, World Bank y Eurostat. Las series con metodologías distintas permanecen separadas y no se convierten en comparaciones directas.</div>
<section class="explorer">
  <div class="explorer-head"><div><div class="eyebrow">Data Explorer</div><h2>Consulta el histórico</h2></div><span id="dd-count">0 observaciones</span></div>
  <div class="filters">
    <label>Producto<select id="dd-product"><option value="">Todos</option></select></label>
    <label>Región<select id="dd-region"><option value="">Todas</option><option value="us">US</option><option value="eu">EU</option><option value="uk">UK</option></select></label>
    <label>Desde<input id="dd-from" type="date"></label>
    <label>Hasta<input id="dd-to" type="date"></label>
    <button id="dd-export" type="button">Exportar CSV</button>
  </div>
  <div id="dd-results"></div>
</section>
</main>
<script src="explorer.js"></script><script>
fetch('quality.json').then(function(r){return r.json();}).then(function(q){var s=q.scope||{};document.getElementById('quality-grid').innerHTML='<div class="quality-stat"><b>'+s.verified+'</b><span>Verificadas</span></div><div class="quality-stat"><b>'+s.pending+'</b><span>Pendientes</span></div><div class="quality-stat"><b>'+s.historyObservations+'</b><span>Puntos históricos</span></div><div class="quality-stat"><b>'+s.stale+'</b><span>Señales de antigüedad</span></div><div class="quality-stat"><b>'+s.regions.length+'</b><span>Regiones</span></div>';}).catch(function(){document.getElementById('quality-grid').innerHTML='<div class="quality-stat"><b>—</b><span>Quality report no disponible</span></div>';});
</script>\n
<script>
fetch('quality.json').then(function(r){return r.json()}).then(function(q){var el=document.getElementById('obs-grid');el.innerHTML=(q.observations||[]).map(function(o){var label=(o.product||'').replace(/_/g,' ');var state=o.stale?'STALE':'FRESH';return '<article class="obs-card"><div class="obs-top"><span>'+label+' · '+o.region.toUpperCase()+'</span><span class="obs-chip '+(o.stale?'stale':'fresh')+'">'+state+'</span></div><div class="obs-meta"><div><span>Fuente</span><b>'+o.sourceId+'</b></div><div><span>Puntos</span><b>'+o.points+'</b></div><div><span>Cobertura</span><b>'+((o.coverageStart||'—')+' → '+(o.coverageEnd||'—'))+'</b></div><div><span>Estado</span><b>'+o.status+'</b></div></div></article>';}).join('')||'<div class="quality-stat"><b>—</b><span>Sin series</span></div>';}).catch(function(){document.getElementById('obs-grid').innerHTML='<div class="quality-stat"><b>—</b><span>Observatorio no disponible</span></div>';});
</script>
</body>
</html>
