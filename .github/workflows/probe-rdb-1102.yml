name: Probe Regionaldatenbank access
on:
  workflow_dispatch:
  push:
    branches: [research/probe-rdb-1102]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Probar acceso a la Regionaldatenbank y una tabla por distrito
        env:
          RDB_USER: ${{ secrets.RDB_USER }}
          RDB_PASSWORD: ${{ secrets.RDB_PASSWORD }}
        run: python3 scripts/probe-rdb.py
