# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain weekly national prices and origin-destination price observatory (MAPA)
on:
  schedule:
    - cron: '40 7 * * 2,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-es-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-es-pmn.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-prices/pmn.json data/spain-prices/obs.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/spain-prices/pmn.json data/spain-prices/obs.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/spain-prices/pmn.json data/spain-prices/obs.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Precios medios nacionales y observatorio de precios de España (MAPA)" data/spain-prices/pmn.json data/spain-prices/obs.json data/spain-prices-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
