# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update bulk wine prices (MAPA weekly bulletin, FranceAgriMer)
on:
  schedule:
    - cron: '40 9 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-wine-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: pip install pdfplumber xlrd
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-wine-prices.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/wine-prices.json data/france-extras-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/wine-prices.json data/france-extras-stats.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Precio del vino a granel (MAPA, FranceAgriMer)" data/wine-prices.json data/france-extras-stats.json data/wine-prices-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
