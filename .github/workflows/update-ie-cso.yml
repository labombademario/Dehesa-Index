# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Ireland agricultural price indices, milk intake and land sales (CSO)
on:
  schedule:
    - cron: '50 7 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ie-cso
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ie-cso.py
        timeout-minutes: 15
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/ie-cso-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/ie-cso-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Irlanda - indices de precios agrarios, leche recibida y venta de tierra (CSO)" data/ie-cso-stats.json data/ie-cso-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
