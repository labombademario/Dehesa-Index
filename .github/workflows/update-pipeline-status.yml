name: Update pipeline status
# Falla CERRADO: BUILD -> VALIDATE -> CONSISTENCY CHECK -> COMMIT. Si cualquier paso falla, el job se detiene y NO se hace commit de los datos derivados.
# Unica excepcion deliberada: el informe de estado (pipeline-status.json y data-quality.json) se publica aunque la validacion encuentre errores,
# porque es justo lo que cuenta que algo va mal; despues el job falla en rojo y los datos derivados no se construyen ni se publican.
on:
  schedule:
    - cron: '10 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  issues: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 1) Informe de estado: validar todos los datos + estado de los pipelines. Se publica siempre; si la validacion falla, el job termina en rojo.
      - name: Validar datos y publicar el informe de estado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/validate-data.py; VALIDATE_RC=$?
          [ "$VALIDATE_RC" = 0 ] || echo "::error::validate-data.py termino con codigo $VALIDATE_RC"
          set -e
          python3 scripts/build-pipeline-status.py || { echo "::error::build-pipeline-status.py fallo"; exit 1; }
          python3 scripts/build-observatory.py || { echo "::error::build-observatory.py fallo"; exit 1; }   # el observatorio se regenera justo despues del estado, en el mismo commit: aunque la validacion falle, nunca queda desfasado respecto a pipeline-status.json
          # mismo publicador que el resto (10 reintentos); si choca con refresh-observatory.yml, que escribe los mismos dos ficheros,
          # se toma la version de main y se regeneran sobre el arbol ya unido. Sin aviso: este workflow ya es el que rehace el observatorio.
          PUBLISH_NO_NOTIFY=1 PUBLISH_DERIVED="data/pipeline-status.json data/observatory.json" \
          PUBLISH_REGEN="python3 scripts/build-pipeline-status.py && python3 scripts/build-observatory.py" \
          bash scripts/publish-data.sh "Estado de pipelines y calidad de datos" data/pipeline-status.json data/data-quality.json data/observatory.json \
            || { echo "::error::no se pudo publicar el estado"; exit 1; }
          exit $VALIDATE_RC

      # 1b) Alerta: si el estado global esta en rojo (pipeline con error o despliegue roto) abre o actualiza un issue; al volver a verde lo cierra. GitHub avisa por correo.
      - name: Alerta por issue si el estado esta en rojo
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/alert-issue.py

      # 2) Datos derivados: construir TODO, validar TODO y solo entonces commitear. Sin "|| true".
      - name: Series semanales de EE. UU. (lacteos, cordero, fertilizantes, exportaciones, etanol; desde ficheros ya publicados, sin red)
        run: python3 scripts/build-us-weekly.py
      - name: Socios comerciales de EE. UU. (derivado de GATS, sin red)
        run: python3 scripts/build-us-trade-partners.py
      - name: Socios comerciales de Chile (derivado de ODEPA, sin red)
        run: python3 scripts/build-cl-trade-partners.py
      - name: Registro de series
        run: python3 scripts/build-series-registry.py
      - name: Indice de series para la lista de seguimiento
        run: python3 scripts/build-watch-index.py
      - name: Catalogo unificado (manifiesto, catalogos y trozos de series)
        run: python3 scripts/build-data-catalog.py
      - name: Frescura (Freshness Engine 2.0) de latest.json y del catalogo
        run: python3 scripts/build-freshness.py
      - name: Comercio de EE. UU. por producto y socio (derivado de GATS)
        run: python3 scripts/build-us-trade-products.py
      - name: Comercio de Canada y Argentina por producto (derivado de Statistics Canada e INDEC)
        run: python3 scripts/build-trade-sections.py
      - name: Vistas pequenas para las paginas de entrada (data/views)
        run: python3 scripts/build-views.py
      - name: Series comparables por producto y pais
        run: python3 scripts/build-product-compare.py
      - name: Fichas de producto (comercio mundial y aranceles precalculados)
        run: python3 scripts/build-product-profiles.py
      - name: Relaciones entre mercados (Cross-Market Intelligence 2.0, solo descriptivo)
        run: python3 scripts/build-relationships.py
      - name: Brief diario
        run: python3 scripts/build-daily-brief.py
      - name: Observatorio de datos (novedades, movimientos, frescura, cobertura y salud)
        run: python3 scripts/build-observatory.py
      - name: Cola de fuentes candidatas (License Gate; no ingiere nada)
        run: python3 scripts/build-source-candidates.py
      - name: Catalogo comercial (que ficheros pueden ofrecerse a empresas segun el registro de licencias)
        run: python3 scripts/build-commercial-catalog.py
      - name: Citas de licencia por fuente (data/views/license-cite.json; se queda atrasada si el registro cambia y nadie la regenera)
        run: python3 scripts/build-cite-view.py
      - name: Cifras del README (cuantos procesos sigue el estado; si no se regeneran aqui, el control de calidad del siguiente cambio sale en rojo)
        run: python3 scripts/build-readme-status.py
      - name: DATA_SOURCES.md (cuenta series por fuente desde el catalogo; si no se regenera aqui, el control de calidad del siguiente cambio sale en rojo)
        run: python3 scripts/build-docs.py
      - name: Paquete de datos descargable para empresas (CSV y Excel; solo fuentes aptas segun el catalogo comercial)
        run: pip install --quiet openpyxl && python3 scripts/build-data-pack.py
      - name: API de datos v1 (JSON estatico generado solo desde el paquete apto; sin datos nuevos no cambia)
        run: python3 scripts/build-api.py
      - name: API de agua v1 (rios y sequia por pais, solo fuentes con uso comercial permitido)
        run: python3 scripts/build-api-water.py
      - name: Avisos de precio y resumen semanal (eventos, Atom; solo desde la API; sin datos nuevos no cambia)
        run: python3 scripts/build-digest.py
      - name: Cestas de precios (indices por categoria con metodologia publicada; solo desde la API)
        run: python3 scripts/build-baskets.py
      - name: Informe de mercado para cooperativas (muestra) y estado por fuente
        run: python3 scripts/build-coop-report.py && python3 scripts/build-source-health.py && python3 scripts/build-source-sheet.py && python3 scripts/build-input-monitor.py && python3 scripts/build-input-monitor-countries.py && python3 scripts/build-liquidation-refs.py
      - name: Huecos de cobertura (pais x producto x metrica)
        run: python3 scripts/build-coverage-gaps.py
      - name: Paises - que falta por llegar (cobertura hoy, techo y fuentes esperadas)
        run: python3 scripts/build-country-pending.py
      - name: Premium Tracker (organico AMS 3802 frente a convencional, misma especificacion)
        run: python3 scripts/build-premium-tracker.py
      - name: Panel de la portada (8 filas copiadas de data/prices/latest)
        run: python3 scripts/build-home-tape.py
      - name: Cifras de las tarjetas Explora los datos (copiadas de ficheros publicados)
        run: python3 scripts/build-home-explore.py
      - name: PAC 2.0 (contrato comun por pais y vigilancia, desde data/cap/<CC>/)
        run: python3 scripts/build-cap-index.py
      - name: Retencion de snapshots (7 dias + uno por semana)
        run: python3 scripts/prune-snapshots.py --apply
      - name: Costes de referencia ERS para la calculadora
        run: python3 scripts/build-ers-cost-reference.py
      - name: Comparador de siembra (Que sembrar, data/sowing)
        run: python3 scripts/build-sowing.py
      - name: Mercados Dehesa (cerdo iberico, pastos y corcho, data/dehesa.json)
        run: python3 scripts/build-dehesa.py
      - name: Frutas, hortalizas y frutos secos (pestaña de precios y fichas, data/fv-products.json)
        run: python3 scripts/build-fv-products.py
      - name: Lo que cobra el agricultor fuera de España (INSEE y Eurostat; data/fv-farm.json)
        run: python3 scripts/build-fv-farm.py
      - name: Precios de cada país de la UE para la app (data/app/v1/eu)
        run: python3 scripts/build-app-eu-countries.py
      - name: Secciones de la web para la app (data/app/v1/sec)
        run: python3 scripts/build-app-sections.py
      - name: Vistas de datos para la app movil (data/app/v1)
        run: node scripts/build-app-views.mjs && node scripts/test-app-views.mjs
      - name: Notas del blog para la app (data/blog/posts.json, desde js/blog.js)
        run: node scripts/build-blog-posts.mjs
      - name: Paquete por pais para la app (gasoleo, emisiones, sequia y nitratos, data/app/v1/env)
        run: python3 scripts/build-app-env.py
      - name: Comercio por producto de cada pais para la app (data/app/v1/trade)
        run: node scripts/build-app-trade.mjs
      - name: Provincias de Espana para la app (clima y ganaderia, data/app/v1/prov)
        run: node scripts/build-app-prov.mjs
      - name: Comprobar coherencia de lo construido (catalogo estricto, contratos de los derivados)
        run: |
          python3 scripts/check-catalog.py --strict
          python3 scripts/check-licenses.py --strict
          python3 scripts/validate-data.py --derived --no-report

      # 3) Commit: solo se llega aqui si todo lo anterior ha ido bien.
      - name: Publicar datos derivados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-weekly-stats.json data/series-registry.json data/watch data/daily-brief.json data/product-compare.json data/catalog data/series data/views data/freshness.json data/products data/relationships.json data/observatory.json data/source-candidates.json data/commercial-catalog.json data/commercial-summary.json data/pack data/api data/digest data/indices data/coverage-gaps.json data/country-pending.json data/premium-tracker.json data/ers-cost-reference.json data/sowing data/dehesa.json data/fv-products.json data/fv-farm.json data/home-tape.json data/home-explore.json data/cap/index.json data/blog/posts.json data/app data/snapshots README.md DATA_SOURCES.md
          git diff --cached --quiet && exit 0
          git commit -qm "Datos derivados: catalogo, registro, watchlist, comparador y brief"
          for i in 1 2 3 4 5 6; do git pull -q --rebase --autostash && git push && exit 0; sleep $((i * 5 + RANDOM % 10)); done
          echo "no se pudo publicar tras 6 intentos"; exit 1
