name: Update pipeline status
# Falla CERRADO: BUILD -> VALIDATE -> CONSISTENCY CHECK -> COMMIT. Si cualquier paso falla, el job se detiene y NO se hace commit de los datos derivados.
# Unica excepcion deliberada: el informe de estado (pipeline-status.json y data-quality.json) se publica aunque la validacion encuentre errores,
# porque es justo lo que cuenta que algo va mal; despues el job falla en rojo y los datos derivados no se construyen ni se publican.
on:
  schedule:
    - cron: '10 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) Informe de estado: validar todos los datos + estado de los pipelines. Se publica siempre; si la validacion falla, el job termina en rojo.
      - name: Validar datos y publicar el informe de estado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/validate-data.py; VALIDATE_RC=$?
          set -e
          python3 scripts/build-pipeline-status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pipeline-status.json data/data-quality.json
          if ! git diff --cached --quiet; then
            git commit -qm "Estado de pipelines y calidad de datos"
            ok=0
            for i in 1 2 3; do git pull -q --rebase --autostash && git push && ok=1 && break; sleep $((i * 5)); done
            [ "$ok" = 1 ] || { echo "no se pudo publicar el estado"; exit 1; }
          fi
          exit $VALIDATE_RC

      # 2) Datos derivados: construir TODO, validar TODO y solo entonces commitear. Sin "|| true".
      - name: Registro de series
        run: python3 scripts/build-series-registry.py
      - name: Indice de series para la lista de seguimiento
        run: python3 scripts/build-watch-index.py
      - name: Catalogo unificado (manifiesto, catalogos y trozos de series)
        run: python3 scripts/build-data-catalog.py
      - name: Vistas pequenas para las paginas de entrada (data/views)
        run: python3 scripts/build-views.py
      - name: Series comparables por producto y pais
        run: python3 scripts/build-product-compare.py
      - name: Brief diario
        run: python3 scripts/build-daily-brief.py
      - name: Comprobar coherencia de lo construido (catalogo estricto, contratos de los derivados)
        run: |
          python3 scripts/check-catalog.py --strict
          python3 scripts/check-licenses.py
          python3 scripts/validate-data.py --derived --no-report

      # 3) Commit: solo se llega aqui si todo lo anterior ha ido bien.
      - name: Publicar datos derivados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series-registry.json data/watch-index.json data/daily-brief.json data/product-compare.json data/catalog data/series data/views
          git diff --cached --quiet && exit 0
          git commit -qm "Datos derivados: catalogo, registro, watchlist, comparador y brief"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push && exit 0; sleep $((i * 5)); done
          echo "no se pudo publicar tras 3 intentos"; exit 1
