name: Dehesa Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find js scripts data -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Workflows generated from sources.yml are in sync
        run: |
          pip install pyyaml
          python3 scripts/gen-workflows.py --check

      - name: Workflow hygiene (fail closed, explicit paths)
        run: python3 scripts/check-workflows.py

      - name: Data contracts (schemas), semantic tests and cross-file consistency, all families
        run: python3 scripts/validate-data.py --all --no-report

      - name: Contract tests bite (corrupted real data must be rejected)
        run: python3 scripts/test-contracts.py

      - name: Country profile in plain language (series names, summary, 5-year range)
        run: node scripts/test-perfil-claro.mjs

      - name: Search answers (every figure shown must equal the source data)
        run: node scripts/test-answers.mjs

      - name: Blog email subscription (required consent, legal text, provider privacy link)
        run: node scripts/test-newsletter.mjs

      - name: USDA release calendar and Cattle on Feed parsers (real samples, offline)
        run: |
          python3 scripts/test-usda-calendar.py
          python3 scripts/test-cattle-on-feed.py
          python3 scripts/test-us-dairy.py
          python3 scripts/test-us-lamb.py
          python3 scripts/test-eu-vat.py
          python3 scripts/test-eu-farm-economics.py
          python3 scripts/test-canada-stats.py
          python3 scripts/test-canada-grain.py
          python3 scripts/test-canada-provinces.py
          python3 -m pip install --quiet numpy netCDF4 shapely
          python3 scripts/test-eu-drought.py
          python3 scripts/test-canada-drought.py

      - name: US local cash bids parser, merge, revisions and failure safety (offline fixtures, no API)
        run: python3 scripts/test-us-cash-bids.py

      - name: US local cattle and hay markets (aggregation, merge, retention, failure safety; offline fixtures, no API)
        run: python3 scripts/test-us-local-markets.py

      - name: US county yields (NASS Quick Stats county reader on real county rows, suppressed values as gaps, other-counties sum, production = yield x harvested check, year merge, failures; no network)
        run: python3 scripts/test-us-county-yields.py

      - name: Manitoba weekly auction cattle (PDF text parser, NA/no-sale, head totals, failure safety; real extracts as fixtures, no network)
        run: python3 scripts/test-mb-cattle.py

      - name: Spain crops by province (MAPA workbook parser, sums, provisional campaigns, failure safety; synthetic workbook, no network)
        run: pip install openpyxl && python3 scripts/test-spain-crops.py

      - name: Spain livestock headcounts by province (MAPA workbook parser, negatives as gaps, sums, refusal on corrupted data; synthetic workbook, no network)
        run: pip install openpyxl && python3 scripts/test-spain-livestock.py

      - name: Spain cereal balance sheets (MAPA PDF parser on real pdftotext extracts, column assignment, empty cells, TOTAL discrepancies as notes, refusal on corrupted tables; no network)
        run: python3 scripts/test-spain-balances.py

      - name: Spain olive sector balance and oil forecast (MAPA PDF parser on real pdftotext extracts, both layouts, UE split, forecast by region sums to the national total; no network)
        run: python3 scripts/test-spain-olive.py

      - name: Spain raw milk deliveries, price and quality (MAPA INFOLAC PDF parser on a real pdftotext extract, 17 regions sum to the national total, price table cross-check, history accumulation and revisions; no network)
        run: python3 scripts/test-spain-milk.py

      - name: Spain livestock slaughter by species and region (MAPA xlsx reader on the real August 2026 workbook, weights, source inconsistency noted, history accumulation and revisions; no network)
        run: python3 scripts/test-spain-slaughter.py

      - name: Spain slaughter census by province (MAPA annual census reader on the real 2025 .xlsx and 2007 .xls workbooks, unit change of poultry and rabbits, DC cells as gap with class, province aliases, sums, accumulation and revisions; no network)
        run: pip install openpyxl xlrd && python3 scripts/test-spain-slaughter-census.py

      - name: Spain wine by campaign and region (MAPA INFOVI July extended report reader on the real 2021 and 2026 workbooks, cross-checks, link discovery, accumulation and revisions; no network)
        run: python3 scripts/test-spain-wine.py

      - name: Spain wine month by month (MAPA INFOVI monthly report reader on the real July 2026 and January 2021 workbooks, month from the sheet title, missing table 4.6 as gap, chaining, link discovery, accumulation and revisions; no network)
        run: python3 scripts/test-spain-wine-monthly.py

      - name: Spain wine historical balances 2009/10-2015/16 (MAPA workbook reader on real xls and xlsx files, blank cells as gaps, final over provisional, identities, chaining, link discovery, accumulation; no network)
        run: pip install openpyxl xlrd && python3 scripts/test-spain-wine-balance-historic.py

      - name: Spain CAP (BOE RD 1048/2022 annex parser, change tracking, refusal on corrupted text, rules vs watched articles; extract of the BOE text as fixture, no network)
        run: python3 scripts/test-cap-es.py

      - name: Anomaly verifier (promotes only when the primary source reproduces the value; offline fixtures)
        run: python3 scripts/test-verify-anomalies.py

      - name: Derived builders run end-to-end on the committed data (the same chain update-pipeline-status.yml runs; a crash here would turn that pipeline red)
        run: |
          set -e
          for s in build-series-registry build-watch-index build-data-catalog build-freshness build-views build-product-compare build-product-profiles build-relationships build-daily-brief build-observatory build-source-candidates build-coverage-gaps build-premium-tracker build-ers-cost-reference build-home-tape build-home-explore; do
            python3 scripts/$s.py > /dev/null
          done

      - name: Data catalog integrity (manifest, catalogs, shards)
        run: python3 scripts/check-catalog.py --strict

      - name: Perfiles de region (mapas, nombres y datos de los que dependen)
        run: node scripts/test-regions.mjs

      - name: Identidad visible del instrumento (soja, regla de comparacion, cobertura)
        run: node scripts/test-instrument-identity.mjs

      - name: canonicalSeriesId v2 (unicidad salvo equivalencias declaradas)
        run: python3 scripts/test-canonical-ids.py

      - name: Coverage Score precalculado = el de la ficha de pais
        run: node scripts/test-coverage-parity.mjs

      - name: License gate (registry, file coverage, catalog propagation, legal text)
        run: |
          python3 scripts/check-licenses.py --strict
          python3 scripts/test-license-gate.py

      - name: DATA_SOURCES.md generated from the license registry
        run: python3 scripts/build-docs.py --check

      - name: Versiones ?v= de scripts y estilos al dia (node scripts/stamp-assets.mjs)
        run: node scripts/stamp-assets.mjs --check
      - name: Vista previa social en paginas raiz (node scripts/stamp-social.mjs)
        run: node scripts/stamp-social.mjs --check
      - name: Lista de fuentes de Informacion al dia (node scripts/build-sources-view.mjs)
        run: node scripts/build-sources-view.mjs --check

      - name: Service worker version matches the code
        run: node scripts/stamp-sw.mjs --check

      - name: SEO QA (sitemap, canonical, hreflang, JSON-LD)
        run: node scripts/qa-seo.mjs

      - name: Unit Engine (FX historico, bushel por cultivo, ha/acre)
        run: node scripts/test-unit-engine.mjs

      - name: Smart Watchlist 2.0 (reglas combinables, Transmission Watch, importacion validada)
        run: node scripts/test-watchlist.mjs

      - name: Freshness Engine parity (JS vs Python)
        run: node scripts/test-freshness-parity.mjs

      - name: Repo growth budget (tamano de ficheros, data/ e historial)
        run: python3 scripts/check-repo-growth.py

      - name: Performance budget (gzip)
        run: node scripts/check-performance-budget.mjs

      - name: Retencion de snapshots (prueba)
        run: python3 scripts/test-prune-snapshots.py
      - name: Validate snapshots
        run: node scripts/validate-snapshots.mjs

      - name: Verify generated data builders
        run: |
          node --check scripts/build-data-index.mjs
          node --check scripts/build-csv.mjs
          node --check scripts/update-nass-us.mjs
          node --check scripts/build-data-quality.mjs
          node scripts/qa-site.mjs

  page-budget:
    # Presupuesto de carga inicial POR PAGINA con navegador real (JSON, JS y gzip; peticiones prohibidas; 404 y errores de JS).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Servidor estatico
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
      - name: Presupuesto por pagina (scripts/page-budget.json)
        env:
          CHROMIUM: ''
        run: node scripts/measure-pages.mjs --check

  e2e:
    # Navegador real (escritorio y movil): errores de consola/pagina, 4xx/5xx, JSON invalido, componentes criticos vacios,
    # flujos de usuario y accesibilidad (axe-core, WCAG 2 A/AA: critical y serious bloquean).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Playwright, Chromium y axe-core
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
      - name: Servidor estatico
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
      - name: E2E + accesibilidad
        env:
          CHROMIUM: ''
        run: node scripts/e2e.mjs --json e2e-report.json
      - name: E2E de variantes (smoke - productos 3.0 representativos, comparador, 10 tipos de regla, monedas y unidades, estados de frescura, paginacion)
        env:
          CHROMIUM: ''
        run: node scripts/e2e-variants.mjs --smoke
      - name: Auditoria UX responsive (375/390/430/768/1280)
        env:
          CHROMIUM: ''
        run: node scripts/ux-audit.mjs --strict
      - name: Seguro agrario (cifras exactas, tablas, citas, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-seguro.mjs
      - name: Alemania, ganadería y fruta (cifras de Destatis, selectores, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-de-livestock.mjs
      - name: Dinamarca, Países Bajos y Francia en profundidad (cifras de StatBank, Retsinformation, CBS, RVO, VigiEau y Céré'Obs, selectores, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-eu-depth.mjs
      - name: Punto de estado del dato (colores, etiquetas, 4 idiomas)
        run: node scripts/test-fresh-dots.mjs
      - name: Portada, bloque «Hoy» (resumen diario, calendario USDA, seguimiento local; 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-home-today.mjs
      - name: Ficha de producto, barra contextual y marcas dato / lectura / relación (4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-product-ctx.mjs
      - name: Pestaña Canadá en rendimientos, ganadería, insumos y costes (4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-canada-tabs.mjs
      - name: Marco comun de pagina, filas de mercado y vista Filas/Tarjetas
        env:
          CHROMIUM: ''
        run: node scripts/test-page-frame.mjs
      - name: Portada, buscador grande y ejemplos (4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-home-search.mjs
      - name: EE. UU., ganado y heno locales (cifras de USDA AMS, selectores, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-us-local.mjs
      - name: Clima agrícola (regiones visibles, plegado, mapa, memoria, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-clima.mjs
      - name: España, cultivos por provincia (cifras del MAPA, selectores, campañas, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-es-crops.mjs
      - name: España, ganadería por provincia (cifras del MAPA = los JSON, selectores, cita, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-es-livestock.mjs
      - name: Oferta y demanda, pestaña España (balances de cereales del MAPA = los JSON, notas del total, cita, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-od-es.mjs
      - name: Manitoba, ganado en subastas (cifras de Manitoba Agriculture, selectores, atribución OpenMB, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-mb-cattle.mjs
      - name: Mi mercado (cifras de ganado, heno, granos, seguro, sequía y cultivos de España = los JSON; lo que falta se dice; elección guardada; 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-mi-mercado.mjs
      - name: PAC España (importes y estimación = los JSON del real decreto; cita del BOE con su texto obligatorio; cambios pendientes visibles; elección guardada; 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-pac.mjs
      - name: Informe E2E
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: ignore

      - name: Source citations are wired (every page that cites loads cite.js)
        run: python3 scripts/test-cite-wiring.py
