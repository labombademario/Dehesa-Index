name: Dehesa Quality

on:
  push:
    branches: [main]
  pull_request:
  # Los commits de datos de los bots (GITHUB_TOKEN) no disparan este workflow: sin esta pasada diaria, un dato nuevo que rompa un
  # presupuesto o un contrato solo se ve en el siguiente cambio de codigo. Una vez al dia se revisa main tal como esta.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find js scripts data -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Workflows generated from sources.yml are in sync
        run: |
          pip install pyyaml
          python3 scripts/gen-workflows.py --check

      - name: Blog notes have one publication date, ISO date, newest first (scripts/build-blog-posts.mjs)
        run: node scripts/build-blog-posts.mjs && git diff --exit-code data/blog/posts.json

      - name: Workflow hygiene (fail closed, explicit paths)
        run: python3 scripts/check-workflows.py

      - name: Data contracts (schemas), semantic tests and cross-file consistency, all families
        run: python3 scripts/validate-data.py --all --no-report

      - name: Contract tests bite (corrupted real data must be rejected)
        run: python3 scripts/test-contracts.py

      - name: Security headers (CSP, HSTS) and inline-script hashes match _headers
        run: python3 scripts/test-csp.py

      - name: CPI pipeline parsers and integrity checks (no network)
        run: python3 scripts/test-cpi.py

      - name: ARC/PLC pipeline is fail-safe (provider outage keeps last valid data, touches no file)
        run: |
          pip install openpyxl
          python3 scripts/test-us-arcplc-failsafe.py

      - name: EU production keeps a failed block's published series instead of deleting them (no network)
        run: python3 scripts/test-eu-production-carry.py

      - name: Publish guard keeps up-to-date series when the source fails (scripts/guard-series-loss.py; no network)
        run: python3 scripts/test-guard-series-loss.py

      - name: Real prices arithmetic (CPI deflation in chart.js)
        run: node scripts/test-real-prices.mjs

      - name: Spain margin reference (PAC only from the saved estimate, no hard-coded amounts)
        run: node scripts/test-margen-es.mjs

      - name: Country profile in plain language (series names, summary, 5-year range)
        run: node scripts/test-perfil-claro.mjs

      - name: Search answers (every figure shown must equal the source data)
        run: node scripts/test-answers.mjs

      - name: Search ranking (54 consultas de scripts/search-cases.json traen la entrada esperada arriba)
        run: node scripts/test-search-ranking.mjs
      - name: Search bench (~17.500 preguntas generadas con los datos del día + ~110 escritas a mano; Enter debe abrir el dato que existe)
        run: node scripts/gen-search-bench.mjs && node scripts/test-search-bench.mjs

      - name: Blog email subscription (required consent, legal text, provider privacy link)
        run: node scripts/test-newsletter.mjs

      - name: USDA release calendar and Cattle on Feed parsers (real samples, offline)
        run: |
          python3 scripts/test-usda-calendar.py
          python3 scripts/test-cattle-on-feed.py
          python3 scripts/test-us-dairy.py
          python3 scripts/test-us-lamb.py
          python3 scripts/test-us-ers-bioenergy.py
          python3 scripts/test-us-ers-fertilizer.py
          python3 scripts/test-us-ers-food.py
          python3 scripts/test-us-ers-productivity.py
          python3 scripts/test-us-nass-cdl.py
          python3 scripts/test-eu-vat.py
          python3 scripts/test-eu-farm-economics.py
          python3 scripts/test-canada-stats.py
          python3 scripts/test-canada-grain.py
          python3 scripts/test-ca-boc-aafc.py
          python3 scripts/test-ca-alberta-inputs.py
          python3 scripts/test-ca-statcan-more.py
          python3 scripts/test-canada-provinces.py
          python3 -m pip install --quiet numpy netCDF4 shapely
          python3 scripts/test-eu-drought.py
          python3 scripts/test-canada-drought.py

      - name: US local cash bids parser, merge, revisions and failure safety (offline fixtures, no API)
        run: python3 scripts/test-us-cash-bids.py

      - name: US local cattle and hay markets (aggregation, merge, retention, failure safety; offline fixtures, no API)
        run: python3 scripts/test-us-local-markets.py

      - name: US county yields (NASS Quick Stats county reader on real county rows, suppressed values as gaps, other-counties sum, production = yield x harvested check, year merge, failures; no network)
        run: python3 scripts/test-us-county-yields.py

      - name: Manitoba weekly auction cattle (PDF text parser, NA/no-sale, head totals, failure safety; real extracts as fixtures, no network)
        run: python3 scripts/test-mb-cattle.py

      - name: Manitoba sheep, goat and hogs (PDF text parsers, goat unit rule, disputed cells, date and range checks, failure safety; real extracts as fixtures, no network)
        run: python3 scripts/test-mb-smallstock.py

      - name: Spain crops by province (MAPA workbook parser, sums, provisional campaigns, failure safety; synthetic workbook, no network)
        run: pip install openpyxl && python3 scripts/test-spain-crops.py

      - name: Spain farmland prices and rents (MAPA workbook parser, real fixtures, revisions, link picking, refusal on corrupted data; no network)
        run: pip install openpyxl && python3 scripts/test-spain-land.py

      - name: France and Italy farmland prices (Agreste PDF text and CREA workbook parsers, real fixtures, units, year accumulation, licence gate, contract; no network)
        run: pip install openpyxl && python3 scripts/test-land-fr-it.py

      - name: Grecia (ELSTAT) - lector de indices de precios y cuentas regionales
        run: pip install openpyxl xlrd && python3 scripts/test-el-elstat.py
      - name: Grecia (ELGO-Dimitra) - agregacion de leche, nombres de unidades y fallo cerrado (scripts/test-el-elgo.py)
        run: python3 scripts/test-el-elgo.py
      - name: Croacia (DZS) - lector PxWeb, regiones que suman, indice base 2020 y fallo cerrado (scripts/test-hr-dzs.py)
        run: python3 scripts/test-hr-dzs.py
      - name: Croacia (APPRRR) - libros XLSX por provincia, totales que cuadran y fallo cerrado (scripts/test-hr-apprrr.py)
        run: pip install openpyxl && python3 scripts/test-hr-apprrr.py
      - name: Bélgica (KMI) - Makkink, déficit acumulado, mínimo de estaciones y fallo cerrado (scripts/test-be-weather.py)
        run: python3 scripts/test-be-weather.py
      - name: Tierra y regadio de FR, IT, PL, PT, DE, BE, HR y EL (scripts/test-eu-land.py)
        run: python3 scripts/test-eu-land.py
      - name: API de datos al dia con el paquete descargable (scripts/build-api.py --check)
        run: python3 scripts/build-api.py --check
      - name: API de agua v1 valida (forma, licencia y atribucion; la fecha no se compara)
        run: python3 scripts/build-api-water.py --check
      - name: Avisos de precio (umbrales, Atom, correo escapado; no envia sin clave) y al dia con la API
        run: python3 scripts/test-digest.py && python3 scripts/build-digest.py --check
      - name: Notas de la API en es/en/fr/it (traduccion por frases, sin espanol en las otras tres, guarda ante frases nuevas)
        run: python3 scripts/test-api-notes.py
      - name: Cestas de precios (base 100, meses incompletos, minimos, sin relleno) y al dia con la API
        run: python3 scripts/test-baskets.py && python3 scripts/build-baskets.py --check
      - name: Conector MCP (protocolo, siete herramientas contra los datos reales, errores, Worker)
        run: node scripts/test-mcp.mjs
      - name: Poland farmland prices (GUS BDL API responses, attribute 91 as gap, broken-data rejection; no network)
        run: python3 scripts/test-land-pl.py

      - name: Poland crops, livestock and milk by voivodeship (GUS BDL API structure, sum of voivodeships against national total, broken-data rejection; synthetic responses, no network)
        run: python3 scripts/test-poland-regions.py

      - name: Spain livestock headcounts by province (MAPA workbook parser, negatives as gaps, sums, refusal on corrupted data; synthetic workbook, no network)
        run: pip install openpyxl && python3 scripts/test-spain-livestock.py

      - name: Spain cereal balance sheets (MAPA PDF parser on real pdftotext extracts, column assignment, empty cells, TOTAL discrepancies as notes, refusal on corrupted tables; no network)
        run: python3 scripts/test-spain-balances.py

      - name: Spain monthly stocks (MAPA SIEGA public report, Power BI response decoder on real saved responses, kilotonne conversion, refusal of paginated/negative/duplicate data, unlabelled series dropped) and HICP butter/cheese parser; no network
        run: python3 scripts/test-spain-siega.py

      - name: Spain Eurostat extras (farmland prices and rents, organic) parse and checks (no network)
        run: python3 scripts/test-spain-eurostat.py

      - name: Data publisher under simultaneous pushes (5 parallel clones, shared registries merged without losing entries, real conflict fails red; no network)
        run: python3 scripts/test-publish-data.py

      - name: News classifier test battery (crop/topic/channel associations, classified-ad noise dropped; no network)
        run: python3 scripts/test-news-classify.py

      - name: RECAN keeps published years when MAPA's resource carries only the latest one (real header, history preserved cell by cell, short dump refused; no network)
        run: python3 scripts/test-recan.py

      - name: USDA release-calendar dispatcher (New York time with and without DST, two attempts, no duplicates, follower after NASS; no network)
        run: python3 scripts/test-release-dispatch.py

      - name: Watchdog for queue-cancelled data workflows (decision rules on fixtures; no network)
        run: python3 scripts/test-rerun-cancelled.py

      - name: Spain annual oilseed balance sheets (MAPA PDF parser on real pdftotext extracts, both tables and row orders, identities, refusal of corrupted tables, link filter, series unit and grouping; no network)
        run: python3 scripts/test-spain-oilseeds.py

      - name: Spain olive sector balance and oil forecast (MAPA PDF parser on real pdftotext extracts, both layouts, UE split, forecast by region sums to the national total; no network)
        run: python3 scripts/test-spain-olive.py

      - name: Spain raw milk deliveries, price and quality (MAPA INFOLAC PDF parser on a real pdftotext extract, 17 regions sum to the national total, price table cross-check, history accumulation and revisions; no network)
        run: python3 scripts/test-spain-milk.py

      - name: Spain livestock slaughter by species and region (MAPA xlsx reader on the real August 2026 workbook, weights, source inconsistency noted, history accumulation and revisions; no network)
        run: python3 scripts/test-spain-slaughter.py

      - name: Spain slaughter census by province (MAPA annual census reader on the real 2025 .xlsx and 2007 .xls workbooks, unit change of poultry and rabbits, DC cells as gap with class, province aliases, sums, accumulation and revisions; no network)
        run: pip install openpyxl xlrd && python3 scripts/test-spain-slaughter-census.py

      - name: Spain wine by campaign and region (MAPA INFOVI July extended report reader on the real 2021 and 2026 workbooks, cross-checks, link discovery, accumulation and revisions; no network)
        run: python3 scripts/test-spain-wine.py

      - name: Spain wine month by month (MAPA INFOVI monthly report reader on the real July 2026 and January 2021 workbooks, month from the sheet title, missing table 4.6 as gap, chaining, link discovery, accumulation and revisions; no network)
        run: python3 scripts/test-spain-wine-monthly.py

      - name: Spain wine historical balances 2009/10-2015/16 (MAPA workbook reader on real xls and xlsx files, blank cells as gaps, final over provisional, identities, chaining, link discovery, accumulation; no network)
        run: pip install openpyxl xlrd && python3 scripts/test-spain-wine-balance-historic.py

      - name: Spain CAP (BOE RD 1048/2022 annex parser, change tracking, refusal on corrupted text, rules vs watched articles; extract of the BOE text as fixture, no network)
        run: python3 scripts/test-cap-es.py

      - name: CAP change watch for Germany, Netherlands, Portugal and Greece (text fingerprints, new rules since start date, broken source is an error not "no change"; saved pages as fixtures, no network)
        run: python3 scripts/test-cap-watch.py

      - name: EU sulphur import unit value from Comext (100 kg to tonnes, unit value, volume threshold, Greece code; synthetic response, no network)
        run: python3 scripts/test-eu-sulphur.py

      - name: EU farm costs and income from FADN/FSDN standard results (semicolon CSV, country codes incl. Greece and EU-27, UK and old aggregates dropped, empty and non-numeric cells, short series, missing columns; synthetic CSV, no network)
        run: python3 scripts/test-eu-fadn.py

      - name: Fertiliser spending (FADN) against urea import unit value (tonne-weighted annual mean, minimum months, implied quantity, missing years left out; synthetic data, no network)
        run: python3 scripts/test-fert-cross.py

      - name: EU weekly fish first-sale prices from EUMOFA (member states only, value/volume by week, volume threshold, catch-all species dropped, species selection; synthetic CSV, no network)
        run: python3 scripts/test-eu-fish-first-sales.py

      - name: EU online retail fish prices from EUMOFA (per-kilo rows only, monthly mean, minimum days and months, jumps flagged, outliers dropped; synthetic CSV, no network)
        run: python3 scripts/test-eu-fish-retail-prices.py

      - name: EU fish consumer price index from Eurostat (JSON-stat parsing, unit and COICOP filter, jump check; synthetic, no network)
        run: python3 scripts/test-eu-fish-hicp.py

      - name: US fertiliser import unit values from the Census (HS10 lines summed, unknown units dropped, minimum tonnes, origins without aggregates; synthetic, no network)
        run: python3 scripts/test-us-fertilizer-imports.py

      - name: US river discharge from USGS (no-data values dropped, 7-day mean, percentile vs same month of earlier years, climatology; synthetic, no network)
        run: python3 scripts/test-us-rivers.py

      - name: German river levels from PEGELONLINE (daily mean only from days with enough readings, current day left out, merge with the saved history, official reference values and status; synthetic, no network)
        run: python3 scripts/test-de-rivers.py

      - name: River levels and discharge for the Netherlands, France, Canada and Flanders (daily mean only from days with enough hours, current day left out, long-series fill only where asked, reference quartiles and percentile from earlier years, status; synthetic, no network)
        run: python3 scripts/test-rivers.py
      - name: Water API (rivers and drought by country; licence gate, units, percentiles, no stale endpoints) and per-source data sheet for the business page
        run: python3 scripts/test-api-water.py

      - name: US sulphur import unit value from the Census API (kg to tonnes, world total vs country sum, volume threshold, unit check; synthetic response, no network or key)
        run: python3 scripts/test-us-sulphur.py

      - name: EU input unit values from Comext (fertilisers, energy, feed; per-product volume threshold, Greece code, origin shares; synthetic response, no network)
        run: python3 scripts/test-eu-input-prices.py

      - name: France Infos Rapides of Agreste (milk tables, crop estimates by edition, trade graphs; no network)
        run: python3 scripts/test-fr-infosrapides.py
      - name: France monthly bulletin of Agreste (tables, periods, units, series kept when the source drops them; no network)
        run: python3 scripts/test-fr-bulconj.py
      - name: France foreign trade of Agreste (periods, units, partner names, years kept when the source drops them; no network)
        run: python3 scripts/test-fr-comex.py
      - name: France employment, TERUTI, IPAMPA and wine harvest of Agreste (tables, periods, keys; no network)
        run: python3 scripts/test-fr-agreste-more.py
      - name: Netherlands CBS blocks (periods, units, padded keys, provisional flags, series kept when a block fails; no network)
        run: python3 scripts/test-nl-cbs-more.py
      - name: Belgium Statbel blocks (unit guards, provisional advance, label matching, series kept when a block fails; no network)
        run: python3 scripts/test-belgium-more.py
      - name: Portugal INE blocks (scale guard from the metadata sheet, periods, geography levels, series kept when a block fails; no network)
        run: python3 scripts/test-portugal-more.py
      - name: Poland ZSRIR bulletins (messy cells, ISO weeks, bulletin date wins over the title, cross-check with the summary, series kept when a block fails; no network)
        run: pip install openpyxl && python3 scripts/test-pl-zsrir.py

      - name: Anomaly verifier (promotes only when the primary source reproduces the value; offline fixtures)
        run: |
          pip install pandas odfpy
          python3 scripts/test-verify-anomalies.py

      - name: Derived builders run end-to-end on the committed data (the same chain update-pipeline-status.yml runs; a crash here would turn that pipeline red)
        run: |
          set -e
          for s in build-us-trade-partners build-cl-trade-partners build-series-registry build-watch-index build-data-catalog build-us-trade-products build-trade-sections build-freshness build-views build-product-compare build-product-profiles build-relationships build-daily-brief build-observatory build-source-candidates build-commercial-catalog build-coverage-gaps build-country-pending build-premium-tracker build-ers-cost-reference build-sowing build-home-tape build-home-explore build-cap-index build-dehesa; do
            python3 scripts/$s.py > /tmp/builder.out 2>&1 || { echo "::error::el constructor $s fallo: $(tail -n 6 /tmp/builder.out | tr '\n' ' ' | cut -c1-600)"; exit 1; }
          done

      - name: Data catalog integrity (manifest, catalogs, shards)
        run: python3 scripts/check-catalog.py --strict

      - name: Perfiles de region (mapas, nombres y datos de los que dependen)
        run: node scripts/test-regions.mjs

      - name: Identidad visible del instrumento (soja, regla de comparacion, cobertura)
        run: node scripts/test-instrument-identity.mjs

      - name: canonicalSeriesId v2 (unicidad salvo equivalencias declaradas)
        run: python3 scripts/test-canonical-ids.py

      - name: Uruguay adapter (odc-uy licence gate, HTML-as-200, URSEA quarantine, land Sem 999, DICOSE PD_AD)
        run: pip install openpyxl && python3 scripts/test-uruguay.py

      - name: Coverage Score precalculado = el de la ficha de pais
        run: node scripts/test-coverage-parity.mjs

      - name: License gate (registry, file coverage, catalog propagation, legal text)
        run: |
          python3 scripts/check-licenses.py --strict
          python3 scripts/test-license-gate.py

      - name: DATA_SOURCES.md generated from the license registry
        # aviso, no bloqueo: sync-readme.yml lo regenera solo al llegar a main un cambio del registro o del catalogo
        run: python3 scripts/build-docs.py --check || echo "::warning::DATA_SOURCES.md por detras del registro; sync-readme.yml lo regenera"

      - name: Versiones ?v= de scripts y estilos al dia (node scripts/stamp-assets.mjs)
        run: node scripts/stamp-assets.mjs --check
      - name: Vista previa social en paginas raiz (node scripts/stamp-social.mjs)
        run: node scripts/stamp-social.mjs --check

      - name: Datos estructurados WebPage y BreadcrumbList en paginas raiz (node scripts/stamp-jsonld.mjs)
        run: node scripts/stamp-jsonld.mjs --check
      - name: Lista de fuentes de Informacion al dia (node scripts/build-sources-view.mjs)
        run: node scripts/build-sources-view.mjs --check
      - name: Cifras del README generadas (python3 scripts/build-readme-status.py)
        # aviso, no bloqueo: sync-readme.yml y refresh-observatory.yml lo regeneran solos tras cada cambio; bloquear aqui solo daba rojo por la carrera entre el commit y el bot
        run: python3 scripts/build-readme-status.py --check || echo "::warning::README por detras de los ficheros; sync-readme.yml lo regenera"

      - name: Service worker version matches the code
        run: node scripts/stamp-sw.mjs --check

      - name: SEO QA (sitemap, canonical, hreflang, JSON-LD)
        run: node scripts/qa-seo.mjs

      - name: Unit Engine (FX historico, bushel por cultivo, ha/acre)
        run: node scripts/test-unit-engine.mjs

      - name: Conversión de moneda con la media mensual del BCE (data.js)
        run: |
          node scripts/test-fx-monthly.mjs
          python3 scripts/build-fx-monthly.py --check

      - name: Smart Watchlist 2.0 (reglas combinables, Transmission Watch, importacion validada)
        run: node scripts/test-watchlist.mjs

      - name: Freshness Engine parity (JS vs Python)
        run: node scripts/test-freshness-parity.mjs

      - name: Repo growth budget (tamano de ficheros, data/ e historial)
        run: python3 scripts/check-repo-growth.py

      - name: Glosario al dia (data/glosario-*.json desde scripts/glosario_entries.py)
        run: python3 scripts/build-glosario.py --check

      - name: Ficheros de datos grandes clasificados (RUNTIME / BUILD_ONLY / DERIVED / ARCHIVE) frente a sus consumidores reales
        run: python3 scripts/check-data-classes.py

      - name: Inventario de workflows al dia (docs/WORKFLOWS.md)
        run: python3 scripts/workflow-inventory.py --check

      - name: Performance budget (gzip)
        run: node scripts/check-performance-budget.mjs

      - name: Retencion de snapshots (prueba)
        run: python3 scripts/test-prune-snapshots.py
      - name: Validate snapshots
        run: node scripts/validate-snapshots.mjs

      - name: Verify generated data builders
        run: |
          node --check scripts/build-data-index.mjs
          node --check scripts/build-csv.mjs
          node --check scripts/update-nass-us.mjs
          node --check scripts/build-data-quality.mjs
          node scripts/qa-site.mjs

  page-budget:
    # Presupuesto de carga inicial POR PAGINA con navegador real (JSON, JS y gzip; peticiones prohibidas; 404 y errores de JS).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Servidor estatico
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
      - name: Presupuesto por pagina (scripts/page-budget.json)
        env:
          CHROMIUM: ''
        run: |
          set +e
          node scripts/measure-pages.mjs --check 2>&1 | tee mp.log; s=${PIPESTATUS[0]}
          # los fallos tambien como anotaciones: se leen en la API sin descargar el log
          if [ $s -ne 0 ]; then sed -n '/superado/,$p' mp.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $s

  e2e:
    # Navegador real (escritorio y movil): errores de consola/pagina, 4xx/5xx, JSON invalido, componentes criticos vacios,
    # flujos de usuario y accesibilidad (axe-core, WCAG 2 A/AA: critical y serious bloquean).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Playwright, Chromium y axe-core
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium
      - name: Servidor estatico
        run: |
          python3 -m http.server 8123 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
      - name: E2E + accesibilidad
        env:
          CHROMIUM: ''
        run: |
          set +e
          node scripts/e2e.mjs --json e2e-report.json 2>&1 | tee e2e.log; s=${PIPESTATUS[0]}
          # los fallos tambien como anotaciones: se leen en la API sin descargar el log
          if [ $s -ne 0 ]; then grep -A8 -E '^FAIL|E2E FALLA' e2e.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $s
      - name: E2E de variantes (smoke - productos 3.0 representativos, comparador, 10 tipos de regla, monedas y unidades, estados de frescura, paginacion)
        env:
          CHROMIUM: ''
        run: node scripts/e2e-variants.mjs --smoke
      - name: Auditoria UX responsive (375/390/430/768/1280)
        env:
          CHROMIUM: ''
        run: |
          set +e
          node scripts/ux-audit.mjs --strict 2>&1 | tee ux.log; s=${PIPESTATUS[0]}
          # los avisos tambien como anotaciones: se leen en la API sin descargar el log
          if [ $s -ne 0 ]; then head -30 ux.log | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $s
      - name: Seguro agrario (cifras exactas, tablas, citas, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-seguro.mjs
      - name: Card sparkline opens the full history chart (mouse and keyboard, rows and cards view, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-spark-history.mjs
      - name: Alemania, ganadería y fruta (cifras de Destatis, selectores, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
        run: node scripts/test-de-livestock.mjs
      - name: Dinamarca, Países Bajos y Francia en profundidad (cifras de StatBank, Retsinformation, CBS, RVO, VigiEau y Céré'Obs, selectores, 4 idiomas, 1280/390)
        env:
          CHROMIUM: ''
