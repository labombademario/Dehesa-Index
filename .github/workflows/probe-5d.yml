name: probe-5d
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: |
          set +e
          python3 probe2.py > probe-run2.txt 2>&1; cp probe-run2.txt probe/ 2>/dev/null
          mkdir -p probe; cp probe-run.txt probe/
          git config user.name probe; git config user.email probe@x
          git add -f probe; git commit -qm "probe out"; git push origin HEAD:research/probe-5d-out -f
