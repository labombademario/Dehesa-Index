# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France consumer potato price at shipping point (FranceAgriMer RNM)
on:
  schedule:
    - cron: '20 14 * * 4,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-france-rnm-potato
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-france-rnm-potato.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/france-rnm-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/france-rnm-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Precio de la patata de consumo en expedición en Francia (FranceAgriMer, RNM)" data/france-rnm-stats.json data/france-rnm-potato-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
