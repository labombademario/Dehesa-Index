# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update UK sea fisheries landings by species, nation and port (MMO)
on:
  schedule:
    - cron: '25 7 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-mmo-fish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uk-mmo-fish.py
        timeout-minutes: 10
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-mmo-fish.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/uk-mmo-fish.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Reino Unido - desembarques de pesca por especie, nacion y puerto (MMO)" data/uk-mmo-fish.json data/uk-mmo-fish-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
