# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Slovakia monthly agricultural prices, quarterly input prices, crops and livestock (Statistical Office SR, STATdata)
on:
  schedule:
    - cron: '25 9 2,29 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-sk-statdata
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-sk-statdata.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/sk-statdata-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/sk-statdata-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Eslovaquia - precios agrarios mensuales, precios de insumos, cultivos y ganado (Oficina de Estadistica, STATdata)" data/sk-statdata-stats.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
