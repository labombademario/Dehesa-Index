# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Portugal (Eurostat)
on:
  schedule:
    - cron: '55 16 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-portugal-eurostat.py
      - name: Validar datos (esquema y tests) antes de commit
        run: |
          python3 scripts/validate-data.py --no-report --files data/portugal-eurostat-stats.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/portugal-eurostat-stats.json; }
          python3 scripts/detect-revisions.py data/portugal-eurostat-stats.json || true
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portugal-eurostat-stats.json data/portugal-eurostat-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Portugal (Eurostat)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
