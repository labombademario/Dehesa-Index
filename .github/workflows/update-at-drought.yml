# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Austria drought (GeoSphere WINFORE SPEI) and groundwater status (BMLUK)
on:
  schedule:
    - cron: '50 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-at-drought
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: pip install netCDF4 numpy shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-at-drought.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/at-drought.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/at-drought.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Sequia (SPEI) y aguas subterraneas en Austria (GeoSphere, BMLUK)" data/at-drought.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
