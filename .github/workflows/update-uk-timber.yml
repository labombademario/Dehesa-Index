# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update UK timber price indices (Forest Research)
on:
  schedule:
    - cron: '15 8 12 5,6,11,12 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-timber
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: pip install pdfplumber
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uk-timber.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-timber-prices.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/uk-timber-prices.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Indices de precios de la madera del Reino Unido (Forest Research)" data/uk-timber-prices.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
