# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada drought (Canadian Drought Monitor)
on:
  schedule:
    - cron: '20 8 * * 2,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-canada-drought
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-canada-drought.py
        timeout-minutes: 30
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/canada-drought.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/canada-drought.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos sequia Canada (Canadian Drought Monitor)" data/canada-drought.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
