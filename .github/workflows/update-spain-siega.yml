# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain monthly stocks of rice, cereals and oilseeds (MAPA SIEGA)
on:
  schedule:
    - cron: '35 9 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-spain-siega
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-spain-siega.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-siega-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/spain-siega-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Existencias mensuales de arroz, cereales y oleaginosas en España (MAPA, SIEGA)" data/spain-siega-stats.json data/spain-siega-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
