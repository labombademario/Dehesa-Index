# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US ERS data products and TTB wine statistics (public domain)
on:
  schedule:
    - cron: '40 14 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-ers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-us-ers.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-ers-stats.json data/us-ttb-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-ers-stats.json data/us-ttb-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos de EE. UU. del USDA ERS (margenes de carne, lacteos, arroz) y del TTB (vino)" data/us-ers-stats.json data/us-ttb-stats.json data/us-ers-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
