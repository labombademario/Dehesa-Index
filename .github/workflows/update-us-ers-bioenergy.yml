# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US bioenergy statistics (USDA ERS)
on:
  schedule:
    - cron: '20 15 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-ers-bioenergy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-ers-bioenergy.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-ers-bioenergy-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-ers-bioenergy-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Bioenergia de EE. UU. - etanol, biodiesel, diesel renovable, materias primas y precios (USDA ERS)" data/us-ers-bioenergy-stats.json data/us-ers-bioenergy-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
