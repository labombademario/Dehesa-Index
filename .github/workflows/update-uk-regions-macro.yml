# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update UK regions population, unemployment and gross value added (ONS via NOMIS)
on:
  schedule:
    - cron: '25 8 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-regions-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uk-regions-macro.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-regions-macro.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/uk-regions-macro.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Poblacion, paro y valor anadido bruto por region del Reino Unido (ONS via NOMIS)" data/uk-regions-macro.json data/uk-regions-macro-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
