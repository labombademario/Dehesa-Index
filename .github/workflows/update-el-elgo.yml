# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Greece milk deliveries and prices, slaughter and dairy production by regional unit (ELGO-DIMITRA, data.gov.gr)
on:
  schedule:
    - cron: '50 9 24 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-el-elgo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-el-elgo.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/el-elgo/milk.json data/el-elgo/meat.json data/el-elgo/dairy.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/el-elgo/milk.json data/el-elgo/meat.json data/el-elgo/dairy.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/el-elgo/milk.json data/el-elgo/meat.json data/el-elgo/dairy.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Leche, sacrificio y lacteos de Grecia por provincia (ELGO-DIMITRA)" data/el-elgo/milk.json data/el-elgo/meat.json data/el-elgo/dairy.json data/el-elgo-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
