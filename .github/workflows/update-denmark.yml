name: Dehesa Data — Dinamarca (Statistics Denmark)
on:
  schedule:
    - cron: '20 14 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update Statistics Denmark prices
        run: python scripts/update-dst-denmark.py | tee data/denmark-log.txt
      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/denmark-prices.json
      - name: Commit
        run: |
          git config user.name "Dehesa Index Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-data.sh "data: Dinamarca (Statistics Denmark, precios agrícolas)" data/denmark-prices.json data/denmark-log.txt
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
