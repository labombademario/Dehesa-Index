name: Dehesa Data — Defra UK milk and price indices

# Precio medio en granja de la leche del Reino Unido (Defra, Open Government Licence v3.0).
# Defra publica una vez al mes; se consulta cada viernes y solo cambia algo si hay dato nuevo.
on:
  schedule:
    - cron: '30 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas odfpy
      - name: Update UK milk (Defra)
        run: python scripts/update-defra-milk-uk.py
      - name: Update UK agricultural price indices (Defra)
        run: python scripts/update-defra-api-uk.py
      - uses: ./.github/actions/price-engine
      - run: node scripts/qa-site.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: refresh UK Defra series"
          user: "dehesa-index-bot"
