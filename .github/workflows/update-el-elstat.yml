# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Greece agricultural price indices and regional farm accounts (ELSTAT)
on:
  schedule:
    - cron: '20 9 16,22 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-el-elstat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl xlrd
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-el-elstat.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/el-elstat/prices.json data/el-elstat/accounts.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/el-elstat/prices.json data/el-elstat/accounts.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/el-elstat/prices.json data/el-elstat/accounts.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Precios agrarios y cuentas regionales de Grecia (ELSTAT)" data/el-elstat/prices.json data/el-elstat/accounts.json data/el-elstat-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
