# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Finland farms, crops and livestock by municipality (Luke)
on:
  schedule:
    - cron: '55 12 18 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fi-kunnat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fi-kunnat.py
        timeout-minutes: 15
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/fi-kunnat)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Finlandia por municipio - explotaciones, superficie por cultivo y ganado (Luke)" data/fi-kunnat-log.txt data/fi-kunnat
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
