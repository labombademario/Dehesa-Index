# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US ARC-CO county payment rates and PLC rates (USDA FSA)
on:
  schedule:
    - cron: '35 6 3,17 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: python3 scripts/update-us-arcplc.py
        timeout-minutes: 30
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always() && steps.fetch.outputs.source != 'unavailable'
        uses: ./.github/actions/validate-files
        with:
          files: data/us-arcplc/index.json data/us-arcplc/national.json
      - name: Detectar revisiones oficiales
        if: always() && steps.fetch.outputs.source != 'unavailable'
        run: python3 scripts/detect-revisions.py data/us-arcplc/index.json data/us-arcplc/national.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always() && steps.fetch.outputs.source != 'unavailable'
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard -- 'data/us-arcplc/*.json')
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure' && steps.fetch.outputs.source != 'unavailable'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-arcplc/index.json data/us-arcplc/national.json data/us-arcplc/log.txt data/us-arcplc data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Tasas ARC/PLC de EE. UU. (USDA FSA)"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          echo '::error::no se pudo publicar tras 6 intentos'; exit 1
      - name: Estado de la fuente (un corte del proveedor se registra como retraso, no como error de Dehesa Index)
        if: always()
        env:
          REASON: ${{ steps.fetch.outputs.reason }}
        run: python3 scripts/source-status.py ${{ steps.fetch.outputs.source == 'unavailable' && 'mark' || (steps.fetch.outcome == 'success' && 'clear' || 'none') }} update-us-arcplc.yml "$REASON"
      - name: Publicar estado de la fuente
        if: always()
        uses: ./.github/actions/publish
        with:
          optional: data/source-status.json
          message: 'Estado de la fuente: us-arcplc'
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
