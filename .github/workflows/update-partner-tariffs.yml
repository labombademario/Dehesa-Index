name: Update partner tariffs (MX, CA, EU)
on:
  schedule:
    - cron: '30 8 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -qq mdbtools >/dev/null
          pip install openpyxl --break-system-packages -q
          python3 scripts/update-partner-tariffs.py
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/tariffs-eu.json data/tariffs-mx.json data/tariffs-ca.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/tariffs-eu.json data/tariffs-mx.json data/tariffs-ca.json
      - name: Publicar
        if: always()
        uses: ./.github/actions/publish
        with:
          paths: data/tariffs-eu.json data/tariffs-mx.json data/tariffs-ca.json data/revisions.json
          optional: data/partner-tariffs-log.txt
          message: "Aranceles México, Canadá y UE"
      - name: Cierre (rojo si hubo datos invalidos o el paso de descarga fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
