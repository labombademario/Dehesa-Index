name: Update partner tariffs (MX, CA, EU)
on:
  schedule:
    - cron: '30 8 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq mdbtools >/dev/null
          pip install openpyxl --break-system-packages -q
          python3 scripts/update-partner-tariffs.py
        continue-on-error: true
      - name: Validar datos (esquema y tests) antes de commit
        if: always()
        run: |
          python3 scripts/validate-data.py --no-report --files data/tariffs-eu.json data/tariffs-mx.json data/tariffs-ca.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/tariffs-eu.json data/tariffs-mx.json data/tariffs-ca.json; }
          python3 scripts/detect-revisions.py data/tariffs-eu.json data/tariffs-mx.json data/tariffs-ca.json || true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet && exit 0
          git commit -qm "Aranceles México, Canadá y UE"
          git pull -q --rebase
          git push
