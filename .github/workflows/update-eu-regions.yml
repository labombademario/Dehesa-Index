# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update regional farm data (Eurostat NUTS 2)
on:
  schedule:
    - cron: '40 6 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eurostat-regions.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-regions-es.json data/eu-regions-fr.json data/eu-regions-it.json data/eu-regions-de.json data/eu-regions-log.txt
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-regions-es.json data/eu-regions-fr.json data/eu-regions-it.json data/eu-regions-de.json data/eu-regions-log.txt
      - name: Publicar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eu-regions-es.json data/eu-regions-fr.json data/eu-regions-it.json data/eu-regions-de.json data/eu-regions-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos agrarios por region (Eurostat)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo '::error::no se pudo publicar tras 3 intentos'; exit 1
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
