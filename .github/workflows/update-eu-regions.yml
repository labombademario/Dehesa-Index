# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update regional farm data (Eurostat NUTS 2)
on:
  schedule:
    - cron: '40 6 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-regions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eurostat-regions.py
        timeout-minutes: 16
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-regions-es.json data/eu-regions-fr.json data/eu-regions-it.json data/eu-regions-de.json data/eu-regions-nl.json data/eu-regions-at.json data/eu-regions-be.json data/eu-regions-dk.json data/eu-regions-pl.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-regions-es.json data/eu-regions-fr.json data/eu-regions-it.json data/eu-regions-de.json data/eu-regions-nl.json data/eu-regions-at.json data/eu-regions-be.json data/eu-regions-dk.json data/eu-regions-pl.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos agrarios por region (Eurostat)" data/eu-regions-es.json data/eu-regions-fr.json data/eu-regions-it.json data/eu-regions-de.json data/eu-regions-nl.json data/eu-regions-at.json data/eu-regions-be.json data/eu-regions-dk.json data/eu-regions-pl.json data/eu-regions-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
