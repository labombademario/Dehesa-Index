name: Probe sorgo (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/probe-sorghum.mjs
      - run: |
          git config user.name "dehesa-index-bot"; git config user.email "actions@users.noreply.github.com"
          git add scripts/.probe-sorghum.txt; git commit -m "Probe sorgo" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
