# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Rebuild SEO landing pages
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: node scripts/build-seo-pages.mjs
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: node scripts/qa-seo.mjs
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Páginas SEO por país y categoría" datos precios regiones en fr it blog index.html blog.html sitemap.xml sitemap-lastmod.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
