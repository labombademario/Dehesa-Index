# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Rebuild SEO landing pages
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: node scripts/build-seo-pages.mjs
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: node scripts/qa-seo.mjs
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos precios regiones en fr it sitemap.xml sitemap-lastmod.json
          git diff --cached --quiet && exit 0
          git commit -qm "Páginas SEO por país y categoría"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          echo '::error::no se pudo publicar tras 6 intentos'; exit 1
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
