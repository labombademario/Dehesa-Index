# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update monthly rainfall and temperature for regions of BE, AT, EL, IT and DE (NASA POWER)
on:
  schedule:
    - cron: '50 10 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-region-climate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh node scripts/update-eu-region-climate.mjs
        timeout-minutes: 25
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-region-climate.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-region-climate.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Lluvia y temperatura mensual por region de Belgica, Austria, Grecia, Italia y Alemania (NASA POWER)" data/eu-region-climate.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
