# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU cereal and oilseed closing stocks by country (Eurostat)
on:
  schedule:
    - cron: '50 7 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-stocks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eu-stocks.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-stocks-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eu-stocks-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Existencias de cierre de cereales y oleaginosas por pais (Eurostat, balances de cultivos)" data/eu-stocks-stats.json data/eu-stocks-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
