# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU organic vs conventional farm-gate price comparison (European Commission Agri-food data portal)
on:
  schedule:
    - cron: '20 9 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-organic
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-organic.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-organic-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eu-organic-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Precios ecologico frente a convencional en la UE (Comision Europea, portal Agri-food)" data/eu-organic-stats.json data/eu-organic-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
