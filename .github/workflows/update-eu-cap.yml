# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU CAP allocations by Member State (Regulation 2021/2115, EUR-Lex)
on:
  schedule:
    - cron: '40 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-cap
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-cap.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/cap/eu/allocations.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/cap/eu/allocations.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard -- 'data/cap/eu/*.json')
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "PAC de la UE por Estado miembro (Reglamento 2021/2115)" data/cap/eu/allocations.json data/cap/eu/allocations-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
