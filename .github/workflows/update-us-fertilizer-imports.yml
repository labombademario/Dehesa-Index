# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US fertiliser import unit values by product and origin (US Census Bureau)
on:
  schedule:
    - cron: '40 10 8,10,14 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-fertilizer-imports
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-fertilizer-imports.py
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-fertilizer-imports.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-fertilizer-imports.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Fertilizantes - valor unitario de importacion EE. UU. (US Census Bureau)" data/us-fertilizer-imports.json data/us-fertilizer-imports-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
