name: Update USDA supply and demand (PSD)
on:
  schedule:
    - cron: '0 16 13,17 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Download official PSD bulk files
        run: |
          mkdir -p /tmp/psd
          for u in psd_grains_pulses_csv.zip psd_oilseeds_csv.zip psd_livestock_csv.zip psd_dairy_csv.zip psd_sugar_csv.zip; do
            curl -fsSL --retry 3 -m 180 -o /tmp/$u "https://apps.fas.usda.gov/psdonline/downloads/$u"
            unzip -o -q /tmp/$u -d /tmp/psd
          done
      - name: Build supply and demand data
        run: node scripts/update-usda-psd.mjs
      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/supply-demand.json data/supply-demand-map.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supply-demand.json data/supply-demand-map.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update USDA supply and demand (PSD)"
          git pull --rebase origin main
          git push
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
