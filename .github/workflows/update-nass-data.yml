name: Dehesa Data — NASS snapshot

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-nass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update NASS observations and snapshots
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          set -e
          for product in trigo maiz arroz leche huevos cerdo vaca pollo; do
            node scripts/update-nass-us.mjs "$product"
          done

      - name: Validate snapshots
        run: node scripts/validate-snapshots.mjs

      - name: Build data index
        run: node scripts/build-data-index.mjs

      - name: Build CSV export
        run: node scripts/build-csv.mjs

      - name: Build data quality report
        run: node scripts/build-data-quality.mjs

      - name: Build Intelligence 2.0
        run: node scripts/build-intelligence.mjs

      - name: Build normalization
        run: node scripts/build-normalized-data.mjs

      - name: Build cross-market relationships
        run: node scripts/build-cross-market.mjs

      - name: Build alert signals
        run: node scripts/build-alert-signals.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- js/data.js data/snapshots data/latest.json data/catalog.json data/history.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/alerts.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "dehesa-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data.js data/snapshots data/latest.json data/catalog.json data/history.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/alerts.json
          git commit -m "data: update NASS observations and snapshots"
          git push
