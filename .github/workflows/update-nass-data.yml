name: Dehesa Data — NASS snapshot

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-nass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Update NASS observations and snapshots
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          ok=0; bad=""
          for product in trigo maiz arroz cebada avena colza sorgo leche huevos cerdo vaca pollo soja_grano lenteja guisante_seco lino centeno cordero; do
            if bash scripts/annotate-failure.sh node scripts/update-nass-us.mjs "$product"; then ok=$((ok+1)); else bad="$bad $product"; fi
          done
          # un producto que falla no impide actualizar los demas; si fallan todos, el paso falla
          if [ "$ok" -eq 0 ]; then echo "::error::NASS: fallaron todos los productos"; exit 1; fi
          if [ -n "$bad" ]; then echo "::warning::NASS: sin actualizar:$bad"; fi

      - name: Precios ya descargados por otros pipelines que van al panel (azucar de EE. UU. del ERS; sin red)
        run: python3 scripts/bridge-panel-stats.py
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js
          preset: price-engine
          message: "data: update NASS observations and snapshots"
          user: "dehesa-index-bot"
