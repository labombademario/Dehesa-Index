name: Dehesa Data — NASS snapshot

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-nass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update NASS observations and snapshots
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          set -e
          for product in trigo maiz arroz cebada avena colza sorgo leche huevos cerdo vaca pollo; do
            node scripts/update-nass-us.mjs "$product"
          done

      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js data/snapshots data/latest.json data/catalog.json data/history.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: update NASS observations and snapshots"
          user: "dehesa-index-bot"
