name: Dehesa Data — NASS snapshot

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-nass:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Update NASS observations and snapshots
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          set -e
          for product in trigo maiz arroz cebada avena colza sorgo leche huevos cerdo vaca pollo; do
            node scripts/update-nass-us.mjs "$product"
          done

      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js
          preset: price-engine
          message: "data: update NASS observations and snapshots"
          user: "dehesa-index-bot"
