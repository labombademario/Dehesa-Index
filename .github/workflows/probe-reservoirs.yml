name: Probe reservoir sources
on:
  workflow_dispatch:
  push:
    branches: [research/probe-reservoirs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Leer el balance del olivar sin publicar
        run: |
          if ! python3 scripts/update-spain-olive.py --out /tmp/olive-out; then echo "script exit != 0"; fi
          cat data/spain-olive-log.txt
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/olive-out/olive.json'))
          for y, c in d['campaigns'].items():
              print(y, c['label'], c['status'], c['update'], c.get('pdf'))
              for p in d['products']:
                  v = c['v'][p]
                  print('   ', p, 'ini', v['beginningStocks'], 'prod', v['production'], 'fin', v['endingStocks'])
          print('aforo', d['aforo']['campaign'], d['aforo']['label'], d['aforo']['published'])
          PY
