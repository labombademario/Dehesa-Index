name: Probe reservoir sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (compatible; DehesaIndexBot/1.0; +https://dehesaindex.com)"
          probe() {
            n="$1"; u="$2"
            echo "=================== $n  $u"
            : > /tmp/o.bin
            if ! code=$(curl -sS -L -m 40 -A "$UA" -o /tmp/o.bin -w '%{http_code} %{content_type} %{size_download}B' "$u" 2>&1); then code="curl error: $code"; fi
            echo "status: $code"
            head -c 1500 /tmp/o.bin | tr -s '\r\n\t ' ' ' | head -c 1500; echo
            grep -aoiE "(licen[cs]e|licencia|licenza|creative commons|copyright|termos|terms of use)[^<]{0,160}" /tmp/o.bin | head -6
          }
          probe PT-home "https://snirh.apambiente.pt/index.php?idMain=1&idItem=1.3"
          probe PT-albufeiras "https://snirh.apambiente.pt/index.php?idMain=1&idItem=1.3&idISubItem=1.3.1"
          probe PT-csv "https://snirh.apambiente.pt/snirh/_dadosbase/site/paraCSV/dados_csv.php?sites=910589541&pars=1849&tmin=01/10/2026&tmax=30/10/2026&formato=csv"
          probe AU-storages "http://www.bom.gov.au/water/storages/"
          probe AU-murray "http://www.bom.gov.au/water/storages/index.shtml?basin=murray-darling"
          probe AU-copyright "http://www.bom.gov.au/other/copyright.shtml"
          probe AU-nsw "https://api.waternsw.com.au/"
          probe CL-dga "https://dga.mop.gob.cl/"
          probe CL-embalses "https://snia.mop.gob.cl/dgasat/pages/dgasat_embalses/dgasat_embalses.jsp"
          probe CL-snia "https://snia.mop.gob.cl/BNAConsultas/reportes"
          probe IT-anbi "https://www.anbi.it/osservatorio-risorse-idriche"
          probe IT-anbi2 "https://www.osservatorioanbi.it/"
          probe GR-eydap "https://www.eydap.gr/en/TheCompany/WaterSupplySystem/Reservoirs/"
          probe UK-yorks "https://environment.data.gov.uk/hydrology/id/stations?_limit=1"
