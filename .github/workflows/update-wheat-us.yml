name: Actualizar precio de trigo (EE. UU., USDA NASS)

# Piloto de automatización de datos: solo cubre cereales:trigo, región `us`,
# vía la API gratuita de USDA NASS Quick Stats. El resto de fuentes del
# sitio (Euronext/MATIF, AHDB, CME, Comisión Europea...) sigue
# actualizándose a mano -- ver js/scripts/update-wheat-us.mjs para el
# porqué y el alcance exacto.
#
# Requiere un secreto de repositorio llamado NASS_API_KEY (Settings ->
# Secrets and variables -> Actions -> New repository secret), con una
# clave gratuita pedida en https://quickstats.nass.usda.gov/api.

on:
  schedule:
    # USDA publica su informe mensual "Agricultural Prices" a finales de
    # mes; el día 3 de cada mes a las 12:00 UTC da margen de sobra.
    - cron: '0 12 3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-wheat-us:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar USDA NASS y actualizar js/data.js
        id: update
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-wheat-us.mjs

      - name: Comprobar si hay cambios
        id: diff
        run: |
          if git diff --quiet -- js/data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push del precio actualizado
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "dehesa-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/data.js
          git commit -m "Actualización automática: trigo EE. UU. (USDA NASS) a \$${{ steps.update.outputs.price }}/bu (${{ steps.update.outputs.change }}%)"
          git push
