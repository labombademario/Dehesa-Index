# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Croatia drought by county (EDO Combined Drought Indicator)
on:
  schedule:
    - cron: '55 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-hr-drought
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet numpy netCDF4 shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-hr-drought.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/hr-drought.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/hr-drought.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Sequia por provincia en Croacia (EDO)" data/hr-drought.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
