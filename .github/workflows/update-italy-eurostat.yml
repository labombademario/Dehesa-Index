# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Italy (Eurostat)
on:
  schedule:
    - cron: '25 17 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-italy-eurostat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-italy-eurostat.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/italy-eurostat-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/italy-eurostat-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Italia (Eurostat)" data/italy-eurostat-stats.json data/italy-eurostat-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
