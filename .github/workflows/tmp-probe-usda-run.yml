name: tmp-probe-usda-run
on:
  push:
    branches: [research/probe-usda-run]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 probe/eu_probe3.py > probe/eu_probe3.log 2>&1 || true
          git config user.name probe; git config user.email probe@x
          git add -f probe/eu-out3 probe/eu_probe3.log; git commit -qm "probe eu out" || true; git push || true
