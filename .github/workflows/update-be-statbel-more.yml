# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Belgium livestock and land census, harvest, food CPI, fishing, dairy products and meat balances (Statbel)
on:
  schedule:
    - cron: '20 9 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-be-statbel-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl xlrd
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-belgium-more.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/belgium-more/index.json data/belgium-more-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/belgium-more/index.json data/belgium-more-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/belgium-more) data/belgium-more-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos Bélgica censo ganadero, cosecha, IPC de alimentos, pesca, lácteos y balances de carne (Statbel)" data/belgium-more/index.json data/belgium-more-stats.json data/belgium-more-log.txt data/belgium-more data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
