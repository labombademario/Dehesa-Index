name: Update France (FranceAgriMer)
on:
  schedule:
    - cron: '10 15 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl xlrd
      - run: python3 scripts/update-france.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france-stats.json data/france-log.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Francia (FranceAgriMer)"
          git pull -q --rebase
          git push
