# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France (FranceAgriMer)
on:
  schedule:
    - cron: '10 15 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl xlrd
      - run: python3 scripts/update-france.py
      - name: Validar datos (esquema y tests) antes de commit
        run: |
          python3 scripts/validate-data.py --no-report --files data/france-stats.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/france-stats.json; }
          python3 scripts/detect-revisions.py data/france-stats.json || true
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/france-stats.json data/france-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Francia (FranceAgriMer)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
