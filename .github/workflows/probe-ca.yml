name: Probe CA
on:
  workflow_dispatch:
    inputs:
      ids:
        default: '32100359'
      tag:
        default: 'a'
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe-ca.py ${{ github.event.inputs.ids }} ${{ github.event.inputs.tag }}
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -qm "probe ca" || exit 0
          git pull -q --rebase
          git push
