name: tmp-probe-eu
on:
  push:
    branches: [research/probe-eu-outlook]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 probe/eu.py > probe/eu.log 2>&1 || true
          git config user.name probe; git config user.email probe@x
          git add -f probe/eu.log probe/eu-out; git commit -qm "probe out" || true; git pull -q --rebase; git push || true
