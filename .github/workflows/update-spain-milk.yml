# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain raw milk deliveries, prices and quality (MAPA INFOLAC)
on:
  schedule:
    - cron: '5 8 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-spain-milk
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - id: fetch
        run: python3 scripts/update-spain-milk.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-milk/infolac.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/spain-milk/infolac.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/spain-milk)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos leche cruda de España, entregas, precio y calidad (MAPA INFOLAC)" data/spain-milk/infolac.json data/spain-milk-log.txt data/spain-milk data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
