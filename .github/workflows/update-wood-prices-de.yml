# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany state-forest timber price index (Destatis 61231)
on:
  schedule:
    - cron: '25 7 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-wood-prices-de
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-wood-prices-de.py
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/wood-prices-de.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/wood-prices-de.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Indice de precios de la madera alemana (Destatis)" data/wood-prices-de.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
