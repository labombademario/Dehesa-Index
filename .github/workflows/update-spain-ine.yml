# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain food CPI, industrial producer prices, farm employment and regional farm value added (INE)
on:
  schedule:
    - cron: '25 10 2,16,26 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-spain-ine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-spain-ine.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-ine-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/spain-ine-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "IPC de alimentos, precios industriales, ocupados agrarios y VAB agrario por comunidad de España (INE)" data/spain-ine-stats.json data/spain-ine-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
