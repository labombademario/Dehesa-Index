# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Ireland agricultural greenhouse gas emissions (Eurostat env_air_gge)
on:
  schedule:
    - cron: '40 8 4 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ie-ghg-agri
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-ghg-agri.py IE ie
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/ie-ghg-agri.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/ie-ghg-agri.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Emisiones de la agricultura irlandesa (Eurostat)" data/ie-ghg-agri.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
