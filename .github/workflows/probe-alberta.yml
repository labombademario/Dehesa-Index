name: Probe Alberta weekly reviews
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 scripts/probe-alberta.py 2>&1 | tee data/probe-alberta-log.txt
        continue-on-error: true
      - run: |
          git config user.name "Dehesa Index Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-alberta data/probe-alberta-log.txt
          git diff --cached --quiet || git commit -m "probe: Alberta weekly reviews"
          git pull --rebase origin main
          git push
