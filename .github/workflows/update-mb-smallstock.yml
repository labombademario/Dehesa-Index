# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Manitoba sheep, goat and hog prices (Manitoba Agriculture)
on:
  schedule:
    - cron: '40 20 * * 2'
    - cron: '10 22 * * 5'
    - cron: '20 14 * * 3'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'true = leer tambien los informes del archivo (primera carga o recuperacion)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: dehesa-mb-cattle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - id: fetch
        run: python3 scripts/update-mb-smallstock.py ${{ github.event.inputs.backfill == 'true' && '--backfill' || '' }}
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/mb-markets/sheep-goat.json data/mb-markets/hogs.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/mb-markets/sheep-goat.json data/mb-markets/hogs.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/mb-markets)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos precios de ovino, caprino y porcino de Manitoba" data/mb-markets/sheep-goat.json data/mb-markets/hogs.json data/mb-smallstock-log.txt data/mb-markets data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
