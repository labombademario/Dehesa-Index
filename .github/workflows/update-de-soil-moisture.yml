# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany soil moisture by state (DWD grids)
on:
  schedule:
    - cron: '20 10 3,13 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-de-soil-moisture
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: pip install pyproj shapely numpy
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-de-soil-moisture.py
        timeout-minutes: 40
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/de-soil-moisture.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/de-soil-moisture.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Humedad del suelo en Alemania (DWD)" data/de-soil-moisture.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
