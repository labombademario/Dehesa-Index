# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update official timber prices by assortment (SURS, CSU, CSP, Luke, GUS)
on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-forest-timber-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-forest-timber-prices.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/forest-timber-prices.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/forest-timber-prices.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Precios oficiales de la madera por surtido (Eslovenia, Chequia, Letonia, Finlandia y Polonia)" data/forest-timber-prices.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
