name: tmp-probe-genesis
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
        run: |
          set +e
          mkdir -p probe-out
          python3 scripts/update-germany.py > probe-out/run.txt 2>&1; echo "exit $?" >> probe-out/run.txt
          python3 scripts/validate-data.py --all --no-report > probe-out/validate.txt 2>&1; echo "exit $?" >> probe-out/validate.txt
          ls -la data/germany-agri.json probe-out > probe-out/ls.txt 2>&1
          for f in run validate ls; do
            python3 - "$f" <<'PY'
import sys
t = open('probe-out/%s.txt' % sys.argv[1], errors='replace').read()
t = t[-3500:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
print('::notice title=probe-%s::%s' % (sys.argv[1], t))
PY
          done
          exit 0
