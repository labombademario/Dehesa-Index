# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update diesel in 16 more EU countries (EU Weekly Oil Bulletin)
on:
  schedule:
    - cron: '50 7 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-diesel-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-diesel-more.py
        timeout-minutes: 25
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/diesel-eu-more.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/diesel-eu-more.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Gasoleo semanal en 16 paises de la UE (Boletin Petrolero de la Comision)" data/diesel-eu-more.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
