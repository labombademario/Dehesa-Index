# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada commercial sea fisheries landings by province and species (Fisheries and Oceans Canada)
on:
  schedule:
    - cron: '15 7 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ca-dfo-landings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ca-dfo-landings.py
        timeout-minutes: 10
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/ca-dfo-landings.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/ca-dfo-landings.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Canada - desembarques comerciales de pesca marina por provincia y especie (DFO)" data/ca-dfo-landings.json data/ca-dfo-landings-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
