# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Australia crops by statistical area SA2 (ABS Australian Agriculture)
on:
  schedule:
    - cron: '35 11 10 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-au-sa2-agriculture
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-au-sa2-agriculture.py
        timeout-minutes: 14
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/au-sa2)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Cultivos de Australia por zona estadistica SA2 (ABS)" data/au-sa2-log.txt data/au-sa2
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
