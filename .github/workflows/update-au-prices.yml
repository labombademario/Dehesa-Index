# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Australia prices (ABS CPI, PPI, trade price indices, harvest value; RBA commodity prices)
on:
  schedule:
    - cron: '40 11 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-au-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-au-prices.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/australia-prices-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/australia-prices-stats.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos precios Australia (ABS y RBA)" data/australia-prices-stats.json data/australia-prices-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
