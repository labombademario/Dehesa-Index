# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada stats (Statistics Canada)
on:
  schedule:
    - cron: '35 15 * * 1,4'
  workflow_dispatch:
    inputs:
      only:
        description: 'Funciones a ejecutar (vacío = todas), p. ej. trade'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: dehesa-canada-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-canada-stats.py
        env:
          ONLY: ${{ github.event.inputs.only }}
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/canada-stats.json data/supply-balances/ca.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/canada-stats.json data/supply-balances/ca.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos Canadá (Statistics Canada)" data/canada-stats.json data/supply-balances/ca.json data/canada-stats-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
