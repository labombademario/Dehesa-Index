# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada stats (Statistics Canada)
on:
  schedule:
    - cron: '35 15 * * 1,4'
  workflow_dispatch:
    inputs:
      only:
        description: 'Funciones a ejecutar (vacío = todas), p. ej. trade'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-canada-stats.py
        env:
          ONLY: ${{ github.event.inputs.only }}
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests) antes de commit
        if: always()
        run: |
          python3 scripts/validate-data.py --no-report --files data/canada-stats.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/canada-stats.json; }
          python3 scripts/detect-revisions.py data/canada-stats.json || true
      - name: Publicar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canada-stats.json data/canada-stats-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Canadá (Statistics Canada)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
