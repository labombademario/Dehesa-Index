# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Catalonia agricultural prices received index (Generalitat de Catalunya, DACC)
on:
  schedule:
    - cron: '50 10 5,20 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-es-catalonia-ippa
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install xlrd
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-es-catalonia-ippa.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-catalonia-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/spain-catalonia-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Índice de precios percibidos agrarios de Cataluña (Generalitat de Catalunya)" data/spain-catalonia-stats.json data/spain-catalonia-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
