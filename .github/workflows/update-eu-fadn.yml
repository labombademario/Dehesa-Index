# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU farm costs and income by member state (FADN/FSDN standard results, European Commission)
on:
  schedule:
    - cron: '40 10 12 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-fadn
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-fadn.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-fadn.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-fadn.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Costes y renta de las explotaciones - UE (FADN/FSDN)" data/eu-fadn.json data/eu-fadn-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
