name: Dehesa Data — Reino Unido panel (combustible, Irlanda del Norte, huevos)
on:
  schedule:
    - cron: '20 18 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Construir observaciones de Reino Unido para el panel
        run: python scripts/build-uk-panel-obs.py
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/snapshots
          preset: price-engine
          message: "data: Reino Unido panel"
          user: "Dehesa Index Bot"
