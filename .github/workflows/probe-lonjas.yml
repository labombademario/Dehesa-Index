name: probe-lonjas
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          set +e; mkdir -p probe
          UA="Mozilla/5.0 (compatible; DehesaIndexProbe/1.0; +https://dehesaindex.com)"
          g() { curl -sS -L -m 40 -A "$UA" -D "probe/$1.hdr.out.txt" "$2" -o "probe/$1.body" ; echo "$1 rc=$?" >> probe/rc.out.txt; head -c "${3:-6000}" "probe/$1.body" > "probe/$1.out.txt"; wc -c < "probe/$1.body" >> probe/rc.out.txt; rm -f "probe/$1.body"; }
          # robots
          for h in www.economia-sniim.gob.mx www.magyp.gob.ar datos.gob.ar datos.odepa.gob.cl www.odepa.gob.cl www.ismeamercati.it www.ismea.it; do g "robots-$h" "https://$h/robots.txt" 3000; done
          # Argentina datos abiertos (CKAN)
          g ar-search1 "https://datos.gob.ar/api/3/action/package_search?q=hacienda&rows=15&fl=name,title,license_title" 8000
          g ar-search2 "https://datos.gob.ar/api/3/action/package_search?q=siocarnes&rows=15" 8000
          g ar-search3 "https://datos.gob.ar/api/3/action/package_search?q=canuelas&rows=15" 8000
          g ar-search4 "https://datos.gob.ar/api/3/action/package_search?q=mercado+agroganadero&rows=15" 8000
          g ar-sio "https://www.magyp.gob.ar/sitio/areas/ss_mercados_agropecuarios/sistemas-de-informacion-de-operaciones-sio/sio-carnes/index.php" 12000
          # Chile
          g cl-home "https://datos.odepa.gob.cl/" 8000
          g cl-search "https://datos.odepa.gob.cl/api/3/action/package_search?q=ferias&rows=15" 8000
          g cl-search2 "https://datos.odepa.gob.cl/api/3/action/package_search?q=ganado&rows=15" 8000
          g cl-precios "https://www.odepa.gob.cl/precios/al-productor" 12000
          # Mexico
          g mx-home "https://www.economia-sniim.gob.mx/" 12000
          g mx-pec "https://www.economia-sniim.gob.mx/nuevo/" 12000
          # Italia
          g it-home "https://www.ismeamercati.it/" 12000
          g it-open "https://www.ismeamercati.it/dati-aperti" 8000
          git config user.name probe; git config user.email probe@x
          git add -f probe; git commit -qm "probe out"; git push origin HEAD:research/probe-lonjas-out -f
