# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US federal milk marketing order prices, pool and mailbox prices (USDA AMS datamart)
on:
  schedule:
    - cron: '10 17 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-fmmo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-fmmo.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-fmmo-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-fmmo-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Leche de EE. UU. - precios de clase, precio uniforme, mailbox y pool de las ordenes federales (USDA AMS)" data/us-fmmo-stats.json data/us-fmmo-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
