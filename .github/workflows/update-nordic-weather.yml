# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Sweden and Denmark observed weather against normal (SMHI and DMI open data)
on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-nordic-weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-nordic-weather.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/se-weather.json data/dk-weather.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/se-weather.json data/dk-weather.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/se-weather.json data/dk-weather.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Tiempo observado en Suecia y Dinamarca frente a lo normal (SMHI, DMI)" data/se-weather.json data/dk-weather.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
