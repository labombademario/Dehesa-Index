# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU extra-EU agri-food trade by partner (Eurostat Comext)
on:
  schedule:
    - cron: '50 9 17 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-trade-extra
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-trade-extra.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-extra-trade-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-extra-trade-stats.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Comercio agroalimentario extra-UE por socio (Eurostat Comext)" data/eu-extra-trade-stats.json data/eu-extra-trade-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
