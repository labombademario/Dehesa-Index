name: probe-at1
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - run: |
          set +e
          python3 probe_at1.py > probe-runar.txt 2>&1; mkdir -p probe; cp probe-runar.txt probe/
          git config user.name probe; git config user.email probe@x
          git add -f probe; git commit -qm "probe out"; git push origin HEAD:research/probe-at1-out -f
