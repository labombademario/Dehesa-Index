# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Finland (Statistics Finland, agricultural, input, consumer and producer price indices)
on:
  schedule:
    - cron: '10 8 5,20 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-finland-statfin
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fi-statfin.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/finland-statfin-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/finland-statfin-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Finlandia (Statistics Finland, indices de precios agrarios, insumos y consumo)" data/finland-statfin-stats.json data/finland-statfin-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
