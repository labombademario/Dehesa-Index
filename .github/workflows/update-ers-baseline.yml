# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update USDA ERS 10-year agricultural baseline projections (Agricultural Baseline Database)
on:
  schedule:
    - cron: '20 6 20 11,12,2,3 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ers-baseline
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ers-baseline.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-markets/baseline.json data/us-markets/baseline-tables.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-markets/baseline.json data/us-markets/baseline-tables.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/us-markets/baseline.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Proyecciones agrarias a 10 anos (USDA ERS)" data/us-markets/baseline.json data/us-markets/baseline-tables.json data/ers-baseline-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
