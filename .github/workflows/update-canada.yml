name: Dehesa Data — Canadá (Statistics Canada)
on:
  schedule:
    - cron: '40 13 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update Statistics Canada farm prices
        run: python scripts/update-statcan-canada.py
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/canada-coverage.json
          preset: price-engine
          message: "data: Canadá (Statistics Canada, precios agrícolas)"
          user: "Dehesa Index Bot"
