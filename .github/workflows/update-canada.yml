name: Dehesa Data — Canadá (Statistics Canada)
on:
  schedule:
    - cron: '40 13 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Statistics Canada farm prices
        run: python scripts/update-statcan-canada.py
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json data/canada-coverage.json
          message: "data: Canadá (Statistics Canada, precios agrícolas)"
          user: "Dehesa Index Bot"
