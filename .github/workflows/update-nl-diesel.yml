# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Netherlands diesel (EU Weekly Oil Bulletin), CBS pump prices and farm diesel purchase price
on:
  schedule:
    - cron: '30 7 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-nl-diesel
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-nl-diesel.py
        timeout-minutes: 25
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/nl-diesel.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/nl-diesel.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Gasoleo en Paises Bajos (Boletin Petrolero UE, CBS, precio de compra agrario)" data/nl-diesel.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
