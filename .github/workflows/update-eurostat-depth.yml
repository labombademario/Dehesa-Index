# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Eurostat depth (ES, FR, DK, NL, BE, DE, EU-27)
on:
  schedule:
    - cron: '40 17 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eurostat-depth
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eurostat-depth.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eurostat-depth-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eurostat-depth-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Eurostat ES, FR, DK, NL, BE, DE y UE-27 (profundidad)" data/eurostat-depth-stats.json data/eurostat-depth-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
