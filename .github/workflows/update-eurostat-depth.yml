# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Eurostat depth (ES, FR, DK, NL, BE, DE, EU-27)
on:
  schedule:
    - cron: '40 17 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eurostat-depth.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eurostat-depth-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eurostat-depth-stats.json
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurostat-depth-stats.json data/eurostat-depth-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Eurostat ES, FR, DK, NL, BE, DE y UE-27 (profundidad)"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || :
            sleep $((i * 5 + RANDOM % 10))
          done
          echo '::error::no se pudo publicar tras 6 intentos'; exit 1
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
