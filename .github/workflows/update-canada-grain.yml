# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada weekly grain statistics (Canadian Grain Commission)
on:
  schedule:
    - cron: '40 16 * * 3,4,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-canada-grain
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-canada-grain.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/canada-grain.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/canada-grain.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos semanales de granos de Canada (Canadian Grain Commission)" data/canada-grain.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
