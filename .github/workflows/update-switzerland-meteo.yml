# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Switzerland (MeteoSwiss climate)
on:
  schedule:
    - cron: '35 5 4 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-switzerland-meteo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-ch-meteo.py
        timeout-minutes: 10
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/switzerland-meteo-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/switzerland-meteo-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Suiza (MeteoSuisse, clima)" data/switzerland-meteo-stats.json data/switzerland-meteo-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
