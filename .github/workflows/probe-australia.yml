name: Probe Australia sources
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p data/probe
          python3 scripts/probe-au2.py
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe; git commit -qm "probe australia" ; git pull -q --rebase; git push
