# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Italy food consumer prices, farm employment and regional farm value added (ISTAT, Eurostat HICP)
on:
  schedule:
    - cron: '35 11 4,19 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-it-istat-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-it-istat-more.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/italy-istat-more-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/italy-istat-more-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Precios al consumo de alimentos, ocupados agrarios y valor añadido agrario por región de Italia (ISTAT)" data/italy-istat-more-stats.json data/italy-istat-more-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
