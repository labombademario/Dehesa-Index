# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Netherlands nitrate in leaching water and ditches (RIVM LMM) and groundwater (Eurostat)
on:
  schedule:
    - cron: '55 8 7 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-nl-nitrates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-nl-nitrates.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/nl-nitrates.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/nl-nitrates.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Nitratos en el agua de explotaciones agrarias de Paises Bajos (RIVM, Eurostat)" data/nl-nitrates.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
