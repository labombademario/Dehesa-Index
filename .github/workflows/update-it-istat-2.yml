# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Italy ISTAT crops, regional milk, agritourism and irrigation (agricultural census 2020)
on:
  schedule:
    - cron: '30 7 7 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-it-istat-2
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-it-istat-2.py
        timeout-minutes: 45
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/italy-istat/crops.json data/italy-istat/crops-prov.json data/italy-istat/milk.json data/italy-istat/agritourism.json data/italy-istat/irrigation.json data/italy-istat/comuni.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/italy-istat/crops.json data/italy-istat/crops-prov.json data/italy-istat/milk.json data/italy-istat/agritourism.json data/italy-istat/irrigation.json data/italy-istat/comuni.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/italy-istat/crops.json data/italy-istat/crops-prov.json data/italy-istat/milk.json data/italy-istat/agritourism.json data/italy-istat/irrigation.json data/italy-istat/comuni.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Cultivos, leche por región, agriturismo y riego de Italia (ISTAT)" data/italy-istat/crops.json data/italy-istat/crops-prov.json data/italy-istat/milk.json data/italy-istat/agritourism.json data/italy-istat/irrigation.json data/italy-istat/comuni.json data/italy-istat-2-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
