# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Poland cereal, rapeseed, meat, dairy, egg and feed prices (ZSRIR weekly bulletins, Ministry of Agriculture)
on:
  schedule:
    - cron: '15 7,10,13,16,19 * * 4,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-pl-zsrir
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-pl-zsrir.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/poland-zsrir/index.json data/poland-zsrir-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/poland-zsrir/index.json data/poland-zsrir-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/poland-zsrir) data/poland-zsrir-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos Polonia precios de cereales, colza, carne, lácteos, huevos y piensos (ZSRIR)" data/poland-zsrir/index.json data/poland-zsrir-stats.json data/poland-zsrir-log.txt data/poland-zsrir data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
