name: Dehesa Data — Estadísticas por país (DK, NL, AU)
on:
  schedule:
    - cron: '50 14 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update country statistics
        run: python scripts/update-country-stats.py | tee data/country-stats-log.txt
      - name: Commit
        run: |
          git config user.name "Dehesa Index Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/country-stats.json data/country-stats-log.txt
          git diff --cached --quiet || git commit -m "data: estadísticas por país (DK, NL, AU)"
          git pull --rebase origin main
          git push
