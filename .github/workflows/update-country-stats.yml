name: Dehesa Data — Estadísticas por país (DK, NL, AU)
on:
  schedule:
    - cron: '50 14 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update country statistics
        run: python scripts/update-country-stats.py | tee data/country-stats-log.txt
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/country-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/country-stats.json
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: data/country-stats.json data/country-stats-log.txt data/revisions.json
          message: "data: estadísticas por país (DK, NL, AU)"
          user: "Dehesa Index Bot"
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
