# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Switzerland (BFS agricultural accounts and price indices)
on:
  schedule:
    - cron: '45 6 12 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-switzerland-bfs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ch-bfs.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/switzerland-bfs-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/switzerland-bfs-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Suiza (BFS, cuentas e indices de precios agrarios)" data/switzerland-bfs-stats.json data/switzerland-bfs-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
