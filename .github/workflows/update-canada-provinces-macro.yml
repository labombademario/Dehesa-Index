# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada province GDP, population and unemployment (Statistics Canada)
on:
  schedule:
    - cron: '50 7 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-canada-provinces-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-canada-provinces-macro.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/canada-provinces-macro.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/canada-provinces-macro.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "PIB, poblacion y paro por provincia de Canada (Statistics Canada)" data/canada-provinces-macro.json data/canada-provinces-macro-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
