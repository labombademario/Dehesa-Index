# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Austria weekly AMA market prices (cattle, pigs, eggs, poultry) and fertilizer prices (Agrarmarkt Austria)
on:
  schedule:
    - cron: '40 8 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-at-ama
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-at-ama.py
        timeout-minutes: 25
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/austria-ama-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/austria-ama-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Precios semanales de la AMA en Austria (vacuno, porcino, huevos, aves) y precios de abonos" data/austria-ama-stats.json data/austria-ama-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
