# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany monthly rainfall and temperature by Land (DWD regional averages)
on:
  schedule:
    - cron: '45 7 4,15 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-de-climate-laender
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-de-climate-laender.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/de-climate-laender.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/de-climate-laender.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Lluvia y temperatura mensual por Land de Alemania (DWD)" data/de-climate-laender.json data/de-climate-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
