# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Poland farmland prices (GUS, BDL)
on:
  schedule:
    - cron: '10 8 4 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-land-pl
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-land-pl.py
        env:
          BDL_CLIENT_ID: ${{ secrets.BDL_CLIENT_ID }}
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/poland-land/land.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/poland-land/land.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/poland-land)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Precio de la tierra arable de Polonia por voivodía (GUS, BDL)" data/poland-land/land.json data/land-pl-log.txt data/poland-land data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
