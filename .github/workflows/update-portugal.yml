name: Update Portugal (INE)
on:
  schedule:
    - cron: '40 16 * * 2,5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'olive = solo aceite de oliva (rápido); vacío = todo'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo ok
      - run: python3 scripts/update-portugal.py ${{ github.event.inputs.mode }}
        timeout-minutes: 25
      - name: Validar datos (esquema y tests) antes de commit
        run: |
          python3 scripts/validate-data.py --no-report --files data/portugal-stats.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/portugal-stats.json; }
          python3 scripts/detect-revisions.py data/portugal-stats.json || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portugal-stats.json data/portugal-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Portugal (INE)"
          git pull -q --rebase
          git push
