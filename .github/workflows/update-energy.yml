name: Dehesa Data — EIA and EU Oil Bulletin
on:
  schedule:
    - cron: '30 12 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Update EIA diesel
        run: node scripts/update-eia-diesel-us.mjs
      - name: Update EU Oil Bulletin diesel
        run: python scripts/update-ec-diesel-eu.py
      - uses: ./.github/actions/price-engine
      - name: Sync diesel Data Trust card
        run: node scripts/sync-diesel-trust.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js data/diesel-eu-countries.json
          preset: price-engine
          message: "data: refresh diesel energy series"
          user: "Dehesa Index Bot"
