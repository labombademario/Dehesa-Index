name: Dehesa Data — EIA and EU Oil Bulletin
on:
  schedule:
    - cron: '30 12 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Update EIA diesel
        run: node scripts/update-eia-diesel-us.mjs
      - name: Update EU Oil Bulletin diesel
        run: python scripts/update-ec-diesel-eu.py
      - uses: ./.github/actions/price-engine
      - name: Sync diesel Data Trust card
        run: node scripts/sync-diesel-trust.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: refresh diesel energy series"
          user: "Dehesa Index Bot"
