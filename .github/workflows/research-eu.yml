name: research eu
on:
  push:
    branches: ['research/europe-depth']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: sondeo
        continue-on-error: true
        run: |
          python3 research_eu.py 2> err.txt || true
          tail -5 err.txt | sed 's/^/::notice::ERR /'
      - name: commit
        run: |
          git config user.name research && git config user.email r@x
          git add research_out && git commit -m "research eu out" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin research/europe-depth && git push -q && break; sleep 5; done
