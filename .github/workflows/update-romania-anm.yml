# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Romania (ANM open data, monthly temperature and rainfall at farming stations)
on:
  schedule:
    - cron: '20 8 4 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-romania-anm
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ro-anm.py
        timeout-minutes: 15
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/romania-anm-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/romania-anm-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Rumania (ANM, temperatura y lluvia mensual)" data/romania-anm-stats.json data/romania-anm-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
