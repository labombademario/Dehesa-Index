# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Eurostat euro-area members (BG EL FI HR IE LT SK, plus ES DE NL)
on:
  schedule:
    - cron: '10 18 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eurostat-eu
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eurostat-eu.py
        timeout-minutes: 50
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eurostat-eu-stats.json data/eurostat-euw-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eurostat-eu-stats.json data/eurostat-euw-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Eurostat de los estados de la UE (modo reducido)" data/eurostat-eu-stats.json data/eurostat-euw-stats.json data/eurostat-eu-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
