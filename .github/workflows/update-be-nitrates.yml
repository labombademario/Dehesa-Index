# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Flanders nitrate in farmland surface water (VMM MAP network)
on:
  schedule:
    - cron: '50 8 10 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-be-nitrates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-be-nitrates.py
        timeout-minutes: 5
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/be-nitrates.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/be-nitrates.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Nitrato en aguas de zonas agricolas de Flandes (VMM)" data/be-nitrates.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
