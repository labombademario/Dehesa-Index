# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada commodity price indices (Bank of Canada BCPI)
on:
  schedule:
    - cron: '20 15 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ca-boc-bcpi
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ca-boc-bcpi.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/ca-boc-bcpi-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/ca-boc-bcpi-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Indices de precios de materias primas de Canada - agricultura, silvicultura, pesca, energia y metales (Banco de Canada, BCPI)" data/ca-boc-bcpi-stats.json data/ca-boc-bcpi-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
