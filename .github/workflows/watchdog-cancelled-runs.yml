name: Watchdog - relanzar workflows de datos cancelados en cola y reintentar fallos puntuales
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: dehesa-watchdog
  cancel-in-progress: false
jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Relanzar lo cancelado en cola y reintentar una vez lo que fallo en una ejecucion programada
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/rerun-cancelled.py
