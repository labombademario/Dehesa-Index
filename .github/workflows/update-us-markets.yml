# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US market and input data (CFTC Commitments of Traders, USDA AMS grain transportation, EIA diesel, propane and ethanol, USDA AMS/FGIS export inspections, USDA AMS livestock and meat reference prices)
on:
  schedule:
    - cron: '10 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-markets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-us-markets.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-markets/cot.json data/us-markets/transport.json data/us-markets/fuel.json data/us-markets/ethanol.json data/us-markets/inspections.json data/us-markets/lmr.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-markets/cot.json data/us-markets/transport.json data/us-markets/fuel.json data/us-markets/ethanol.json data/us-markets/inspections.json data/us-markets/lmr.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard -- 'data/us-markets/*.json')
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Mercado e insumos de EE. UU. (CFTC, USDA AMS transporte y precios de referencia, FGIS, EIA)" data/us-markets/cot.json data/us-markets/transport.json data/us-markets/fuel.json data/us-markets/ethanol.json data/us-markets/inspections.json data/us-markets/lmr.json data/us-markets/log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
