# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US tariffs (USITC HTS)
on:
  schedule:
    - cron: '20 8 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-tariffs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-us-tariffs.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-tariffs.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-tariffs.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos aranceles EE. UU. (USITC HTS)" data/us-tariffs.json data/us-tariffs-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
