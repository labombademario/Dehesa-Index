# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US tariffs (USITC HTS)
on:
  schedule:
    - cron: '20 8 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-us-tariffs.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests) antes de commit
        if: always()
        run: |
          python3 scripts/validate-data.py --no-report --files data/us-tariffs.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/us-tariffs.json; }
          python3 scripts/detect-revisions.py data/us-tariffs.json || true
      - name: Publicar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-tariffs.json data/us-tariffs-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos aranceles EE. UU. (USITC HTS)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
