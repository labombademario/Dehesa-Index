# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US state GDP, population and unemployment (BEA, Census, BLS)
on:
  schedule:
    - cron: '40 7 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-states-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-states-macro.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-states-macro.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-states-macro.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "PIB, poblacion y paro por estado de EE. UU. (BEA, Census, BLS)" data/us-states-macro.json data/us-states-macro-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
