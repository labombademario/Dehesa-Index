name: update-ers
on:
  schedule:
    - cron: '50 20 * * 1'
  workflow_dispatch:
concurrency:
  group: dehesa-ers
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: ERS
        run: node scripts/update-ers.mjs 2>&1 | tee data/ers-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/ers.json
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/ers.json data/ers-log.txt
          git commit -m "data: ERS (precios de alimentos, costes, renta agraria)" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
