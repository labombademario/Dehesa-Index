name: update-ers
on:
  schedule:
    - cron: '50 20 * * 1'
  workflow_dispatch:
concurrency:
  group: dehesa-ers
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ERS
        run: node scripts/update-ers.mjs 2>&1 | tee data/ers-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/ers.json data/ers-log.txt
          git commit -m "data: ERS (precios de alimentos, costes, renta agraria)" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
