# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Sweden (Jordbruksverket producer prices, A-index and farm stocks)
on:
  schedule:
    - cron: '20 7 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-sweden-sjv
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-se-sjv.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/sweden-sjv-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/sweden-sjv-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Suecia (Jordbruksverket, precios al productor y existencias)" data/sweden-sjv-stats.json data/sweden-sjv-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
