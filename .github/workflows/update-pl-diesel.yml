# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Poland diesel and farm excise refund (EU Weekly Oil Bulletin)
on:
  schedule:
    - cron: '40 12 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-pl-diesel
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-pl-diesel.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/pl-diesel.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/pl-diesel.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Gasoleo y devolucion de akcyza en Polonia (Boletin Petrolero UE)" data/pl-diesel.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
