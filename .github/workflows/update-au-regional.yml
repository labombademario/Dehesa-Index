# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Australia agriculture by local government area and SA4 (ABS data by region)
on:
  schedule:
    - cron: '15 12 14 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-au-regional
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-au-regional-agriculture.py
        timeout-minutes: 18
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/au-regional)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Ganado, cultivos, valor, agua, empresas y empleo agrarios de Australia por municipio y region SA4 (ABS)" data/au-regional-log.txt data/au-regional
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
