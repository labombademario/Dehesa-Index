# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update German river levels and discharge (PEGELONLINE, WSV raw data)
on:
  schedule:
    - cron: '25 5,13,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-de-rivers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-de-rivers.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/de-rivers.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/de-rivers.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Rios alemanes - nivel y caudal (PEGELONLINE)" data/de-rivers.json data/de-rivers-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
