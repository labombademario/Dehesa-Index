# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update UK monthly rainfall and temperature by nation and region (Met Office)
on:
  schedule:
    - cron: '50 9 3,12 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-climate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uk-climate.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-climate.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/uk-climate.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Lluvia y temperatura mensual del Reino Unido por region (Met Office)" data/uk-climate.json data/uk-climate-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
