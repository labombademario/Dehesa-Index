# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update trade by product and partner (UK, CL, CA)
on:
  schedule:
    - cron: '15 11 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-trade-partners
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-trade-partners.py
        timeout-minutes: 35
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-trade-products.json data/cl-trade-products.json data/ca-trade-products.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/uk-trade-products.json data/cl-trade-products.json data/ca-trade-products.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Comercio por producto y socio (HMRC, ODEPA, Statistics Canada)" data/uk-trade-products.json data/cl-trade-products.json data/ca-trade-products.json data/trade-partners-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
