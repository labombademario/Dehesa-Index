name: probe-ch
on:
  push:
    branches: [research/probe-ch]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/_probe_ch.py 2>&1 | tee probe-ch/log.txt || true
          git config user.name "dehesa-bot"; git config user.email "bot@users.noreply.github.com"
          git add probe-ch
          git commit -m "probe ch output" || true
          git push || true
