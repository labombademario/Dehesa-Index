name: PSD commodity names (one-off)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in tree_nuts fruits_vegetables oilseeds dairy livestock grains_pulses sugar coffee cotton; do
            curl -fsSL --retry 3 -m 180 -o /tmp/p.zip "https://apps.fas.usda.gov/psdonline/downloads/psd_${f}_csv.zip" && unzip -oq /tmp/p.zip -d /tmp/p
            echo "== $f"; python3 -c "
import csv,sys,glob
for fp in glob.glob('/tmp/p/psd_${f}.csv'):
    s={}
    for r in csv.reader(open(fp,encoding='utf-8-sig')):
        if r and r[0]!='Commodity_Code': s[r[1]]=s.get(r[1],0)+1
    for k,v in sorted(s.items()): print(' ',k,v)
"
          done
