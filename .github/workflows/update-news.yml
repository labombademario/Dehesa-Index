name: Update Dehesa agricultural news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_news.py"
      - "scripts/news_*.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update news index
        run: python3 scripts/update_news.py

      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        uses: ./.github/actions/validate-files
        with:
          files: data/news.json

      - name: Commit generated news
        run: |
          if git diff --quiet -- data/news.json data/news-status.json data/views/news-index.json data/views/news-feed.json data/views/news-product.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "Dehesa Index News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news-status.json data/views/news-index.json data/views/news-feed.json data/views/news-product.json
          git commit -m "chore: refresh agricultural market news"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          echo '::error::no se pudo publicar tras 6 intentos'; exit 1

      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
