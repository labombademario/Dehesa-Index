name: Update Dehesa agricultural news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update news index
        run: python3 scripts/update_news.py

      - name: Commit generated news
        run: |
          if git diff --quiet -- data/news.json js/news-index.js; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "Dehesa Index News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json js/news-index.js
          git commit -m "chore: refresh agricultural market news"
          git push
