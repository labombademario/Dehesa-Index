# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US cash receipts by commodity and state (USDA ERS Farm Income and Wealth Statistics, public domain)
on:
  schedule:
    - cron: '25 15 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-cash-receipts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-cash-receipts.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-cash-receipts.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-cash-receipts.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Ingresos en efectivo por producto y estado de EE. UU. (USDA ERS)" data/us-cash-receipts.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
