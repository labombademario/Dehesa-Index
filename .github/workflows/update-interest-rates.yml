name: Update interest rates
on:
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-interest-rates.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interest-rates-stats.json data/interest-rates-log.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Tipos de interés oficiales"
          git pull -q --rebase
          git push
