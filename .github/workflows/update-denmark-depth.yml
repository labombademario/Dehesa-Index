# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Denmark crops, livestock, milk and subsidies (Statistics Denmark StatBank)
on:
  schedule:
    - cron: '20 7 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-denmark-depth
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-denmark-depth.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/denmark-depth.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/denmark-depth.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Dinamarca cosecha, ganaderia, leche y subvenciones (Statistics Denmark)" data/denmark-depth.json data/denmark-depth-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
