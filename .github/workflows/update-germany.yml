# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany (BLE, Destatis)
on:
  schedule:
    - cron: '30 15 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-germany
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-germany.py
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/germany-stats.json data/germany-agri.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/germany-stats.json data/germany-agri.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Alemania (BLE, Destatis)" data/germany-stats.json data/germany-agri.json data/germany-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
