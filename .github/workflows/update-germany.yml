name: Update Germany (BLE, Destatis)
on:
  schedule:
    - cron: '30 15 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data/probe
      - run: DE_LABELS=1 python3 scripts/update-germany.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/germany-stats.json data/germany-log.txt data/probe
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Alemania (BLE, Destatis)"
          git pull -q --rebase
          git push
