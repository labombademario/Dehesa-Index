# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada sub-provincial census of agriculture (Statistics Canada)
on:
  schedule:
    - cron: '15 9 5 1,7 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ca-subprov-census
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ca-subprov-census.py
        timeout-minutes: 22
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/ca-sub/census)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Censo agrario 2021 de Canada por region, division y subdivision censal (Statistics Canada)" data/ca-subprov-census-log.txt data/ca-sub/census
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
