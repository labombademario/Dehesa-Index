# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Australia by state (ABS)
on:
  schedule:
    - cron: '35 11 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-au-states
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-au-states.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/au-states.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/au-states.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos de Australia por estado (ABS)" data/au-states.json data/au-states-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
