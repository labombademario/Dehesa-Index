# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US NASS extra products (tree nuts, citrus, berries, vegetables, pulses, honey, wool, goats, tobacco, mushrooms, hemp, turkeys)
on:
  schedule:
    - cron: '20 21 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-nass-extra
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-nass-extra.py
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        timeout-minutes: 30
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-nass-extra-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-nass-extra-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos EEUU NASS (frutos secos, citricos, bayas, hortalizas, legumbres, miel, lana, cabras, tabaco, champinon, canamo, pavo)" data/us-nass-extra-stats.json data/us-nass-extra-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
