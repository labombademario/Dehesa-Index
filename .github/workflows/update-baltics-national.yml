# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Latvia and Estonia (national statistics offices, prices, stocks, crops and milk)
on:
  schedule:
    - cron: '40 7 3,16 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-baltics-national
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-np-baltic.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/baltics-national-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/baltics-national-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Letonia y Estonia (oficinas nacionales de estadistica, precios y existencias)" data/baltics-national-stats.json data/baltics-national-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
