# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada crop insurance (Statistics Canada, tables 32-10-0045 and 32-10-0049)
on:
  schedule:
    - cron: '40 6 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-crop-insurance-ca
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-crop-insurance-ca.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/crop-insurance-ca.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/crop-insurance-ca.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos del seguro de cosechas de Canadá (Statistics Canada)" data/crop-insurance-ca.json data/crop-insurance-ca-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
