name: Dehesa Data — USDA AMS MARS (harina de soja)

on:
  schedule:
    - cron: '30 22 * * 5'
    - cron: '30 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-mars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update MARS soybean meal (US)
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: node scripts/update-mars-us.mjs

      - name: Update AMS nonfat dry milk (US)
        run: node scripts/update-ams-nfdm.mjs

      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js data/snapshots data/latest.json data/prices data/catalog.json data/history.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: update USDA AMS soybean meal (US)"
          user: "dehesa-index-bot"
