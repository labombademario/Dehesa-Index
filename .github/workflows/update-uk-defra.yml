# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update United Kingdom (Defra)
on:
  schedule:
    - cron: '20 9 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-defra
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip install pandas odfpy
      - id: fetch
        run: python3 scripts/update-uk-defra.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/uk-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Reino Unido (Defra, OGL v3.0)" data/uk-stats.json data/uk-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
