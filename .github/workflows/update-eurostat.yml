name: Dehesa Data — Eurostat agricultural indices
on:
  schedule:
    - cron: '30 13 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eurostat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update Eurostat
        run: node scripts/update-eurostat-indices.mjs
      - name: Validate snapshots
        run: node scripts/validate-snapshots.mjs
      - name: Build data index
        run: node scripts/build-data-index.mjs
      - name: Build CSV
        run: node scripts/build-csv.mjs
      - name: Build quality
        run: node scripts/build-data-quality.mjs
      - name: Build Intelligence 2.0
        run: node scripts/build-intelligence.mjs
      - name: Build normalization layer
        run: node scripts/build-normalized-data.mjs
      - name: Build cross-market relationships
        run: node scripts/build-cross-market.mjs
      - name: Build alert signals
        run: node scripts/build-alert-signals.mjs
      - name: Navigation QA
        run: node scripts/qa-navigation.mjs
      - name: Commit generated data
        run: |
          git config user.name "Dehesa Index Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/alerts.json
          git diff --cached --quiet || git commit -m "data: refresh Eurostat agricultural indices"
          git push
