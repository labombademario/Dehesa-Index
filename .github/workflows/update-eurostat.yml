name: Dehesa Data — Eurostat agricultural indices
on:
  schedule:
    - cron: '30 13 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Update Eurostat
        run: node scripts/update-eurostat-indices.mjs
      - uses: ./.github/actions/price-engine
      - name: Navigation QA
        run: node scripts/qa-navigation.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          preset: price-engine
          message: "data: refresh Eurostat agricultural indices"
          user: "Dehesa Index Bot"
