name: Dehesa Data — Eurostat agricultural indices
on:
  schedule:
    - cron: '30 13 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update Eurostat
        run: node scripts/update-eurostat-indices.mjs
      - uses: ./.github/actions/price-engine
      - name: Navigation QA
        run: node scripts/qa-navigation.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: refresh Eurostat agricultural indices"
          user: "Dehesa Index Bot"
