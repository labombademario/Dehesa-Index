name: Dehesa Data — Comercio por país (USDA FAS GATS)

on:
  schedule:
    - cron: '0 15 10 * *'   # el Census publica hacia el día 5-8; se consulta el día 10 y el 20
    - cron: '0 15 20 * *'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-gats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update GATS
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: node scripts/update-gats.mjs 2>&1 | tee /tmp/gats.out
      - name: Commit
        if: always()
        run: |
          cp /tmp/gats.out data/gats-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gats.json data/gats-log.txt
          git diff --cached --quiet || git commit -m "chore: update trade by country (USDA FAS GATS)"
          git pull --rebase origin main
          git push origin HEAD:main
