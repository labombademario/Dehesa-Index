name: Dehesa Data — Comercio por país (USDA FAS GATS)

on:
  schedule:
    - cron: '17 * * * *'   # cada hora: la API limita las peticiones, así que la carga inicial se hace por tramos
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-gats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update GATS
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: node scripts/update-gats.mjs > /tmp/gats.out 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gats.json 2>/dev/null || true
          if ! git diff --cached --quiet; then cp /tmp/gats.out data/gats-log.txt; git add data/gats-log.txt; git commit -m "chore: update trade by country (USDA FAS GATS)"; git pull --rebase origin main; git push origin HEAD:main; else if [ ! -f data/gats.json ]; then cp /tmp/gats.out data/gats-log.txt; git add data/gats-log.txt; git commit -m "chore: GATS log"; git pull --rebase origin main; git push origin HEAD:main; fi; fi
