name: Dehesa Data — Comercio por país (USDA FAS GATS)

on:
  schedule:
    - cron: '17 6 * * *'   # una vez al día: la carga inicial (25 meses) ya está completa; solo pide meses nuevos y revisa los dos últimos cada 25 días
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-gats:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update GATS
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: timeout 52m node scripts/update-gats.mjs > /tmp/gats.out 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gats.json 2>/dev/null || true
          if ! git diff --cached --quiet; then cp /tmp/gats.out data/gats-log.txt; git add data/gats-log.txt; git commit -m "chore: update trade by country (USDA FAS GATS)"; for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done; else if [ ! -f data/gats.json ]; then cp /tmp/gats.out data/gats-log.txt; git add data/gats-log.txt; git commit -m "chore: GATS log"; git pull --rebase origin main; git push origin HEAD:main; fi; fi
