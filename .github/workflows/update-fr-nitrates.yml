# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France groundwater nitrates by department (ADES, Hub'Eau)
on:
  schedule:
    - cron: '15 10 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fr-nitrates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fr-nitrates.py
        timeout-minutes: 40
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/fr-nitrates.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/fr-nitrates.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Nitratos en aguas subterraneas de Francia (ADES)" data/fr-nitrates.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
