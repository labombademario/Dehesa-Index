# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Uruguay (datos abiertos)
on:
  schedule:
    - cron: '40 18 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uruguay
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uruguay.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/uruguay-stats.json data/uruguay-departments.json data/uy-ghg-agri.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/uruguay-stats.json data/uruguay-departments.json data/uy-ghg-agri.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Uruguay (INIA, MGAP, URSEA)" data/uruguay-stats.json data/uruguay-departments.json data/uy-ghg-agri.json data/uruguay-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
