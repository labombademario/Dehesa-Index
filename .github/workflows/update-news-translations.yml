name: Translate Dehesa news headlines

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/translate_news.py"
      - ".github/workflows/update-news-translations.yml"

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  translate-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CTranslate2 and SentencePiece
        run: pip install ctranslate2 sentencepiece pyonmttok

      - name: Restore translation models (Argos Translate, CC BY 4.0)
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dehesa-mt
          key: dehesa-mt-v1-${{ github.run_id }}
          restore-keys: dehesa-mt-v1-

      - name: Translate new headlines
        id: tr
        run: |
          python3 scripts/translate_news.py --limit 150
          echo "new=$(cat ~/.cache/dehesa-mt/.downloads 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Save translation models (only when new ones were downloaded)
        if: always() && steps.tr.outputs.new != '' && steps.tr.outputs.new != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dehesa-mt
          key: dehesa-mt-v1-${{ github.run_id }}

      - name: Commit translations
        run: |
          F="data/views/news-tr-es.json data/views/news-tr-en.json data/views/news-tr-fr.json data/views/news-tr-it.json data/views/news-tr-tried.json"
          if git diff --quiet -- $F; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name "Dehesa Index News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $F
          git commit -m "chore: machine-translate news headlines"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          echo '::error::no se pudo publicar tras 6 intentos'; exit 1
