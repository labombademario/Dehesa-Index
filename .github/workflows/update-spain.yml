name: Update Spain (MAPA)
on:
  schedule:
    - cron: '35 14 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-mapa-spain.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spain-stats.json data/spain-log.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Datos España (MAPA)"
          git pull -q --rebase
          git push
