# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain (MAPA)
on:
  schedule:
    - cron: '35 14 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-spain
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-mapa-spain.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/spain-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos España (MAPA)" data/spain-stats.json data/spain-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
