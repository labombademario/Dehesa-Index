# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Netherlands farm turnover by quarter, glasshouses and flowers, nitrogen and manure, food price chain and other series (CBS StatLine)
on:
  schedule:
    - cron: '50 8 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-nl-cbs-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-nl-cbs-more.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/netherlands-more/index.json data/netherlands-more-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/netherlands-more/index.json data/netherlands-more-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/netherlands-more) data/netherlands-more-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos Países Bajos facturacion trimestral, invernaderos, nitrogeno y estiercol, cadena de precios y otras series (CBS)" data/netherlands-more/index.json data/netherlands-more-stats.json data/netherlands-more-log.txt data/netherlands-more data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
