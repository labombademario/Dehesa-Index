# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France farm census 2020 by commune (Agreste)
on:
  schedule:
    - cron: '50 11 16 1,7 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fr-communes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fr-communes.py
        timeout-minutes: 25
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/fr-communes data/fr-epci)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Censo agrario 2020 de Francia por comuna e intercomunalidad (EPCI) - explotaciones, SAU, ganado, mano de obra, cultivos y orientación técnico-económica (Agreste, GeoClip)" data/fr-communes-log.txt data/fr-communes data/fr-epci
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
