# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada yields by small area data region (Statistics Canada)
on:
  schedule:
    - cron: '45 9 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ca-subprov-yields
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ca-subprov-yields.py
        timeout-minutes: 18
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/ca-sub/yields)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Rendimientos, superficie y produccion por region de Canada (Statistics Canada)" data/ca-subprov-yields-log.txt data/ca-sub/yields
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
