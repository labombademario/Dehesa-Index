name: Probe US gaps (research)
on:
  push:
    branches: ['research/probe-usgaps']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: python3 probe/probe_us.py
      - run: python3 scripts/update-nass-extra.py
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
      - run: python3 scripts/update-us-climate.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/probe-log.txt data/us-nass-extra-stats.json data/us-nass-extra-log.txt data/us-climate-stats.json data/us-climate-log.txt
          git commit -qm "probe log" || exit 0
          git pull -q --rebase origin research/probe-usgaps && git push origin HEAD:research/probe-usgaps
