name: Dehesa Data — EE. UU. panel (lácteos, bioenergía, carne y ganado AMS)
on:
  schedule:
    - cron: '10 20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Construir observaciones para el panel
        run: python scripts/build-us-panel-obs.py
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/snapshots
          preset: price-engine
          message: "data: EE. UU. panel (lácteos, bioenergía, carne y ganado AMS)"
          user: "Dehesa Index Bot"
