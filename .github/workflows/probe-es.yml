name: probe es
on:
  push:
    branches: ['research/probe-es']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: sudo apt-get update -q >/dev/null; sudo apt-get install -y -q poppler-utils >/dev/null
      - name: sondeo
        continue-on-error: true
        run: python3 probe_es.py 2>&1 | tail -20
      - name: commit
        run: |
          git config user.name research && git config user.email r@x
          git add probe_es5 && git commit -m "probe es out" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin research/probe-es && git push -q && break; sleep 5; done
