name: tmp-probe-ab
on:
  push:
    branches: [research/probe-ab-1023]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p probe/out; pip install -q openpyxl pdfplumber; python3 probe/p7.py || true
          git config user.name probe; git config user.email probe@x
          git add -f probe/out; git commit -qm "probe out"; git push
