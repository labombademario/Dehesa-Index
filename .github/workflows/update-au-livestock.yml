# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Australia livestock slaughter and meat production by state (ABS)
on:
  schedule:
    - cron: '50 11 12 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-au-livestock
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-au-livestock.py
        timeout-minutes: 14
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/au-livestock)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Sacrificio de ganado y carne producida de Australia por estado (ABS)" data/au-livestock-log.txt data/au-livestock
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
