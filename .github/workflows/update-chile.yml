# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Chile (ODEPA)
on:
  schedule:
    - cron: '20 18 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-chile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-chile.py
        timeout-minutes: 50
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/chile-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/chile-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Chile (ODEPA)" data/chile-stats.json data/chile-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
