name: probe-usda2
on: workflow_dispatch
concurrency:
  group: probe-usda2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          NK: ${{ secrets.NASS_API_KEY }}
        run: |
          mkdir -p .probe
          node -e "
          const NK=process.env.NK, out=[];
          const N='https://quickstats.nass.usda.gov/api/';
          async function q(label,url,n=500){try{const r=await fetch(url,{signal:AbortSignal.timeout(90000)});const t=await r.text();out.push('== '+label+'\n'+r.status+' '+t.length+' '+t.slice(0,n).replace(/\s+/g,' '));return t}catch(e){out.push('== '+label+' ERR '+e.message)}}
          (async()=>{
            const D='https://usdmdataservices.unl.edu/api/';
            await q('drought state IA lower',D+'StateStatistics/GetDroughtSeverityStatisticsByAreaPercent?aoi=ia&startdate=9/1/2026&enddate=9/30/2026&statisticsType=1',400);
            await q('drought state fips',D+'StateStatistics/GetDroughtSeverityStatisticsByAreaPercent?aoi=19&startdate=9/1/2026&enddate=9/30/2026&statisticsType=1',400);
            await q('drought state json',D+'StateStatistics/GetDroughtSeverityStatisticsByAreaPercent?aoi=IA&startdate=9/1/2026&enddate=9/30/2026&statisticsType=1&format=json',400);
            await q('drought state cat',D+'StateStatistics/GetDroughtSeverityStatisticsByAreaPercent?aoi=IA&startdate=9/1/2026&enddate=9/30/2026&statisticsType=2',400);
            await q('drought all states',D+'StateStatistics/GetDroughtSeverityStatisticsByAreaPercent?aoi=all&startdate=9/22/2026&enddate=9/22/2026&statisticsType=1',600);
            await q('drought conus cat',D+'USStatistics/GetDroughtSeverityStatisticsByAreaPercent?aoi=conus&startdate=9/22/2026&enddate=9/22/2026&statisticsType=2',400);
            const P=(p,extra='')=>N+'get_param_values/?key='+NK+'&param='+p+extra;
            await q('cattle classes',P('class_desc','&commodity_desc=CATTLE&statisticcat_desc=INVENTORY'),1500);
            await q('cattle on feed unit',N+'get_param_values/?key='+NK+'&param=short_desc&commodity_desc=CATTLE&statisticcat_desc=INVENTORY&freq_desc=MONTHLY',1500);
            await q('prices paid index commod',N+'api_GET/?key='+NK+'&statisticcat_desc=INDEX FOR PRICE PAID, 2011&year=2026&format=JSON',1200);
            await q('prices paid short_desc',P('short_desc','&statisticcat_desc=PRICE PAID'),2500);
            await q('fertilizer commodity',P('commodity_desc','&group_desc=EXPENSES'),1500);
            await q('cold storage',P('short_desc','&freq_desc=MONTHLY&commodity_desc=BEEF&statisticcat_desc=STOCKS'),500);
            await q('hogs short_desc',P('short_desc','&commodity_desc=HOGS&freq_desc=QUARTERLY'),1800);
            await q('hogs ex',N+'api_GET/?key='+NK+'&commodity_desc=HOGS&statisticcat_desc=INVENTORY&agg_level_desc=NATIONAL&freq_desc=QUARTERLY&year__GE=2026&format=CSV',900);
            const er=await fetch('https://www.ers.usda.gov/data-products/food-price-outlook/summary-findings').then(r=>r.text()).catch(e=>'');
            out.push('== ERS links FPO\n'+[...new Set((er.match(/href=\"[^\"]+\.(?:csv|xlsx|xls|zip)[^\"]*\"/gi)||[]))].join('\n'));
            const ec=await fetch('https://www.ers.usda.gov/data-products/commodity-costs-and-returns').then(r=>r.text()).catch(e=>'');
            out.push('== ERS links costs\n'+[...new Set((ec.match(/href=\"[^\"]+\.(?:csv|xlsx|xls|zip)[^\"]*\"/gi)||[]))].join('\n'));
            const ef=await fetch('https://www.ers.usda.gov/data-products/farm-income-and-wealth-statistics/data-files-us-and-state-level-farm-income-and-wealth-statistics').then(r=>r.text()).catch(e=>'');
            out.push('== ERS links income\n'+[...new Set((ef.match(/href=\"[^\"]+\.(?:csv|xlsx|xls|zip)[^\"]*\"/gi)||[]))].join('\n'));
            require('fs').writeFileSync('.probe/usda2.txt',out.join('\n'));
          })()"
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A .probe; git commit -m "probe usda2" || true
          git pull --rebase origin main; git push origin HEAD:main
