name: Dehesa Data — Gas natural y petróleo (EIA + Banco Mundial)
on:
  schedule:
    - cron: '15 15 * * 3,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: EIA gas natural, WTI y Brent
        run: node scripts/update-eia-energy-markets.mjs
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Banco Mundial gas natural Europa (TTF)
        id: ttf
        run: python scripts/update-worldbank-gas-eu.py
        continue-on-error: true
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json data/energy-markets-log.txt data/energy-markets-log-eu.txt
          message: "data: gas natural y petróleo"
          user: "Dehesa Index Bot"
      - name: Cierre (rojo si el paso tolerante fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.ttf.outcome }}
