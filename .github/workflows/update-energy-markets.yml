name: Dehesa Data — Gas natural y petróleo (EIA + Banco Mundial)
on:
  schedule:
    - cron: '15 15 * * 3,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: EIA gas natural, WTI y Brent
        run: node scripts/update-eia-energy-markets.mjs
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Banco Mundial gas natural Europa (TTF)
        id: ttf
        run: python scripts/update-worldbank-gas-eu.py
        continue-on-error: true
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/energy-markets-log.txt data/energy-markets-log-eu.txt
          preset: price-engine
          message: "data: gas natural y petróleo"
          user: "Dehesa Index Bot"
      - name: Cierre (rojo si el paso tolerante fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.ttf.outcome }}
