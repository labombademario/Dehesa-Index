# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Argentina (datos abiertos)
on:
  schedule:
    - cron: '10 18 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-argentina
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-argentina.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/argentina-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/argentina-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Argentina (datos abiertos)" data/argentina-stats.json data/argentina-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
