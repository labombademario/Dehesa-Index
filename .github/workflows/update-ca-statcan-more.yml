# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Canada sawmills, price indices, CPI and aquaculture (Statistics Canada)
on:
  schedule:
    - cron: '20 14 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-ca-statcan-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ca-statcan-more.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/ca-statcan-more-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/ca-statcan-more-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Canada - aserraderos, indices de precios industriales y de materias primas, IPC de alimentos y energia y acuicultura (Statistics Canada)" data/ca-statcan-more-stats.json data/ca-statcan-more-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
