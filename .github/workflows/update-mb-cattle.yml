# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Manitoba weekly auction cattle prices (Manitoba Agriculture)
on:
  schedule:
    - cron: '30 22 * * 5'
    - cron: '10 14 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-mb-cattle
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - id: fetch
        run: python3 scripts/update-mb-cattle.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/mb-markets/cattle.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/mb-markets/cattle.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/mb-markets)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos precios semanales de ganado vacuno en las subastas de Manitoba" data/mb-markets/cattle.json data/mb-markets-log.txt data/mb-markets data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
