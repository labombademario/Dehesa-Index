# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Watch Italy CAP changes (MASAF consolidated DM 660087/2022)
on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-cap-it
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-cap-nat.py IT
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/cap/it/watch.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/cap/it/watch.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/cap)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Seguimiento de la PAC de Italia (decreto ministerial coordinado del MASAF)" data/cap/it/watch.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
