# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update coverage gaps with harmonised official data (Eurostat, Destatis)
on:
  schedule:
    - cron: '25 9 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-gapfill
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-gapfill.py
        timeout-minutes: 15
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-gapfill-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eu-gapfill-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos huecos de cobertura (Eurostat, Destatis)" data/eu-gapfill-stats.json data/eu-gapfill-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
