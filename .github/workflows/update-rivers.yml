# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update river levels and discharge (Netherlands, France, Canada, Flanders)
on:
  schedule:
    - cron: '40 5,13,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-rivers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-rivers.py
        timeout-minutes: 40
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/rivers-nl.json data/rivers-fr.json data/rivers-ca.json data/rivers-be.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/rivers-nl.json data/rivers-fr.json data/rivers-ca.json data/rivers-be.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Rios - nivel y caudal (Paises Bajos, Francia, Canada, Flandes)" data/rivers-nl.json data/rivers-fr.json data/rivers-ca.json data/rivers-be.json data/rivers-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
