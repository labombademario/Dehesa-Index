name: probe-usda4
on: workflow_dispatch
concurrency:
  group: probe-usda4
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p .probe /tmp/e; cd /tmp/e
          U=https://www.ers.usda.gov
          O=/home/runner/work/x; O=$GITHUB_WORKSPACE/.probe/usda4.txt
          for f in 6460/changes-in-consumer-price-indexes-2024-through-2027.csv 6468/changes-in-producer-price-indexes-2024-through-2027.csv 4962/corn.csv 4923/cost-of-production-forecasts-for-major-us-field-crops-2026f-2027f.csv 4980/milk.csv 4982/cow-calf.csv; do
            n=$(basename $f); curl -sL -A "Mozilla/5.0" -o $n "$U/media/$f"; echo "== $f $(wc -c < $n) bytes" >> $O; head -c 1800 $n | tr -d '\r' >> $O; echo >> $O
          done
          curl -sL -A "Mozilla/5.0" -o rel.zip "$U/media/29517/september-3-2026-release.zip"; echo "== zip $(wc -c < rel.zip)" >> $O
          unzip -o -q rel.zip -d rel 2>>$O; find rel -type f | head -40 >> $O
          for f in $(find rel -name '*.csv' | head -6); do echo "== $f" >> $O; head -c 1200 "$f" | tr -d '\r' >> $O; echo >> $O; done
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A .probe; git commit -m "probe usda4" || true
          git pull --rebase origin main; git push origin HEAD:main
