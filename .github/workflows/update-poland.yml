# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Poland (GUS, Local Data Bank)
on:
  schedule:
    - cron: '30 18 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-poland
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-poland.py
        timeout-minutes: 90
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/poland-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/poland-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Polonia (GUS BDL)" data/poland-stats.json data/poland-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
