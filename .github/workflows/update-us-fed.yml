# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US exchange rates, dollar indices and market interest rates (Federal Reserve Board H.10 / H.15)
on:
  schedule:
    - cron: '40 7 16 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-fed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-fed.py
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-fed-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-fed-stats.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Divisas, indices del dolar y tipos de mercado de la Reserva Federal (H.10 y H.15)" data/us-fed-stats.json data/us-fed-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
