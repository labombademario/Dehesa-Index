name: probe se
on:
  push:
    branches: ['research/probe-se']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: sondeo
        continue-on-error: true
        run: python3 probe_se.py 2>&1 | tail -20
      - name: commit
        run: |
          git config user.name research && git config user.email r@x
          git add probe_se && git commit -m "probe se out" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin research/probe-se && git push -q && break; sleep 5; done
