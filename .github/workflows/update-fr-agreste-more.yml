# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France farm employment, land use (TERUTI), input price indices by region (IPAMPA) and wine harvest of Agreste
on:
  schedule:
    - cron: '50 9 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fr-agreste-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fr-agreste-more.py
        timeout-minutes: 35
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/france-agreste-more/index.json data/france-agreste-more-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/france-agreste-more/index.json data/france-agreste-more-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/france-agreste-more) data/france-agreste-more-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Empleo agricola, uso del suelo TERUTI, indices IPAMPA por region y vendimia de Francia (Agreste)" data/france-agreste-more/index.json data/france-agreste-more-stats.json data/france-agreste-more-log.txt data/france-agreste-more data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
