# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US county crop insurance (USDA RMA Summary of Business)
on:
  schedule:
    - cron: '30 8 4,19 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-county-insurance
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-county-insurance.py
        timeout-minutes: 22
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/us-county/insurance)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Seguro de cosechas por condado de EE. UU. (USDA RMA)" data/us-county-insurance-log.txt data/us-county/insurance
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
