# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain wine month by month and region (MAPA INFOVI monthly report)
on:
  schedule:
    - cron: '55 8 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-spain-wine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: pip install openpyxl xlrd
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-spain-wine-monthly.py
        timeout-minutes: 18
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-wine/monthly.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/spain-wine/monthly.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/spain-wine)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos vino de España mes a mes y por comunidad (MAPA INFOVI mensual)" data/spain-wine/monthly.json data/spain-wine-monthly-log.txt data/spain-wine data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
