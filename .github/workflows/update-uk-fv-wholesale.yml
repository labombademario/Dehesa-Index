# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update England and Wales wholesale fruit and vegetable prices (Defra)
on:
  schedule:
    - cron: '25 13 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-fv-wholesale
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uk-fv-wholesale.py
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-fv-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/uk-fv-stats.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Precios mayoristas de fruta y hortaliza de Inglaterra y Gales (Defra)" data/uk-fv-stats.json data/uk-fv-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
