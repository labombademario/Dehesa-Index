# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU monthly temperature and rainfall (NASA POWER)
on:
  schedule:
    - cron: '0 10 5,20 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-climate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet numpy shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-climate.py
        timeout-minutes: 24
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-climate.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-climate.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Temperatura y lluvia mensual Europa (NASA POWER)" data/eu-climate.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
