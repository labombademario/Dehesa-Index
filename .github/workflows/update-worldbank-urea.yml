name: Dehesa Data — World Bank urea EU

on:
  schedule:
    - cron: '0 13 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Update World Bank urea reference
        run: python scripts/update-worldbank-urea-eu.py
      - uses: ./.github/actions/price-engine
      - name: Navigation QA
        run: node scripts/qa-navigation.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js
          preset: price-engine
          message: "data: refresh World Bank EU urea reference"
          user: "Dehesa Index Bot"
