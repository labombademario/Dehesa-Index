name: Dehesa Data — World Bank urea EU

on:
  schedule:
    - cron: '0 13 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Update World Bank urea reference
        run: python scripts/update-worldbank-urea-eu.py
      - name: Validate snapshots
        run: node scripts/validate-snapshots.mjs
      - name: Build data index
        run: node scripts/build-data-index.mjs
      - name: Build CSV export
        run: node scripts/build-csv.mjs
      - name: Build data quality report
        run: node scripts/build-data-quality.mjs
      - name: Build Intelligence 2.0
        run: node scripts/build-intelligence.mjs
      - name: Build normalization layer
        run: node scripts/build-normalized-data.mjs
      - name: Build cross-market relationships
        run: node scripts/build-cross-market.mjs && node scripts/build-dehesa-index.mjs
      - name: Build alert signals
        run: node scripts/build-alert-signals.mjs
      - name: Navigation QA
        run: node scripts/qa-navigation.mjs
      - name: Commit generated data
        run: |
          git config user.name "Dehesa Index Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          git diff --cached --quiet || git commit -m "data: refresh World Bank EU urea reference"
          git push
