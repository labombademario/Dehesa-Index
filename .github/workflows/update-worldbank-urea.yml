name: Dehesa Data — World Bank urea EU

on:
  schedule:
    - cron: '0 13 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Update World Bank urea reference
        run: python scripts/update-worldbank-urea-eu.py
      - uses: ./.github/actions/price-engine
      - name: Navigation QA
        run: node scripts/qa-navigation.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            js/data.js data/snapshots data/latest.json data/prices data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: refresh World Bank EU urea reference"
          user: "Dehesa Index Bot"
