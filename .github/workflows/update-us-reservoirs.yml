# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update western US reservoirs (Bureau of Reclamation RISE)
on:
  schedule:
    - cron: '15 14 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-reservoirs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-reservoirs.py
        timeout-minutes: 40
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-reservoirs.json data/us-reservoirs-normals.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-reservoirs.json data/us-reservoirs-normals.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Embalses del oeste de EE. UU. (Reclamation)" data/us-reservoirs.json data/us-reservoirs-normals.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
