# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany farm structure census by district (Regionaldatenbank Deutschland)
on:
  schedule:
    - cron: '40 16 13 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-de-kreise
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-de-kreise.py
        env:
          RDB_USER: ${{ secrets.RDB_USER }}
          RDB_PASSWORD: ${{ secrets.RDB_PASSWORD }}
        timeout-minutes: 18
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/de-kreise)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Censo agrario de Alemania por distrito - uso del suelo, cultivos, ganado, ecologico, tamaño, propiedad y sucesion (Regionaldatenbank)" data/de-kreise-log.txt data/de-kreise
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
