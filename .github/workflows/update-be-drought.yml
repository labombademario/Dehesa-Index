# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Flanders water abstraction bans and drought status (VMM waterinfo)
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-be-drought
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-be-drought.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/be-drought.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/be-drought.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Prohibiciones de captar agua y sequia en Flandes (VMM)" data/be-drought.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
