# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain drought and water scarcity by unit (MITECO monthly report)
on:
  schedule:
    - cron: '10 8 2,9,16,23 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-es-drought-ute
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-es-drought-ute.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/es-drought-ute.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/es-drought-ute.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Sequia y escasez en Espana por unidad territorial (MITECO)" data/es-drought-ute.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
