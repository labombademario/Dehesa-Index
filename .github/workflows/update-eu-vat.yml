# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU VAT rates (TEDB)
on:
  schedule:
    - cron: '10 5 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-vat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eu-vat.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-vat.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-vat.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Tipos de IVA UE (TEDB, Comision Europea)" data/eu-vat.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
