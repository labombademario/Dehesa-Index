# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US state climate (NOAA NCEI nClimDiv)
on:
  schedule:
    - cron: '10 8 12 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-climate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-climate.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-climate-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-climate-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos EEUU clima por estado (NOAA NCEI)" data/us-climate-stats.json data/us-climate-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
