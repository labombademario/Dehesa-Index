name: Probe slugs (temporal)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-slugs.mjs
      - run: |
          git config user.name "dehesa-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f scripts/.probe-output.txt
          git commit -m "probe: resultado" || true
          git pull --rebase -q || true
          git push
