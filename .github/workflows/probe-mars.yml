name: probe-mars
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/.probe-mars.sh
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f scripts/.probe-output.txt
          git commit -m "probe output" || true
          git pull --rebase -q || true
          git push || true
