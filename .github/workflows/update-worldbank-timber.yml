# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update World Bank tropical timber prices (Pink Sheet)
on:
  schedule:
    - cron: '55 7 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-worldbank-timber
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-worldbank-timber.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/worldbank-timber.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/worldbank-timber.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Precios internacionales de la madera tropical (Banco Mundial, Pink Sheet)" data/worldbank-timber.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
