# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France consumer price indices for butter, cheese and olive oil (Eurostat HICP)
on:
  schedule:
    - cron: '50 9 4,18 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-france-hicp
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-france-hicp.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/france-hicp-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/france-hicp-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Índices de precios de consumo de mantequilla, queso y aceite de oliva en Francia (Eurostat, IPCA)" data/france-hicp-stats.json data/france-hicp-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
