name: Probe IT FR census
on:
  workflow_dispatch:
  push:
    branches: [research/probe-kreise-data]
    paths: [scripts/probe-it-fr.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Ejecutar el script de gminas
        run: python3 scripts/probe-it-fr.py
      - name: Guardar el resultado en esta rama (solo pruebas)
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A data
          git add -f data/fr-communes data/fr-communes-log.txt || true
          git commit -m "Datos de prueba: gminas de Polonia" || echo "sin cambios"
          git pull --rebase -q origin research/probe-kreise-data || true
          for i in 1 2 3 4 5 6; do git push origin HEAD:research/probe-kreise-data && break; sleep 20; git pull --rebase -q origin research/probe-kreise-data || true; done
