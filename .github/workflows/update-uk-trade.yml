# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update UK trade (HMRC)
on:
  schedule:
    - cron: '50 17 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-trade
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-uk-trade.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-trade-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/uk-trade-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos comercio exterior Reino Unido (HMRC)" data/uk-trade-stats.json data/uk-trade-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
