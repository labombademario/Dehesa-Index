# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU crop production by country (Eurostat apro_cpsh1, for the Europe producer map)
on:
  schedule:
    - cron: '20 6 14 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-crops-map
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-crops-map.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-crops-map.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eu-crops-map.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Produccion de cultivos por pais de la UE (Eurostat) para el mapa de productores" data/eu-crops-map.json data/eu-crops-map-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
