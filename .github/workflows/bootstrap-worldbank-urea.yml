name: Dehesa Data — one-shot World Bank bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dehesa-worldbank-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Refresh EU urea
        run: python scripts/update-worldbank-urea-eu.py
      - name: Validate and build
        run: |
          node scripts/validate-snapshots.mjs
          node scripts/build-data-index.mjs
          node scripts/build-csv.mjs
          node scripts/qa-navigation.mjs
      - name: Commit data and remove bootstrap
        run: |
          git config user.name "Dehesa Index Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv
          git rm -f .github/workflows/bootstrap-worldbank-urea.yml
          git commit -m "data: bootstrap World Bank EU urea reference"
          git push
