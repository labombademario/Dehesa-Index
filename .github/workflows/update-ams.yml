name: Dehesa Data — USDA AMS Mercados (MARS)

on:
  schedule:
    - cron: '45 23 * * 1-5'
    - cron: '30 13 * * 6'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-ams:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read MARS reports
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: node scripts/update-ams.mjs 2>&1 | tee /tmp/ams.out
      - name: Ofertas diarias de grano (resumen para la ficha)
        run: python3 scripts/build-ams-daily.py
      - name: Fertilizantes de EE. UU. (precios estatales de costes de produccion)
        run: python3 scripts/build-us-fertilizers.py
      - name: Rebuild search index
        run: node scripts/build-search-index.mjs
      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/ams-grain-daily.json data/us-fertilizers.json data/search-index.json
      - name: Publicar (commit una vez; si falla el push se reintenta solo pull/rebase/push, sin volver a descargar ni reconstruir)
        if: always()
        uses: ./.github/actions/publish
        with:
          optional: data/ams data/search-index.json data/ams-grain-daily.json data/us-fertilizers.json
          message: 'data: update USDA AMS markets'
          user: dehesa-index-bot
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
