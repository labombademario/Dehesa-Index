name: Dehesa Data — USDA AMS Mercados (MARS)

on:
  schedule:
    - cron: '45 23 * * 1-5'
    - cron: '30 13 * * 6'
  workflow_dispatch: {}

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-ams:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read MARS reports
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: node scripts/update-ams.mjs 2>&1 | tee /tmp/ams.out
      - name: Rebuild search index
        run: node scripts/build-search-index.mjs
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "dehesa-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ams data/search-index.json
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: update USDA AMS markets"
          git pull --rebase origin main
          git push origin HEAD:main
