# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Finland (Finnish Meteorological Institute, monthly temperature and rainfall at farming stations)
on:
  schedule:
    - cron: '30 8 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-finland-fmi
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fi-fmi.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/finland-fmi-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/finland-fmi-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Finlandia (FMI, temperatura y lluvia mensual)" data/finland-fmi-stats.json data/finland-fmi-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
