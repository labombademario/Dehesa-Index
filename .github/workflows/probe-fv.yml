name: probe-fv
on: workflow_dispatch
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          K: ${{ secrets.MARS_API_KEY }}
        run: |
          mkdir -p .probe
          for id in 2277 2278 2386 2279; do
            curl -s -u "$K:" "https://marsapi.ams.usda.gov/services/v1.2/reports/$id?q=report_begin_date=09/22/2026:09/25/2026&allSections=true" | head -c 3500 > .probe/$id.json
          done
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add .probe; git commit -m "probe fv" || true
          git pull --rebase origin main; git push origin HEAD:main
