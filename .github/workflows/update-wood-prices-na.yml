# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US and Canada timber price indices (BLS PPI, Statistics Canada IPPI)
on:
  schedule:
    - cron: '35 15 18 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-wood-prices-na
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-wood-prices-na.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/wood-prices-na.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/wood-prices-na.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Indices de precios de la madera de EE. UU. (BLS) y Canada (StatCan)" data/wood-prices-na.json data/wood-prices-na-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
