# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France non-road diesel (GNR) and fuel prices (DGEC, carburants)
on:
  schedule:
    - cron: '25 12 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fr-gnr
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fr-gnr.py
        timeout-minutes: 22
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/fr-gnr.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/fr-gnr.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Gazole non routier y carburantes en Francia (DGEC)" data/fr-gnr.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
