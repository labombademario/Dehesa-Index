# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US USDA FSA farm loan interest rates (direct operating, ownership, emergency; public domain)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-fsa-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-fsa-rates.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-fsa-rates-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-fsa-rates-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos EEUU tipos de interes de los prestamos agrarios de la FSA (USDA)" data/us-fsa-rates-stats.json data/us-fsa-rates-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
