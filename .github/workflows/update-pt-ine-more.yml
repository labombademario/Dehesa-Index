# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Portugal fish prices, supply balances, milk collected, gross meat production, food HICP, rural fires, crop area by region, fertilisers and honey (INE)
on:
  schedule:
    - cron: '40 9 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-pt-ine-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-portugal-more.py
        timeout-minutes: 25
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/portugal-more/index.json data/portugal-more-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/portugal-more/index.json data/portugal-more-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/portugal-more) data/portugal-more-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos Portugal pesca, balances, leche, carne, IPCA, incendios, cultivos por región, fertilizantes y miel (INE)" data/portugal-more/index.json data/portugal-more-stats.json data/portugal-more-log.txt data/portugal-more data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
