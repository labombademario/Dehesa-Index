# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU input trade unit values and origins (Eurostat Comext, fertilisers, energy, feed)
on:
  schedule:
    - cron: '30 10 17,19,23 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-input-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-input-prices.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-input-prices.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-input-prices.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Valores unitarios de insumos - UE (Eurostat Comext)" data/eu-input-prices.json data/eu-input-prices-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
