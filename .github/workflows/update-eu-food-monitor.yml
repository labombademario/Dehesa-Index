# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Eurostat food price monitor (prc_fpmt_m, 41 products across the supply chain)
on:
  schedule:
    - cron: '15 10 20 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-food-monitor
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-food-monitor.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-food-monitor-stats.json data/eu-food-monitor/index.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/eu-food-monitor-stats.json data/eu-food-monitor/index.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/eu-food-monitor)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Monitor de precios de alimentos de Eurostat - 41 productos a lo largo de la cadena (precio agrario, produccion, importacion y consumo)" data/eu-food-monitor-stats.json data/eu-food-monitor/index.json data/eu-food-monitor-log.txt data/eu-food-monitor data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
