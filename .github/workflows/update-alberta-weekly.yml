name: Dehesa Data — Alberta semanal (Weekly Market Review)
on:
  schedule:
    - cron: '30 21 * * 5,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pdftotext
        run: sudo apt-get update -q >/dev/null && sudo apt-get install -y poppler-utils >/dev/null
      - name: Update Alberta weekly market reviews
        run: python scripts/update-alberta-weekly.py
      - uses: ./.github/actions/price-engine
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/alberta-weekly.json data/alberta-weekly-report.json
          preset: price-engine
          message: "data: Alberta semanal"
          user: "Dehesa Index Bot"
          optional: data/alberta-weekly-debug.txt
