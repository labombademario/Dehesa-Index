name: Probe Eurostat EU (research)
on:
  push:
    branches: ['research/probe-eurostat-eu']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: python3 probe/probe_eurostat.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/probe-log.txt
          git commit -qm "probe log [skip ci]" || exit 0
          git pull -q --rebase origin research/probe-eurostat-eu && git push origin HEAD:research/probe-eurostat-eu
