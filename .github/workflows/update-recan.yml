name: Update RECAN (MAPA)
on:
  schedule:
    - cron: '50 14 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-recan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recan.json data/recan-log.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Datos RECAN (MAPA)"
          git pull -q --rebase
          git push
