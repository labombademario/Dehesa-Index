name: Update RECAN (MAPA)
on:
  schedule:
    - cron: '50 14 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: bash scripts/annotate-failure.sh python3 scripts/update-recan.py
      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/recan.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos RECAN (MAPA)" data/recan.json data/recan-log.txt
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
