# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Italy agriculture statistics (ISTAT - slaughter, farm prices, herds, fertilisers, pesticides)
on:
  schedule:
    - cron: '30 7 6 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-it-istat
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-it-istat.py
        timeout-minutes: 35
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/italy-istat/slaughter.json data/italy-istat/prices.json data/italy-istat/herds.json data/italy-istat/fertilisers.json data/italy-istat/pesticides.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/italy-istat/slaughter.json data/italy-istat/prices.json data/italy-istat/herds.json data/italy-istat/fertilisers.json data/italy-istat/pesticides.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/italy-istat/slaughter.json data/italy-istat/prices.json data/italy-istat/herds.json data/italy-istat/fertilisers.json data/italy-istat/pesticides.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Estadísticas agrarias de Italia (ISTAT)" data/italy-istat/slaughter.json data/italy-istat/prices.json data/italy-istat/herds.json data/italy-istat/fertilisers.json data/italy-istat/pesticides.json data/italy-istat-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
