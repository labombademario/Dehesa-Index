name: Dehesa UX — Navigation QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Navigation and deep-link QA
        run: node scripts/qa-navigation.mjs
