name: Debug run (temporal, investigación)

# Ejecuta un comando en el runner y comitea su salida a scripts/.probe-output.txt
# para poder leerla sin acceso a los logs de Actions. Temporal.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Comando bash a ejecutar'
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Ejecutar
        env:
          CMD: ${{ github.event.inputs.cmd }}
        run: |
          { echo "CMD: $CMD"; bash -c "$CMD" 2>&1 | tail -c 6000; echo "EXIT: ${PIPESTATUS[0]}"; } > scripts/.probe-output.txt || true
      - name: Guardar salida
        run: |
          git config user.name "dehesa-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f scripts/.probe-output.txt
          git commit -m "debug output" || true
          git pull --rebase -q || true
          git push
