name: Probe PT NUTS (temporal)
on:
  push:
    branches: [research/pt-nuts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Listar codigos y anios de Portugal en Eurostat
        run: |
          python3 - <<'PY'
          import json, urllib.request
          B = "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/"
          for ds, q in (("nama_10r_3gdp", "unit=MIO_EUR"), ("demo_r_pjanaggr3", "sex=T&age=TOTAL&unit=NR"), ("demo_r_d3avg", "unit=NR")):
              try:
                  j = json.load(urllib.request.urlopen(B + ds + "?format=JSON&lang=EN&" + q + "&sinceTimePeriod=2018", timeout=170))
              except Exception as e:
                  print("::notice::" + ds + " ERROR " + str(e)[:200]); continue
              gi = j["dimension"]["geo"]["category"]["index"]; ti = j["dimension"]["time"]["category"]["index"]
              lab = j["dimension"]["geo"]["category"].get("label", {})
              nt = len(ti); out = []
              for g, gx in gi.items():
                  if not g.startswith("PT"): continue
                  yrs = [t for t, tx in ti.items() if str(gx * nt + tx) in j["value"]]
                  out.append(g + " " + str(lab.get(g, ""))[:28] + " " + (yrs[0] + ".." + yrs[-1] if yrs else "sin datos"))
              print("::notice::" + ds + " %0A" + "%0A".join(out))
          PY
