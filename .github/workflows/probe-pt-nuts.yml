name: Probe NASS (temporal)
on:
  push:
    branches: [research/pt-nuts]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Cultivos y estados con informe semanal de NASS (2026)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, collections
          K = os.environ.get("NASS_API_KEY", "")
          if not K: print("::notice::sin clave"); raise SystemExit
          def q(**p):
              u = "https://quickstats.nass.usda.gov/api/api_GET/?" + urllib.parse.urlencode(dict(key=K, format="JSON", source_desc="SURVEY", freq_desc="WEEKLY", year="2026", **p))
              try: return json.load(urllib.request.urlopen(u, timeout=120)).get("data", [])
              except Exception as e: print("::notice::ERR " + str(e)[:120]); return []
          out = collections.defaultdict(set); lvl = collections.defaultdict(set)
          for sec in ("CROPS",):
              rows = q(sector_desc=sec, agg_level_desc="STATE", statisticcat_desc="CONDITION")
              rows += q(sector_desc=sec, agg_level_desc="STATE", statisticcat_desc="PROGRESS")
              for r in rows: out[r["commodity_desc"] + "|" + r["statisticcat_desc"]].add(r["state_alpha"])
          lines = [k + " " + str(len(v)) for k, v in sorted(out.items())]
          print("::notice::ESTADOS por cultivo (NASS, estado, 2026) %0A" + "%0A".join(lines))
          rows = q(agg_level_desc="NATIONAL", statisticcat_desc="CONDITION") + q(agg_level_desc="NATIONAL", statisticcat_desc="PROGRESS")
          nat = sorted({r["commodity_desc"] for r in rows})
          print("::notice::NACIONAL commodities " + ", ".join(nat))
          PY
