# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Andalusia weekly farm prices (Junta de Andalucia, Observatorio de Precios y Mercados)
on:
  schedule:
    - cron: '15 9 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-es-andalucia-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-es-andalucia-prices.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-prices/andalucia.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/spain-prices/andalucia.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        run: python3 scripts/validate-data.py --no-report --files data/spain-prices/andalucia.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Precios agrarios semanales de Andalucía (Observatorio de Precios y Mercados de la Junta de Andalucía)" data/spain-prices/andalucia.json data/spain-andalucia-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
