name: probe-fas
on: workflow_dispatch
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          K: ${{ secrets.FAS_API_KEY }}
        run: |
          mkdir -p .probe
          git rm -q --cached .probe/* 2>/dev/null; rm -f .probe/*
          node -e "
          const K=process.env.K,B='https://api.fas.usda.gov/api/gats';
          const out=[];
          async function g(p,n=500){try{const r=await fetch(B+p,{headers:{'X-Api-Key':K}});const t=await r.text();out.push('== '+p+'\n'+r.status+' '+t.length+' '+t.slice(0,n).replace(/\s+/g,' '));}catch(e){out.push('== '+p+' ERR '+e.message)}}
          (async()=>{
            const cm=await (await fetch(B+'/commodities',{headers:{'X-Api-Key':K}})).json();
            const w=cm.filter(x=>/^10019[09]|^10059|^12019|^23040/.test(x.hS10Code.trim())).slice(0,6);
            out.push(JSON.stringify(w));
            const h=w[0].hS10Code.trim(), h2=w[0].hS10Code;
            for (const y of [2025,2026]) for (const m of [3,6,8]) {
              await g('/censusExports/partnerCode/CH/year/'+y+'/month/'+m+'/HS10Code/'+h,300);
            }
            await g('/censusExports/partnerCode/CH/year/2025/month/6/HS10Code/'+encodeURIComponent(h2),300);
            await g('/censusExports/partnerCode/CH/year/2025/month/6',300);
            await g('/censusExports/partnerCode/ALL/year/2025/month/6/HS10Code/'+h,300);
            await g('/censusExports/partnerCode/0/year/2025/month/6/HS10Code/'+h,300);
            await g('/censusExports/reporterCode/US/partnerCode/CH/year/2025/month/6/HS10Code/'+h,300);
            await g('/censusExports/partnerCode/CH/year/2025/month/6/hs10/'+h,300);
            await g('/UNTradeExports/reporterCode/US/partnerCode/CH/year/2024/month/12/HS6Code/100199',300);
            await g('/UNTradeExports/reporterCode/US/partnerCode/CH/year/2024/HS6Code/100199',300);
            await g('/UNTradeExports/reporterCode/US/partnerCode/CH/year/2024/month/12',300);
            await g('/UNTradeExports/partnerCode/CH/year/2024/month/12/HS6Code/100199',300);
            await g('/UNTradeExports/reporterCode/SP/partnerCode/CH/year/2024/month/12/HS6Code/100199',300);
            await g('/censusImports/partnerCode/CH/year/2025/month/6/HS10Code/'+h,300);
            await g('/customsDistrictExports/customsDistrictId/1/year/2025/month/6',300);
            require('fs').writeFileSync('.probe/gats.txt',out.join('\n'));
          })()"
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A .probe; git commit -m "probe gats" || true
          git pull --rebase origin main; git push origin HEAD:main
