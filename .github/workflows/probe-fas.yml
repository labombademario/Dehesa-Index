name: probe-fas
on: workflow_dispatch
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          K: ${{ secrets.FAS_API_KEY }}
        run: |
          mkdir -p .probe
          if [ -z "$K" ]; then echo "FALTA FAS_API_KEY" > .probe/fas.txt; else
          t() { echo "=== $1"; curl -sL -m 90 -H "X-Api-Key: $K" -o /tmp/o -w "%{http_code} %{content_type} %{size_download}\n" "$1"; head -c "${2:-700}" /tmp/o | tr '\n' ' '; echo; }
          {
          B=https://api.fas.usda.gov/api
          curl -s -H "X-Api-Key: $K" $B/esr/commodities -o .probe/esr_commodities.json
          curl -s -H "X-Api-Key: $K" $B/esr/countries -o .probe/esr_countries.json
          curl -s -H "X-Api-Key: $K" $B/gats/countries -o .probe/gats_countries.json
          curl -s -H "X-Api-Key: $K" $B/gats/regions -o .probe/gats_regions.json
          curl -s -H "X-Api-Key: $K" $B/gats/HS6Commodities -o .probe/gats_hs6.json
          t "https://api.fas.usda.gov/swagger/docs/v1" 300
          t "https://api.fas.usda.gov/swagger/ui/index" 300
          t "$B/gats/censusExports/partnerCode/-1/year/2025/month/6" 500
          t "$B/gats/censusExports/partnerCode/5700/year/2025/month/6" 500
          t "$B/gats/censusExports/partnerCode/-1/year/2025/month/6/HS10Code/1001990000" 500
          t "$B/gats/censusExports/reporterCode/US/partnerCode/-1/year/2025/month/6" 500
          t "$B/gats/censusExports/partnerCode/5700/year/2025/month/6/HS10Code/1005902030" 500
          t "$B/gats/censusImports/partnerCode/5700/year/2025/month/6" 500
          t "$B/gats/UNTradeExports/reporterCode/5700/partnerCode/0000/year/2024/month/12" 500
          t "$B/gats/UNTradeExports/reporterCode/US/partnerCode/-1/year/2024/month/12/HS6Code/100199" 500
          t "$B/gats/UNTradeExports/reporterCode/-1/partnerCode/-1/year/2024/month/12/HS6Code/100199" 500
          t "$B/gats/customsDistricts" 300
          t "$B/gats/censusReleaseDates" 300
          t "$B/gats/UNReleaseDates" 300
          t "$B/gats/dataReleaseDates" 300
          } > .probe/fas.txt 2>&1; fi
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add .probe; git commit -m "probe fas" || true
          git pull --rebase origin main; git push origin HEAD:main
