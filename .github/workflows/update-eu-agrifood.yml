name: Dehesa Data — EU Agri-food Data Portal

# Precios semanales de la UE desde el Agri-food Data Portal de la Comisión
# Europea (API pública, sin clave). Ver scripts/update-eu-agrifood.mjs.
# Productos activos: cerdo, vaca, cordero, pollo, huevos, azúcar, aceite de oliva, arroz,
# maíz y trigo (mercado de Zaragoza), fósforo y potasio agregados (NO COMPARABLES) y
# leche cruda (ver PRODUCTS en el script para la serie exacta de cada uno).

on:
  schedule:
    - cron: '0 14 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update EU Agri-food prices
        run: node scripts/update-eu-agrifood.mjs cerdo vaca cordero pollo huevos azucar oliva arroz maiz trigo cebada avena colza centeno mantequilla leche_polvo dap potasa leche harina_soja
      - uses: ./.github/actions/price-engine
      - name: Site QA
        run: node scripts/qa-site.mjs
      - name: Publicar
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/eu-agrifood-log.txt js/data.js data/snapshots data/latest.json data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/alerts.json
          message: "data: refresh EU Agri-food prices"
          user: "dehesa-index-bot"
