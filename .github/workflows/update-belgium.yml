# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Belgium (Statbel)
on:
  schedule:
    - cron: '45 15 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-belgium
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl xlrd
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-belgium.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/belgium-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/belgium-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Bélgica (Statbel)" data/belgium-stats.json data/belgium-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
