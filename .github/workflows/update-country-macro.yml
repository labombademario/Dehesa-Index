# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update country macro indicators
on:
  schedule:
    - cron: '15 7 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-country-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-country-macro.py
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/country-macro.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/country-macro.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Indicadores macro por país" data/country-macro.json data/country-macro-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
