name: Probe psd
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          out=scripts/.probe-output.txt; : > $out
          for u in psd_alldata_csv.zip psd_grains_pulses_csv.zip psd_oilseeds_csv.zip psd_livestock_csv.zip psd_dairy_csv.zip psd_sugar_csv.zip; do
            code=$(curl -sL -m 120 -o /tmp/$u -w "%{http_code} %{size_download} %{content_type}" "https://apps.fas.usda.gov/psdonline/downloads/$u" || echo fail)
            echo "$u -> $code" >> $out
          done
          cd /tmp
          for u in psd_grains_pulses_csv.zip psd_oilseeds_csv.zip psd_livestock_csv.zip psd_dairy_csv.zip; do
            if unzip -o -q $u -d /tmp/psd 2>>/dev/null; then echo "unzipped $u" >> $GITHUB_WORKSPACE/$out; fi
          done
          ls -la /tmp/psd >> $GITHUB_WORKSPACE/$out 2>&1
          for f in /tmp/psd/*.csv; do echo "== $f" >> $GITHUB_WORKSPACE/$out; head -3 "$f" >> $GITHUB_WORKSPACE/$out; wc -l "$f" >> $GITHUB_WORKSPACE/$out; done
          f=$(ls /tmp/psd/*grains* 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            echo "== wheat US rows sample" >> $GITHUB_WORKSPACE/$out
            grep -i '"\?Wheat"\?,' "$f" | grep -i "United States" | tail -25 >> $GITHUB_WORKSPACE/$out
            echo "== attributes wheat" >> $GITHUB_WORKSPACE/$out
            grep -i "^[0-9]*,\"\?Wheat" "$f" | awk -F, '{print $0}' | head -0
          fi
          cd $GITHUB_WORKSPACE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.probe-output.txt
          git commit -m "chore: psd probe output" || true
          git pull --rebase origin main
          git push
