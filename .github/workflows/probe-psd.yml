name: Probe psd
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          mkdir -p /tmp/psd
          for u in psd_grains_pulses_csv.zip psd_oilseeds_csv.zip psd_livestock_csv.zip psd_dairy_csv.zip psd_sugar_csv.zip; do curl -sL -m 120 -o /tmp/$u "https://apps.fas.usda.gov/psdonline/downloads/$u"; unzip -o -q /tmp/$u -d /tmp/psd; done
          ls /tmp/psd
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/probe-psd.mjs || echo failed > scripts/.probe-output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.probe-output.txt
          git commit -m "chore: psd probe output" || true
          git pull --rebase origin main
          git push
