# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US crop acreage from the Cropland Data Layer (USDA NASS, satellite estimate)
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-nass-cdl
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-nass-cdl.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-nass-cdl-stats.json data/us-nass-cdl-cache.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-nass-cdl-stats.json data/us-nass-cdl-cache.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Superficie de cultivos de EE. UU. por estado segun el Cropland Data Layer (estimacion por satelite, USDA NASS)" data/us-nass-cdl-stats.json data/us-nass-cdl-cache.json data/us-nass-cdl-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
