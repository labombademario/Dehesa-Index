# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US livestock and meat domestic data (USDA ERS machine-readable files)
on:
  schedule:
    - cron: '50 14 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-ers-livestock
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-ers-livestock.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-ers-livestock-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-ers-livestock-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Carne y ganado de EE. UU. - oferta, pesos, precios y cebadero (USDA ERS)" data/us-ers-livestock-stats.json data/us-ers-livestock-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
