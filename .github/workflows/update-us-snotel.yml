# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US western snowpack (USDA NRCS SNOTEL, snow water equivalent by state)
on:
  schedule:
    - cron: '30 8 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-snotel
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-us-snotel.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-snotel-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-snotel-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos EEUU nieve del Oeste por estado (SNOTEL, USDA NRCS)" data/us-snotel-stats.json data/us-snotel-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
