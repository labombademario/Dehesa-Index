# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Spain annual oilseed balance sheets (MAPA)
on:
  schedule:
    - cron: '40 7 * * 4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-spain-oilseeds
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/trust-fnmt.sh
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-spain-oilseeds.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/spain-oilseeds-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/spain-oilseeds-stats.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Balances anuales de oleaginosas en España (MAPA)" data/spain-oilseeds-stats.json data/spain-oilseeds-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
