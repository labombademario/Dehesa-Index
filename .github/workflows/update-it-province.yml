# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Italy farm census 2020 by province (ISTAT)
on:
  schedule:
    - cron: '20 11 15 1,7 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-it-province
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-it-province.py
        timeout-minutes: 110
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/it-province)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Censo agrario 2020 de Italia por provincia - explotaciones, superficie, cultivos, ganado y mano de obra (ISTAT)" data/it-province-log.txt data/it-province
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
