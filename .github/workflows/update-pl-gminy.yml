# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Poland farm census 2020 by municipality - gminy (GUS, BDL)
on:
  schedule:
    - cron: '40 10 14 1,7 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-pl-gminy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-pl-gminy.py
        env:
          BDL_CLIENT_ID: ${{ secrets.BDL_CLIENT_ID }}
        timeout-minutes: 140
        continue-on-error: true
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/pl-gminy)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Censo agrario 2020 de Polonia por gmina - explotaciones, superficie, uso del suelo, ganado, cultivos y mano de obra (GUS, BDL)" data/pl-gminy-log.txt data/pl-gminy
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
