# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update USDA ERS season-average price forecast model (not an official USDA forecast)
on:
  schedule:
    - cron: '35 15 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-sap
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-sap.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-markets/sap-forecasts.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-markets/sap-forecasts.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Prevision de precio medio de campana de ERS - modelo, no oficial (USDA ERS)" data/us-markets/sap-forecasts.json data/us-sap-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
