name: tmp-probe-fert
on:
  push:
    branches: [research/probe-fert]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: |
          node scripts/update-eu-region-climate.mjs > probe/clim.log 2>&1 || true
          python3 scripts/validate-data.py --no-report --files data/eu-region-climate.json >> probe/clim.log 2>&1 || true
          git config user.name probe; git config user.email probe@x
          git add -f probe/clim.log data/eu-region-climate.json; git commit -qm "probe clim out" || true; git push || true
