name: tmp-probe-fert
on:
  push:
    branches: [research/probe-fert]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python3 probe/fert_probe.py > probe/fert_probe.log 2>&1 || true
          git config user.name probe; git config user.email probe@x
          git add -f probe/fert_probe.log; git commit -qm "probe fert out" || true; git push || true
