# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU cereal balance (European Commission, DG AGRI)
on:
  schedule:
    - cron: '20 9 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-balances
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-balances.py
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/supply-balances/eu.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/supply-balances/eu.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Balance de cereales de la UE (Comisión Europea)" data/supply-balances/eu.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
