# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update roundwood removals (Eurostat for_remov)
on:
  schedule:
    - cron: '20 7 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-wood-removals
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-wood-removals.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/wood-removals.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/wood-removals.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Cortas de madera en rollo (Eurostat)" data/wood-removals.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
