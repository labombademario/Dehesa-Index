name: Probe EU catalog (investigación, no producción)

# Un solo uso: lista qué publica cada endpoint del Agri-food Data Portal.
# Escribe scripts/.probe-catalog.txt. Se borrará al terminar la investigación.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-eu-catalog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sondear el catálogo
        run: node scripts/probe-eu-catalog.mjs
      - name: Commit del resultado
        run: |
          git config user.name "dehesa-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/.probe-catalog.txt
          git commit -m "Probe: catálogo del portal UE" || echo "Sin cambios"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
