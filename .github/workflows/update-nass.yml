name: update-nass
on:
  schedule:
    - cron: '20 20 * * 1'
  workflow_dispatch:
concurrency:
  group: dehesa-nass
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  nass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ganadería y lácteo
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs livestock 2>&1 | tee data/nass-livestock-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Precios pagados
        if: always()
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs prices 2>&1 | tee data/nass-prices-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Rendimientos y superficie
        if: always()
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs crops 2>&1 | tee data/nass-crops-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/nass-*.json data/nass-*-log.txt
          git commit -m "data: NASS ganadería, lácteo y precios pagados" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
