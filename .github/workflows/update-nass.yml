name: update-nass
on:
  schedule:
    - cron: '20 20 * * 1'
  workflow_dispatch:
concurrency:
  group: dehesa-nass
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  nass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Ganadería y lácteo
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs livestock 2>&1 | tee data/nass-livestock-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Precios pagados
        if: always()
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs prices 2>&1 | tee data/nass-prices-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Rendimientos y superficie
        if: always()
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs crops 2>&1 | tee data/nass-crops-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Precios e índices recibidos
        if: always()
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: node scripts/update-nass.mjs received 2>&1 | tee data/nass-received-log.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Validar contrato de datos (lo invalido se descarta y la ejecucion queda en rojo)
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/nass-livestock.json data/nass-prices.json data/nass-crops.json data/nass-received.json
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          bash scripts/publish-data.sh "data: NASS ganadería, lácteo y precios pagados" data/nass-*.json data/nass-*-log.txt
      - name: Cierre (rojo si hubo datos invalidos)
        if: always()
        uses: ./.github/actions/finish
