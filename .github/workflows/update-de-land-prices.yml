# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany farmland sale prices by Regierungsbezirk (Destatis 61521-0020)
on:
  schedule:
    - cron: '35 16 9 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-de-land-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-de-land-prices.py
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/de-land-prices.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/de-land-prices.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Precio de la tierra agrícola por Regierungsbezirk de Alemania (Destatis)" data/de-land-prices.json data/de-land-prices-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
