# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU timber prices (Eurostat wood industry producer prices, Swedish Forest Agency roundwood prices)
on:
  schedule:
    - cron: '40 7 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-wood-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-wood-prices.py
        timeout-minutes: 8
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-wood-prices.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-wood-prices.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Precios de la madera en la UE (Eurostat, Skogsstyrelsen)" data/eu-wood-prices.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
