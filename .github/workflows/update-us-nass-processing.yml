# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US oilseed crushing, fats and oils and grain crushings (USDA NASS monthly reports)
on:
  schedule:
    - cron: '40 16 1-8,20 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-nass-processing
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-nass-processing.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-nass-processing-stats.json data/us-nass-processing-ledger.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-nass-processing-stats.json data/us-nass-processing-ledger.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Transformacion de oleaginosas y cereales en EE. UU. - trituracion, aceites, grasas y coproductos (USDA NASS)" data/us-nass-processing-stats.json data/us-nass-processing-ledger.json data/us-nass-processing-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
