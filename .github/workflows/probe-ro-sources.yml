name: Probe Romania sources (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-probe-ro
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Sondear INS, MADR y data.gov.ro
        run: bash scripts/probe-ro-sources.sh
      - name: Publicar resultado
        run: bash scripts/publish-data.sh "Sondeo de fuentes de Rumania desde Actions (INS, MADR, data.gov.ro)" docs/probes/ro-sources.md
