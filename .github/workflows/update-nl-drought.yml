# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Netherlands drought by COROP region (EDO) and KNMI precipitation deficit
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-nl-drought
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet numpy netCDF4 shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-nl-drought.py
        timeout-minutes: 35
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/nl-drought.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/nl-drought.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Sequia por region y deficit de precipitacion en Paises Bajos (EDO, KNMI)" data/nl-drought.json data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
