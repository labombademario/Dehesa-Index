# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU consumer price index for fish and seafood by member state (Eurostat HICP)
on:
  schedule:
    - cron: '20 14 19 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-fish-hicp
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-fish-hicp.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-fish-hicp.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-fish-hicp.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "IPC del pescado - UE (Eurostat HICP)" data/eu-fish-hicp.json data/eu-fish-hicp-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
