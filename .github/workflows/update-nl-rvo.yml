# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Netherlands pig and cattle prices and pig slaughter (RVO)
on:
  schedule:
    - cron: '40 8 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-nl-rvo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: python3 scripts/update-nl-rvo.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/netherlands-markets.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/netherlands-markets.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Países Bajos precios de cerdo y vacuno y sacrificios (RVO)" data/netherlands-markets.json data/netherlands-markets-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
