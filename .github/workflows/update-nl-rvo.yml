# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Netherlands pig and cattle prices and pig slaughter (RVO)
on:
  schedule:
    - cron: '40 8 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: python3 scripts/update-nl-rvo.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/netherlands-markets.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/netherlands-markets.json
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/netherlands-markets.json data/netherlands-markets-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Países Bajos precios de cerdo y vacuno y sacrificios (RVO)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo '::error::no se pudo publicar tras 3 intentos'; exit 1
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
