# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU sulphur import unit value (Eurostat Comext, CN 2503)
on:
  schedule:
    - cron: '10 10 17,19,23 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-sulphur
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-eu-sulphur.py
        timeout-minutes: 10
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-sulphur.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-sulphur.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Azufre - valor unitario de importacion UE (Eurostat Comext)" data/eu-sulphur.json data/eu-sulphur-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
