# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update EU trade (Eurostat Comext)
on:
  schedule:
    - cron: '40 9 16,18,22 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-eu-trade
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-eu-trade.py
        timeout-minutes: 70
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/eu-trade-stats.json data/eu-trade-products.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/eu-trade-stats.json data/eu-trade-products.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Datos comercio exterior UE (Eurostat Comext)" data/eu-trade-stats.json data/eu-trade-products.json data/eu-trade-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
