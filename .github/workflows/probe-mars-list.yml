name: probe-mars-list
on: workflow_dispatch
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List
        env:
          K: ${{ secrets.MARS_API_KEY }}
        run: |
          mkdir -p .probe
          curl -s -u "$K:" "https://marsapi.ams.usda.gov/services/v1.2/reports" -o .probe/list.json || true
          node -e "
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('.probe/list.json','utf8'));
          const a=Array.isArray(j)?j:(j.results||[]);
          const out=a.map(r=>[r.slug_id,r.slug_name,r.report_title,r.market_types&&r.market_types.join('|'),r.commodities&&[].concat(r.commodities).join('|'),r.published_date,r.markets&&[].concat(r.markets).join('|')].join('\t'));
          fs.writeFileSync('.probe/list.tsv',out.join('\n'));console.log(a.length, Object.keys(a[0]||{}))"
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add .probe; git commit -m "probe: MARS list" || true
          git pull --rebase origin main; git push origin HEAD:main
