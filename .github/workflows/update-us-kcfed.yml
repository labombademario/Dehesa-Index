# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US Kansas City Fed Agricultural Credit Survey (interest rates, farmland values)
on:
  schedule:
    - cron: '20 9 15 2,5,8,11 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-us-kcfed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: python3 scripts/update-kc-fed-ag-credit.py
        timeout-minutes: 8
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/us-kcfed-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/us-kcfed-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos EEUU credito agrario Fed de Kansas City (tipos de interes, valor de la tierra)" data/us-kcfed-stats.json data/us-kcfed-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
