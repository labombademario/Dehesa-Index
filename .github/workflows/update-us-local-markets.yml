# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US local cattle and hay prices (USDA AMS MARS)
on:
  schedule:
    - cron: '20 15 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Dias de historico a pedir por informe (0 = ventana normal de 21 dias; la primera carga de cada informe pide 420)'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: python3 scripts/update-us-local-markets.py --backfill-days ${{ github.event.inputs.backfill_days || 0 }}
        env:
          USDA_MMN_API_KEY: ${{ secrets.USDA_MMN_API_KEY }}
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        timeout-minutes: 30
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-local/status.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-local/status.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/us-local)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-local/status.json data/us-local data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos precios locales de ganado y heno EE. UU. (USDA AMS MARS)"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase --autostash && git push && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          echo '::error::no se pudo publicar tras 6 intentos'; exit 1
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
