# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Sweden (Statistics Sweden SCB, consumer and producer price indices and fertiliser sales)
on:
  schedule:
    - cron: '50 7 5,20 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-sweden-scb
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-se-scb.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/sweden-scb-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/sweden-scb-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Suecia (SCB, IPC, precios de productor y fertilizantes)" data/sweden-scb-stats.json data/sweden-scb-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
