# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Croatia farms, ARKOD land and vineyards by county (APPRRR open data)
on:
  schedule:
    - cron: '15 10 14 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-hr-apprrr
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install --quiet openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-hr-apprrr.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/hr-apprrr/counties.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/hr-apprrr/counties.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files data/hr-apprrr/counties.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Explotaciones, ARKOD y viñedo por provincia de Croacia (APPRRR)" data/hr-apprrr/counties.json data/hr-apprrr-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
