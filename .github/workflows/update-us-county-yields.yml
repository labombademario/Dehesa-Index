# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update US county yields, harvested area and production (USDA NASS Quick Stats)
on:
  schedule:
    - cron: '25 7 8 * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'true = volver a pedir los 10 anos de todos los cultivos (por defecto solo los 3 ultimos)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: dehesa-us-county-yields
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-us-county-yields.py ${{ github.event.inputs.full == 'true' && '--full' || '' }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        timeout-minutes: 50
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/us-county/status.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/us-county/status.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/us-county)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Datos rendimiento, superficie cosechada y produccion por condado de EE. UU. (USDA NASS)" data/us-county/status.json data/us-county-yields-log.txt data/us-county data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
