name: TMP probe
on:
  push:
    paths: ['.github/workflows/tmp-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Reproducir EU Agri-food + motor de precios
        continue-on-error: true
        run: |
          mkdir -p tmp-probe
          node scripts/update-eu-agrifood.mjs cerdo vaca cordero pollo huevos azucar oliva arroz maiz trigo cebada avena colza centeno mantequilla leche_polvo dap potasa leche harina_soja > tmp-probe/fetch.txt 2>&1 || echo "fetch rc=$?" >> tmp-probe/fetch.txt
          for c in "node scripts/validate-snapshots.mjs" "node scripts/build-data-index.mjs" "node scripts/build-csv.mjs" "node scripts/build-data-quality.mjs" "node scripts/build-intelligence.mjs" "node scripts/build-normalized-data.mjs" "node scripts/build-cross-market.mjs" "node scripts/build-dehesa-index.mjs" "node scripts/build-alert-signals.mjs" "python3 scripts/build-price-views.py"; do
            echo "== $c" >> tmp-probe/engine.txt
            $c >> tmp-probe/engine.txt 2>&1 || { echo "FALLO rc=$?" >> tmp-probe/engine.txt; break; }
          done
          echo "== validate" >> tmp-probe/engine.txt
          python3 scripts/validate-data.py --no-report --files data/latest.json data/history.json data/normalized.json data/quality.json data/intelligence.json data/cross-market.json data/catalog.json >> tmp-probe/engine.txt 2>&1 || echo "validate FALLO" >> tmp-probe/engine.txt
          python3 scripts/validate-data.py --consistency >> tmp-probe/engine.txt 2>&1 || echo "consistency FALLO" >> tmp-probe/engine.txt
          git checkout -- . 
      - name: Subir salida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tmp-probe
          git commit -qm "TMP probe output" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash && git push && exit 0; sleep 5; done
