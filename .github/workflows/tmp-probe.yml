name: TMP probe MARS (borrar)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-24.04
    env:
      MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p scripts/tmp
          for s in 1083 1084 1085 1092; do
            curl -fsSL -u "$MARS_API_KEY:" -H 'Accept: application/json' "https://marsapi.ams.usda.gov/services/v1.2/reports/$s?allSections=true" -o scripts/tmp/cheese-$s.json || echo "fail $s"
          done
          ls -la scripts/tmp
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tmp; git commit -qm "TMP: sondeo queso MARS"; git pull -q --rebase --autostash; git push
