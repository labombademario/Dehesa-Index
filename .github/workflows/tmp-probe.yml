name: TMP probe
on:
  push:
    paths: ['.github/workflows/tmp-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Reproducir el fallo de us-cash-bids
        continue-on-error: true
        env:
          USDA_MMN_API_KEY: ${{ secrets.USDA_MMN_API_KEY }}
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: |
          mkdir -p tmp-probe
          python3 scripts/update-us-cash-bids.py --discover --backfill-days 0 > tmp-probe/fetch.txt 2>&1 || echo "fetch rc=$?" >> tmp-probe/fetch.txt
          git ls-files -m -o --exclude-standard data/us-cash-bids > tmp-probe/files.txt
          python3 scripts/validate-data.py --no-report --files $(grep -v '^tmp-probe' tmp-probe/files.txt) > tmp-probe/qa.txt 2>&1 || echo "qa rc=$?" >> tmp-probe/qa.txt
          python3 scripts/validate-data.py --consistency > tmp-probe/consistency.txt 2>&1 || echo "cons rc=$?" >> tmp-probe/consistency.txt
          git checkout -- data
      - name: Subir salida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tmp-probe
          git commit -qm "TMP probe output" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash && git push && exit 0; sleep 5; done
# rerun
