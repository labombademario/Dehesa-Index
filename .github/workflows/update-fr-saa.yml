# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France annual agricultural statistics by region and department (Agreste SAA)
on:
  schedule:
    - cron: '20 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fr-saa
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fr-saa.py
        timeout-minutes: 35
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/france-saa/index.json data/france-saa-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/france-saa/index.json data/france-saa-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/france-saa) data/france-saa-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Estadistica agricola anual de Francia por region y departamento (Agreste SAA)" data/france-saa/index.json data/france-saa-stats.json data/france-saa-log.txt data/france-saa data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
