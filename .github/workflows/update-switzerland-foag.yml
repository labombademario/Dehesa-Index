# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Switzerland (FOAG market data)
on:
  schedule:
    - cron: '20 6 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-switzerland-foag
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-ch-foag.py
        timeout-minutes: 20
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/switzerland-foag-stats.json data/ch-chain.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/switzerland-foag-stats.json data/ch-chain.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Suiza (FOAG, mercados agrarios)" data/switzerland-foag-stats.json data/ch-chain.json data/switzerland-foag-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
