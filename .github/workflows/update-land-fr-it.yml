# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France and Italy farmland prices (Agreste, CREA)
on:
  schedule:
    - cron: '40 7 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-land-fr-it
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -q >/dev/null
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-land-fr-it.py
        timeout-minutes: 12
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/france-land/land.json data/italy-land/land.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/france-land/land.json data/italy-land/land.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/france-land data/italy-land)
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Precio de la tierra de Francia por departamento (Agreste) e Italia por región (CREA)" data/france-land/land.json data/italy-land/land.json data/land-fr-it-log.txt data/france-land data/italy-land data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
