# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update monthly rainfall and temperature averaged over each NUTS 2 region (NASA POWER grid)
on:
  schedule:
    - cron: '25 6 6,16 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-region-grid-climate
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: pip install shapely
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-region-grid-climate.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/region-grid-climate/EL.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/region-grid-climate/EL.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Lluvia y temperatura por región (media de la rejilla de NASA POWER)" data/region-grid-climate/EL.json data/region-grid-climate-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
