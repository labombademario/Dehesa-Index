name: Update Austria (Eurostat)
on:
  schedule:
    - cron: '25 16 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo ok
      - run: python3 scripts/update-austria.py
      - name: Validar datos (esquema y tests) antes de commit
        run: |
          python3 scripts/validate-data.py --no-report --files data/austria-stats.json || { echo '::error::datos invalidos: se descarta el cambio'; git checkout -- data/austria-stats.json; }
          python3 scripts/detect-revisions.py data/austria-stats.json || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/austria-stats.json data/austria-log.txt data/revisions.json
          git diff --cached --quiet && exit 0
          git commit -qm "Datos Austria (Eurostat)"
          git pull -q --rebase
          git push
