# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany wine, timber, farm structure, hatcheries and aquaculture (Destatis)
on:
  schedule:
    - cron: '50 15 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-germany-extra
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-germany-destatis-extra.py
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
        timeout-minutes: 15
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/germany-extra-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/germany-extra-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Alemania vino, madera, estructura, incubadoras y acuicultura (Destatis)" data/germany-extra-stats.json data/germany-extra-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
