# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update England farm structure by county (Defra June survey)
on:
  schedule:
    - cron: '35 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-uk-structure
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-uk-structure.py
        timeout-minutes: 15
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/uk-structure.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/uk-structure.json
      - name: Publicar
        if: always()
        run: bash scripts/publish-data.sh "Estructura agraria de Inglaterra por condado (Defra, encuesta de junio)" data/uk-structure.json data/uk-structure-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
