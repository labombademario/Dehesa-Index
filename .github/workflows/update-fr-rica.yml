# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update France farm accounts by farm type, size and region (Agreste RICA)
on:
  schedule:
    - cron: '40 8 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-fr-rica
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-fr-rica.py
        timeout-minutes: 20
        continue-on-error: true
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        if: always()
        uses: ./.github/actions/validate-files
        with:
          files: data/france-rica/index.json data/france-rica-stats.json
      - name: Detectar revisiones oficiales
        if: always()
        run: python3 scripts/detect-revisions.py data/france-rica/index.json data/france-rica-stats.json
      - id: qa
        name: Control de calidad antes de publicar (si falla, no se publica)
        if: always()
        run: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/france-rica) data/france-rica-stats.json
        continue-on-error: true
      - name: Publicar
        if: always() && steps.qa.outcome != 'failure'
        run: bash scripts/publish-data.sh "Cuentas de las explotaciones de Francia por orientacion, tamano y region (Agreste RICA)" data/france-rica/index.json data/france-rica-stats.json data/france-rica-log.txt data/france-rica data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }} ${{ steps.qa.outcome }}
