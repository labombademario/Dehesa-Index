# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Czechia (CSU open data, prices, inputs, harvest and sown area)
on:
  schedule:
    - cron: '50 7 4,17 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-czechia-csu
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-cz-csu.py
        timeout-minutes: 12
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/czechia-csu-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/czechia-csu-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "Datos Chequia (CSU, datos abiertos de precios, insumos, cosecha y superficie)" data/czechia-csu-stats.json data/czechia-csu-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
