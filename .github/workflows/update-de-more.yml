# GENERADO por scripts/gen-workflows.py a partir de sources.yml. No editar a mano.
name: Update Germany food HICP and agricultural employment and value added by Land (Eurostat, VGRdL)
on:
  schedule:
    - cron: '20 8 18 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dehesa-de-more
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: pip install openpyxl
      - id: fetch
        run: bash scripts/annotate-failure.sh python3 scripts/update-de-more.py
      - name: Validar datos (esquema y tests); lo invalido se descarta y la ejecucion queda en rojo
        uses: ./.github/actions/validate-files
        with:
          files: data/germany-more-stats.json
      - name: Detectar revisiones oficiales
        run: python3 scripts/detect-revisions.py data/germany-more-stats.json
      - name: Publicar
        run: bash scripts/publish-data.sh "IPCA de alimentos y ocupados y valor añadido agrario por Land de Alemania" data/germany-more-stats.json data/germany-more-log.txt data/revisions.json
      - name: Cierre (rojo si hubo datos invalidos o un paso fallo)
        if: always()
        uses: ./.github/actions/finish
        with:
          outcomes: ${{ steps.fetch.outcome }}
