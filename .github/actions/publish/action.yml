name: Publicar datos (commit con reintentos)
description: Hace git add de las rutas indicadas, commit y push con reintentos. Falla en rojo si no se puede publicar.
inputs:
  paths:
    description: Rutas obligatorias separadas por espacios (git add falla si no existen)
    required: false
    default: ''
  preset:
    description: "'price-engine' anade las rutas que produce la accion price-engine (snapshots, latest, prices, history, catalog.json, quality, intelligence, normalized, cross-market, dehesa-index, alerts, revisions)"
    required: false
    default: ''
  optional:
    description: Rutas opcionales separadas por espacios (se anaden solo si existen)
    required: false
    default: ''
  message:
    description: Mensaje del commit
    required: true
  user:
    description: Nombre del autor del commit
    required: false
    default: 'github-actions[bot]'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        PRESET: ${{ inputs.preset }}
        OPTIONAL: ${{ inputs.optional }}
        MESSAGE: ${{ inputs.message }}
        AUTHOR: ${{ inputs.user }}
      run: |
        case "$PRESET" in
          '') ;;
          price-engine) export PUBLISH_REGEN="bash scripts/regen-price-engine.sh"
            export PUBLISH_DERIVED="data/latest.json data/prices data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/dehesa-index-ca.json data/alerts.json"
            PATHS="$PATHS data/snapshots data/latest.json data/prices data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/dehesa-index-ca.json data/alerts.json data/revisions.json" ;;
          *) echo "::error::preset desconocido: $PRESET"; exit 1 ;;
        esac
        git add -- $PATHS
        for p in $OPTIONAL; do [ -e "$p" ] && git add -- "$p"; done
        PUBLISH_AUTHOR="$AUTHOR" bash scripts/publish-data.sh "$MESSAGE"
