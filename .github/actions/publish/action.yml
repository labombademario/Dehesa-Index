name: Publicar datos (commit con reintentos)
description: Hace git add de las rutas indicadas, commit y push con reintentos. Falla en rojo si no se puede publicar.
inputs:
  paths:
    description: Rutas obligatorias separadas por espacios (git add falla si no existen)
    required: false
    default: ''
  preset:
    description: "'price-engine' anade las rutas que produce la accion price-engine (snapshots, latest, prices, history, catalog.json, quality, intelligence, normalized, cross-market, dehesa-index, alerts, revisions)"
    required: false
    default: ''
  optional:
    description: Rutas opcionales separadas por espacios (se anaden solo si existen)
    required: false
    default: ''
  message:
    description: Mensaje del commit
    required: true
  user:
    description: Nombre del autor del commit
    required: false
    default: 'github-actions[bot]'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        PRESET: ${{ inputs.preset }}
        OPTIONAL: ${{ inputs.optional }}
        MESSAGE: ${{ inputs.message }}
        AUTHOR: ${{ inputs.user }}
      run: |
        git config user.name "$AUTHOR"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        case "$PRESET" in
          '') ;;
          price-engine) PATHS="$PATHS data/snapshots data/latest.json data/prices data/history.json data/catalog.json data/history.csv data/quality.json data/intelligence.json data/normalized.json data/cross-market.json data/dehesa-index.json data/dehesa-index-us.json data/dehesa-index-ca.json data/alerts.json data/revisions.json" ;;
          *) echo "::error::preset desconocido: $PRESET"; exit 1 ;;
        esac
        git add -- $PATHS
        for p in $OPTIONAL; do [ -e "$p" ] && git add -- "$p"; done
        if git diff --cached --quiet; then echo "Sin cambios que publicar"; exit 0; fi
        git commit -qm "$MESSAGE"
        for i in 1 2 3 4 5 6; do
          git pull -q --rebase --autostash origin main && git push && exit 0
          # Un rebase a medias hace fallar todos los reintentos siguientes: se aborta y se vuelve a intentar limpio
          git rebase --abort 2>/dev/null || true
          sleep $((i * 5 + RANDOM % 10))
        done
        echo "::error::no se pudo publicar tras 6 intentos"; exit 1
