    continue: true
    check: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/spain-land)
    data: [spain-land/land.json, spain-land-log.txt]
    extra: ['!data/spain-land']
    message: Precio de la tierra y cánones de arrendamiento de España por comunidad y provincia (MAPA)
  - id: land-fr-it
    name: Update France and Italy farmland prices (Agreste, CREA)
    cron: ['40 7 3 * *']
    script: scripts/update-land-fr-it.py
    pre: ['sudo apt-get update -q >/dev/null', 'sudo apt-get install -y -q poppler-utils >/dev/null', 'pip install openpyxl']
    timeout: 20
