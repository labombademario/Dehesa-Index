# Dehesa Index — definición de los pipelines de datos "estándar" (una fuente -> un script -> uno o varios JSON).
# Los workflows .github/workflows/update-<id>.yml de estas fuentes se GENERAN con `python3 scripts/gen-workflows.py` (no se editan a mano).
# `python3 scripts/gen-workflows.py --check` falla si algún workflow generado no coincide con este fichero (lo ejecuta quality.yml).
# Campos: id, name, cron (lista), script, pre (comandos previos), args, env, dispatch_inputs, timeout (job, min), script_timeout (min),
#         continue (el script puede fallar y aun así se valida y se publica lo que haya), data (JSON validados y revisados),
#         extra (otros ficheros a publicar), log, message (mensaje de commit).
sources:
  - id: spain
    name: Update Spain (MAPA)
    cron: ['35 14 * * 2,5']
    script: scripts/update-mapa-spain.py
    data: [spain-stats.json]
    log: spain-log.txt
    message: Datos España (MAPA)
  - id: france
    name: Update France (FranceAgriMer)
    cron: ['10 15 * * 2,5']
    pre: ['pip install openpyxl xlrd']
    script: scripts/update-france.py
    data: [france-stats.json]
    log: france-log.txt
    message: Datos Francia (FranceAgriMer)
  - id: germany
    name: Update Germany (BLE, Destatis)
    cron: ['30 15 * * 1,4']
    script: scripts/update-germany.py
    data: [germany-stats.json]
    log: germany-log.txt
    message: Datos Alemania (BLE, Destatis)
  - id: austria
    name: Update Austria (Eurostat)
    cron: ['25 16 * * 2,5']
    script: scripts/update-austria.py
    data: [austria-stats.json]
    log: austria-log.txt
    message: Datos Austria (Eurostat)
  - id: belgium
    name: Update Belgium (Statbel)
    cron: ['45 15 * * 2,5']
    pre: ['pip install openpyxl xlrd']
    script: scripts/update-belgium.py
    data: [belgium-stats.json]
    log: belgium-log.txt
    message: Datos Bélgica (Statbel)
  - id: portugal
    name: Update Portugal (INE)
    cron: ['40 16 * * 2,5']
    script: scripts/update-portugal.py
    args: '${{ github.event.inputs.mode }}'
    script_timeout: 25
    dispatch_inputs:
      mode: {description: 'olive = solo aceite de oliva (rápido); vacío = todo', required: false, default: ''}
    data: [portugal-stats.json]
    log: portugal-log.txt
    message: Datos Portugal (INE)
  - id: portugal-eurostat
    name: Update Portugal (Eurostat)
    cron: ['55 16 * * 2,5']
    script: scripts/update-portugal-eurostat.py
    data: [portugal-eurostat-stats.json]
    log: portugal-eurostat-log.txt
    message: Datos Portugal (Eurostat)
  - id: canada-stats
    name: Update Canada stats (Statistics Canada)
    cron: ['35 15 * * 1,4']
    script: scripts/update-canada-stats.py
    env: {ONLY: '${{ github.event.inputs.only }}'}
    dispatch_inputs:
      only: {description: 'Funciones a ejecutar (vacío = todas), p. ej. trade', required: false, default: ''}
    timeout: 30
    script_timeout: 20
    continue: true
    data: [canada-stats.json]
    log: canada-stats-log.txt
    message: Datos Canadá (Statistics Canada)
  - id: country-macro
    name: Update country macro indicators
    cron: ['15 7 3 * *']
    script: scripts/update-country-macro.py
    timeout: 10
    continue: true
    data: [country-macro.json]
    log: country-macro-log.txt
    message: Indicadores macro por país
  - id: us-tariffs
    name: Update US tariffs (USITC HTS)
    cron: ['20 8 * * 2,5']
    script: scripts/update-us-tariffs.py
    timeout: 30
    script_timeout: 20
    continue: true
    data: [us-tariffs.json]
    log: us-tariffs-log.txt
    message: Datos aranceles EE. UU. (USITC HTS)
  - id: usda-calendar
    name: Update USDA release calendar (NASS + WASDE)
    cron: ['40 6 * * 1-5']
    script: scripts/update-usda-calendar.py
    timeout: 15
    script_timeout: 10
    continue: true
    data: [usda-calendar.json]
    message: Calendario oficial USDA (NASS y WASDE)
  - id: cattle-on-feed
    name: Update USDA Cattle on Feed (NASS)
    cron: ['50 21 * * 5']
    script: scripts/update-cattle-on-feed.py
    timeout: 15
    script_timeout: 10
    continue: true
    data: [cattle-on-feed.json]
    message: Datos Cattle on Feed (USDA NASS)
  - id: us-dairy
    name: Update US dairy prices (USDA AMS NDPSR)
    cron: ['20 20 * * 3', '20 14 * * 4']
    script: scripts/update-us-dairy.py
    timeout: 15
    script_timeout: 10
    continue: true
    data: [us-dairy.json]
    message: Datos lacteos EE. UU. (USDA AMS NDPSR)
  - id: us-lamb
    name: Update US lamb cutout (USDA AMS LM_XL502)
    cron: ['30 20 * * 1-5']
    script: scripts/update-us-lamb.py
    timeout: 15
    script_timeout: 10
    continue: true
    data: [us-lamb.json]
    message: Datos cordero EE. UU. (USDA AMS LM_XL502)
  - id: canada-grain
    name: Update Canada weekly grain statistics (Canadian Grain Commission)
    cron: ['40 16 * * 3,4,5']
    script: scripts/update-canada-grain.py
    timeout: 20
    script_timeout: 12
    continue: true
    data: [canada-grain.json]
    message: Datos semanales de granos de Canada (Canadian Grain Commission)
  - id: eu-vat
    name: Update EU VAT rates (TEDB)
    cron: ['10 5 2 * *']
    script: scripts/update-eu-vat.py
    timeout: 15
    script_timeout: 10
    continue: true
    data: [eu-vat.json]
    message: Tipos de IVA UE (TEDB, Comision Europea)
  - id: eu-drought
    name: Update EU drought (EDO Combined Drought Indicator)
    cron: ['40 7 * * *']
    pre: ['python3 -m pip install --quiet numpy netCDF4 shapely']
    script: scripts/update-eu-drought.py
    timeout: 20
    script_timeout: 15
    continue: true
    data: [eu-drought.json]
    message: Datos sequia Europa (EDO CDI)
  - id: canada-provinces
    name: Update Canada by province (Statistics Canada)
    cron: ['50 15 * * 3']
    script: scripts/update-canada-provinces.py
    timeout: 30
    script_timeout: 20
    continue: true
    data: [canada-provinces.json]
    message: Datos de Canada por provincia (Statistics Canada)
  - id: canada-drought
    name: Update Canada drought (Canadian Drought Monitor)
    cron: ['20 8 * * 2,4']
    pre: ['python3 -m pip install --quiet shapely']
    script: scripts/update-canada-drought.py
    timeout: 40
    script_timeout: 30
    continue: true
    data: [canada-drought.json]
    message: Datos sequia Canada (Canadian Drought Monitor)
  - id: eu-farm-economics
    name: Update EU farm costs and income (Eurostat EAA)
    cron: ['15 6 * * 3']
    script: scripts/update-eu-farm-economics.py
    timeout: 15
    script_timeout: 10
    continue: true
    data: [eu-farm-economics.json]
    message: Datos costes y renta agraria UE (Eurostat EAA)
  - id: au-trade
    name: Update Australia trade (ABS)
    cron: ['25 11 5 * *']
    script: scripts/update-au-trade.py
    timeout: 30
    script_timeout: 20
    continue: true
    data: [australia-trade-stats.json]
    extra: [au-trade-products.json]
    log: australia-trade-log.txt
    message: Datos comercio Australia (ABS)
  - id: eu-trade
    name: Update EU trade (Eurostat Comext)
    cron: ['40 9 16,18,22 * *']
    script: scripts/update-eu-trade.py
    timeout: 30
    script_timeout: 20
    continue: true
    data: [eu-trade-stats.json]
    extra: [eu-trade-products.json]
    log: eu-trade-log.txt
    message: Datos comercio exterior UE (Eurostat Comext)
  - id: interest-rates
    name: Update interest rates
    cron: ['45 6 * * 1-5']
    script: scripts/update-interest-rates.py
    timeout: 10
    continue: true
    data: [interest-rates-stats.json]
    log: interest-rates-log.txt
    message: Tipos de interés oficiales
  - id: fx-history
    name: Update historical exchange rates (ECB)
    cron: ['20 8 4 * *']
    script: scripts/update-fx-history.py
    timeout: 10
    continue: true
    data: []
    extra: [fx-history.json]
    log: fx-history-log.txt
    message: Tipos de cambio históricos (BCE)
  - id: seo-pages
    name: Rebuild SEO landing pages
    cron: ['10 5 * * *']
    runner: node
    script: scripts/build-seo-pages.mjs
    timeout: 10
    continue: true
    data: []
    extra: ['!datos', '!precios', '!en', '!fr', '!it', '!sitemap.xml']
    check: node scripts/qa-seo.mjs
    message: Páginas SEO por país y categoría
  - id: us-cash-bids
    name: Update US local cash bids (USDA AMS MARS)
    cron: ['15 14 * * 1-5', '30 23 * * 1-5']
    script: scripts/update-us-cash-bids.py
    args: '--discover --backfill-days ${{ github.event.inputs.backfill_days || 0 }}'
    env: {USDA_MMN_API_KEY: '${{ secrets.USDA_MMN_API_KEY }}', MARS_API_KEY: '${{ secrets.MARS_API_KEY }}'}
    dispatch_inputs:
      backfill_days: {description: 'Dias de historico a pedir por informe (0 = ventana normal de 21 dias; la primera carga de cada informe pide 400). Ej. 1100 para tres anos', required: false, default: '0'}
    timeout: 40
    script_timeout: 30
    continue: true
    check: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/us-cash-bids)
    data: [us-cash-bids/manifest.json, us-cash-bids/reports.json, us-cash-bids/ingestion-status.json, us-cash-bids/revisions.json]
    extra: ['!data/us-cash-bids']
    message: Datos precios locales de grano EE. UU. (USDA AMS MARS)
