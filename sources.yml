    continue: true
    check: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/france-land data/italy-land)
    data: [france-land/land.json, italy-land/land.json, land-fr-it-log.txt]
    extra: ['!data/france-land', '!data/italy-land']
    message: Precio de la tierra de Francia por departamento (Agreste) e Italia por región (CREA)
  - id: land-pl
