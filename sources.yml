# Dehesa Index — definición de los pipelines de datos "estándar" (una fuente -> un script -> uno o varios JSON).
# Los workflows .github/workflows/update-<id>.yml de estas fuentes se GENERAN con `python3 scripts/gen-workflows.py` (no se editan a mano).
# `python3 scripts/gen-workflows.py --check` falla si algún workflow generado no coincide con este fichero (lo ejecuta quality.yml).
# Campos: id, name, cron (lista), script, pre (comandos previos), args, env, dispatch_inputs, timeout (job, min), script_timeout (min),
#         continue (el script puede fallar y aun así se valida y se publica lo que haya), data (JSON validados y revisados),
#         extra (otros ficheros a publicar), log, message (mensaje de commit).
sources:
  - id: spain
    name: Update Spain (MAPA)
    cron: ['35 14 * * 2,5']
    pre: ['bash scripts/trust-fnmt.sh']
    script: scripts/update-mapa-spain.py
    data: [spain-stats.json]
    log: spain-log.txt
    message: Datos España (MAPA)
  - id: france
    name: Update France (FranceAgriMer)
    cron: ['10 15 * * 2,5']
    pre: ['pip install openpyxl xlrd']
    script: scripts/update-france.py
    data: [france-stats.json]
    log: france-log.txt
    message: Datos Francia (FranceAgriMer)
  - id: germany
    name: Update Germany (BLE, Destatis)
    cron: ['30 15 * * 1,4']
    script: scripts/update-germany.py
    env: {GENESIS_TOKEN: '${{ secrets.GENESIS_TOKEN }}'}
    data: [germany-stats.json, germany-agri.json]
    log: germany-log.txt
    message: Datos Alemania (BLE, Destatis)
  - id: germany-livestock
    name: Update Germany livestock (Destatis)
    cron: ['40 15 * * 3']
    script: scripts/update-germany-livestock.py
    env: {GENESIS_TOKEN: '${{ secrets.GENESIS_TOKEN }}'}
    data: [germany-livestock.json]
    log: germany-livestock-log.txt
    message: Datos Alemania ganaderia y huevos (Destatis)
  - id: spain-crops
    name: Update Spain crop areas and production by province (MAPA)
    cron: ['50 6 * * 4']
    script: scripts/update-spain-crops.py
    pre: ['bash scripts/trust-fnmt.sh', 'pip install openpyxl']
    timeout: 30
    script_timeout: 20
    continue: true
    check: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/spain-crops)
    data: [spain-crops/index.json, spain-crops-log.txt]
    extra: ['!data/spain-crops']
    message: Datos superficies y producciones de cultivos de España por provincia (MAPA)
  - id: spain-livestock
    name: Update Spain livestock headcounts by province (MAPA)
    cron: ['20 7 * * 4']
    script: scripts/update-spain-livestock.py
    pre: ['bash scripts/trust-fnmt.sh', 'pip install openpyxl']
    timeout: 30
    script_timeout: 20
    continue: true
    check: python3 scripts/validate-data.py --no-report --files $(git ls-files -m -o --exclude-standard data/spain-livestock)
    data: [spain-livestock/index.json, spain-livestock-log.txt]
    extra: ['!data/spain-livestock']
    message: Datos efectivos de ganado de España por provincia (MAPA)
  - id: spain-land
    name: Update Spain farmland prices and rents by region and province (MAPA)
    cron: ['25 8 * * 2']
    script: scripts/update-spain-land.py
    pre: ['bash scripts/trust-fnmt.sh', 'pip install openpyxl']
    timeout: 20
